  /felhasznalok/{felhasznaloAzonosito}/jogosultsagok:
    put:
      tags: [hozzaferes]
      operationId: jogosultsagokatBeallit
      summary: A felhasznalo jogai EGY hatokorben
      description: |
        A megadott hatokorre vonatkozo **teljes** halmazt allitja be: ami nincs
        a listaban, az elkerul. Igy a felulet mindig azt kuldi, amit a
        kepernyon lat, es nincs "hozzaad/elvesz" parositas, ami kicsuszhat.

        ⚠️ **A BUROK MINDKET IRANYBAN ALL:** a hozzaadott ES az elvett jogoknak
        is meg kell lenniuk a muveletet vegzonel. Az elvetes korlatja a
        gyakrabban elfelejtett, es nem tobb joggal sul el, hanem **benitassal**:
        enelkul egy szuk jogu adminisztrator kizarhatna a lanc vezetojet.
      parameters:
        - $ref: '#/components/parameters/Telephely'
        - $ref: '#/components/parameters/FelhasznaloAzonosito'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JogosultsagKeres'
      responses:
        '200':
          description: A felhasznalo, a modositott jogokkal
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FelhasznaloReszletek'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          description: |
            Nincs jogosultsag, VAGY a **burok** fogott (`BUROK`), VAGY a cel
            erosebb szinten all (`EROSEBB_SZINT`), VAGY a **kizaras elleni
            vedelem** (`KIZARAS`): magadat nem tilthatod ki, es az utolso
            felhasznalokezelot sem.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '404':
          $ref: '#/components/responses/Hiba404'
        '422':
          $ref: '#/components/responses/Hiba422'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

  /szerepek:
    get:
      tags: [hozzaferes]
      operationId: szerepek
      summary: A PULTOS szerepek, szintekkel
      description: |
        ⚠️ **SZEREPKOR CSAK A PULTOS OLDALON VAN.** A Ziggurat-fiokoknal nincs:
        ott felhasznalonkenti jog all, sablonbol indulva. Ez nem hianyossag,
        hanem dontes: az irodista, a konyvelo es a teruleti vezeto **nem
        rendezheto egy sorba**, es a rangsor ott ertelmetlen
        osszehasonlitasokat kenyszeritene ki.

        A `szint` **kisebb szam = erosebb**; a 0. szint a Siduri rendszergazdae.
        A `jogosultsagok` itt a szerep **sajat** jogai - a szint szerinti
        oroklest a kiszolgalo szamolja, amikor a telephelyre kuldi.
      parameters:
        - $ref: '#/components/parameters/Telephely'
      responses:
        '200':
          description: A szerepek
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                type: object
                required: [szerepek]
                properties:
                  szerepek:
                    type: array
                    items:
                      $ref: '#/components/schemas/Szerep'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
