      operationId: siduriBerlok
      summary: A berlovalaszto listaja
      description: |
        Minden berlo, nev szerint. Kapcsolo: `IDEGEN_BERLO`, `BERLO_REGISZTRACIO`,
        `TELEPITESI_JEGY` (1.13.0) vagy `TANUSITVANY_VISSZAVONAS` (1.15.0) - a lista
        a belepeshez, a regisztraciohoz, a telepiteshez es a visszavonashoz is kell.
        A belepeshez maga tovabbra is `IDEGEN_BERLO` kell.
      responses:
        '200':
          description: A berlok
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                type: object
                required: [berlok]
                properties:
                  berlok:
                    type: array
                    items:
                      $ref: '#/components/schemas/BerloRovid'
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

    post:
      tags: [siduri]
      operationId: berlotRegisztral
      summary: Uj berlo regisztralasa - az elso telephellyel es a tulajdonosi fiokkal
      description: |
        Kapcsolo: `BERLO_REGISZTRACIO`.

        Egy lepesben keletkezik: a berlo (sajat semaval), az ELSO telephely, es
        a **tulajdonosi Ziggurat-fiok** - globalisan a berloi katalogus MINDEN
        jogaval es az abszolut jogosultsagkezelessel (HOZZAFERES.md 4.4/b). A
        tulajdonos e-mailes meghivot kap.

        ⚠️ **A ROVID NEV GYAKORLATILAG VEGLEGES:** ez minden bejelentkezesi nev
        eloTagja (`<rovidNev>.<azonosito>`). A `siduri` tiltott.

        ⚠️ A telepitesi jegy NEM keletkezik vele - kulon, kezzel.
      requestBody:
