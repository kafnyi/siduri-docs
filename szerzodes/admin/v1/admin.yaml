  /kategoriak/{kategoriaAzonosito}/{mezo}:
    put:
      tags: [torzsadat]
      operationId: kategoriaMezot
      summary: Egy kategoria-mezo irasa - O3, mint a termeknel (1.16.0)
      description: |
        Jog: `kategoria.kezeles`. Mindket oldalon. A mezo es a torzs:

          - `megnevezes`: `nev`
          - `szulo`: `szuloId` (null = gyokerszint) - az ATHELYEZES. A teljes
            reszfa szintje ujraszamolodik; legfeljebb 4 szint (MELYSEG), es sajat
            leszarmazott ala nem kerulhet (KOR) - 422, az adatbazis kenyszeriti.
          - `allapot`: `aktiv`
          - `afa`: `afaHelyben`, `afaElvitel` - afakategoria-azonositok; null =
            a szulotol orokli. ⚠️ A termekekre NEM irodik vissza automatikusan
            (C3/c).
          - `ntak`: `ntakFokategoria`, `ntakAlkategoria`

        A vesztes iras 409 (KESOBBI_ERTEK_ALL).
      parameters:
        - $ref: '#/components/parameters/Telephely'
        - name: kategoriaAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        - name: mezo
          in: path
          required: true
          schema:
            type: string
            enum: [megnevezes, szulo, allapot, afa, ntak]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KategoriaMezoKeres'
      responses:
        '200':
          description: A modositott kategoria
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KategoriaReszletek'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '404':
          $ref: '#/components/responses/Hiba404'
        '409':
          description: AZ IRAS VESZTETT (KESOBBI_ERTEK_ALL), vagy a nev foglalt ugyanazon szulo alatt (FOGLALT_NEV).
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

  /termekek:
    get:
      tags: [torzsadat]
      operationId: termekek
      summary: Termeklista, lapozva
      description: |
        A LAPOZAS KURZOROS, nem eltolas-alapu. Egy 400 tetelt gorgeto listaban
        az eltolas-alapu lapozas kozben beszurt sor miatt a felhasznalo egy
        sort ketszer lat, egy masikat pedig soha - es ezt sosem jelenti be
        hibakent, mert nem veszi eszre.

        Az OSSZESEN a szurt eredmeny teljes darabszama, nem az oldale. Azert
        kell, mert az export a TELJES szurt eredmenyt adja majd, es ezt a
        feluletnek elore ki kell irnia (EXPORT_IMPORT §2.2).
      parameters:
        - $ref: '#/components/parameters/Telephely'
        - $ref: '#/components/parameters/Kurzor'
        - $ref: '#/components/parameters/Limit'
        - name: kategoriaId
          in: query
          required: false
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
          description: >
            Csak az adott kategoria termekei - a kategoria LESZARMAZOTTAIVAL
            egyutt. Az a felhasznaloi elvaras, hogy az "Italok" alatt a
            "Uditok" is ott legyen.
        - name: kereses
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: >
            Reszlet a megnevezesben vagy a vonalkodban, kis- es nagybetu
            kulonbsege nelkul.
        - name: aktiv
          in: query
          required: false
          schema:
            type: boolean
          description: Ha hianyzik, mindketto jon.
      responses:
        '200':
          description: Egy oldalnyi termek
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                type: object
                required: [termekek, osszesen]
                properties:
                  termekek:
                    type: array
                    items:
                      $ref: '#/components/schemas/TermekSor'
                  osszesen:
                    type: integer
                    format: int64
                    description: A szurt eredmeny teljes darabszama.
                    examples: [4312]
                  kovetkezoKurzor:
                    type: string
                    description: >
                      A kovetkezo oldal kurzora. HIANYZIK, ha nincs tobb oldal -
                      nem ures szoveg, mert az "van meg, csak ures" jelentessel
                      keveredne.
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

  /termekek/{termekAzonosito}:
