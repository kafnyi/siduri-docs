openapi: 3.1.0

info:
  title: Siduri adminprotokoll (K2)
  version: 1.16.0
  summary: A webes admin alkalmazas a felhovel ES a telephelyi szerverrel
  license:
    name: Zart - Myth System tulajdona
    identifier: LicenseRef-MythSystem-Zart
  description: |
    A K2 szerzodes: EGY webes admin alkalmazas, KET helyrol kiszolgalva - a
    felhobol, es internetkimaradas eseten a telephely sajat szervererol
    (spec §22.2).

    ⚠️ KET MEGVALOSITASA VAN, ES UGYANAZ A SZERZODESTESZT FUT MINDKETTON.
    Ez teszi a "egy admin, ket helyrol kiszolgalva" igeretet gepi kenyszerre.
    Amig csak az egyik megvalositas letezik, a teszt egy oldalon fut - ezt
    kimondjuk, nem takarjuk el.

    AZ 1.0.0 CSAK OLVASAS VOLT. Az 1.1.0 hozza az ELSO IRAST: a kiszereles
    brutto ara.

    ⚠️ AZ IRAS FELOLDASI SZABALYA (NYITOTT_KERDESEK O3, korabban W3): a
    torzsadatot a felho ES a telephely is irhatja, es az utkozest MEZONKENTI
    IDOBELYEG oldja fel - a kesobbi iras nyer, emberi feloldas nincs. Ezert:

      - minden irhato mezo mellett megy a MEZOEREDET (mikor, es melyik oldalrol
        kapta a mostani erteket). A felulet enelkul nem tudna megmutatni, hogy
        egy valtoztatas elveszett;
      - a vesztes iras NEM tunik el, csak nem ervenyes: az audit-lancba kerul;
      - a sorrendet ket gep FALI ORAJA donti el. Ez ismert kockazat, kimondva:
        ha a telephelyi gep oraja siet, egy korabbi helyi iras legyozhet egy
        kesobbi felhoset.

    A mennyisegi, futo allapotra (keszlet, forgalom, kassza) ez NEM vonatkozik -
    az kizarolag telephely-autoritativ.

    ⚠️ A ZAROLAS NEM UTKOZES, HANEM HATASKOR (B16.3). Egy magasabb szinten
    (lanc/franchise kozpont) zarolt ertek IDOBELYEGTOL FUGGETLENUL nyer: a
    telephely nem irhatja at. Ezert:

      - a zarolt mezo mellett megy a ZAROLAS a valaszban. A felulet enelkul csak
        annyit tudna, hogy az iras elbukott - a menedzser pedig ujra es ujra
        probalkozna, es azt hinne, elromlott a rendszer;
      - a felulet MONDJA MEG, hogy zarolt, es ne csak visszautasitsa;
      - a kikenyszerites NEM a feluleten mulik: a kiszolgalo utasitja el.

    AMIT EZ A SZELET SZERKEZETILEG ROGZIT, mert utolag nem teheto bele:
      - a telephely megnevezese MINDEN keresen (spec §22.3: tobb telephely)
      - a valaszban LATSZIK, melyik oldal szolgalt ki (felho vagy telephely)
      - kurzoros lapozas: a lista noni fog, es az eltolas-alapu lapozas
        beszuras kozben sorokat ismetel vagy ejt
      - penz egesz forintban (I1), afakulcs masolatkent, nem hivatkozaskent

    HIANYOK, KIMONDVA - egyik sem feledekenyseg:
      - BEJELENTKEZES ES MUNKAMENET: a token megszerzese a K2 kesobbi szelete.
        Ez a szelet mar hitelesitett allapotbol indul.
      - EXPORT ES IMPORT: a K2 resze lesz, egyetlen kozos szolgaltataskent
        minden listas nezethez (EXPORT_IMPORT §2.1) - nem kepernyonkent.
        Azert nincs meg benne, mert a konyvtarvalasztas nyitott: az Apache POI
        es a GraalVM nativ forditas utkozik (EXPORT_IMPORT §6.1).
      - CSAK HELYI FUNKCIOK (eszkozszerep, nyomtato-atiranyitas, integracio
        ideiglenes tiltasa): kulon utvonalcsoportba kerulnek, mert ezeknek a
        felhoben NINCS parjuk, es offline is mukodniuk kell (WEBADMIN_STACK
        §13.4). Ures csoportot nem adunk ki.
      - IDOKORLATOS LISTAK: a telephelyrol kiszolgalt admin 30 napnal regebbi
        adatot nem tud mutatni, es ezt a valaszban meg kell mondania (spec
        §22.2). Ebben a szeletben NINCS idokorlatos adat - a torzsadat nem az -,
        ezert nincs ilyen mezo. A kimutatasoknal kotelezo lesz.

servers:
  - url: https://{felho}/admin/v1
    description: A felho - a napi adminisztracio helye
    variables:
      felho:
        default: ziggurat.mythsystem.hu
  - url: https://{telephelyiSzerver}/admin/v1
    description: A telephelyi szerver - offline tartalek es helyi beallitasok
    variables:
      telephelyiSzerver:
        default: siduri.helyi

security:
  - MunkamenetSuti: []
  - MunkamenetToken: []

tags:
  - name: bejelentkezes
    description: |
      Belepes, kijelentkezes, munkamenet, meghivo es elfelejtett jelszo (1.7.0).
      A teljes dontes: siduri-docs/BEJELENTKEZES.md.

      ⚠️ KET KAPU, ES A TELEPHELYI CSAK KIMARADASKOR NYITOTT. A felhoben nev +
      jelszo; a telephelyen pultos azonosito + PIN - de CSAK ha a felho nem
      erheto el. Ha elerheto, a telephely a felhos Zigguratra kuld
      (FELHORE mod), es a PIN-es kapu 409-cel zar.
  - name: siduri
    description: |
      A Siduri belso kollegafiokjai (1.10.0) - HOZZAFERES.md 4. A teljes
      dontes ott all.

      ⚠️ **CSAK A FELHO VALOSITJA MEG** (a telephelyi szerver `CSAK_A_FELHOBEN`
      501-et ad). A kollegafiok a berlokon KIVUL el: a bejelentkezesi neve
      `siduri.<nev>`, es a `siduri` rovid nevet berlo nem kaphatja meg.

      **A kollega munkamenete berlo nelkul indul.** Egy berlo adataihoz a
      berlovalasztoval lep be (`PUT /siduri/munkamenet/berlo`) - a belepes
      naplozodik, indok nelkul. Amig nincs valasztott berlo, a berloi
      vegpontok 403-at adnak `NINCS_BERLO_VALASZTVA` koddal.

      **A kapcsolok EGYENKENT adhatok** (HOZZAFERES.md 4.3). A Szuperadmin es a
      Manager mindet birja.

      **A kollegak kezelese (1.11.0):** kollegafiokok, jogkorok, a Manager
      rang es a negy szem elv kerelmei. A burok itt is ervenyes: csak azt a
      kapcsolot adhatod vagy veheted el, ami neked is megvan.

      ⚠️ **A BERLOI ADATON a kollega joga (1.10.0):** a Szuperadmin es a
      Manager MINDENT tehet, amit a berloi katalogus ismer; minden mas kollega
      CSAK OLVAS (a `*.megtekintes` jogok). A szerkeszto kollegajog kesobbi
      kapcsolo lesz.
  - name: torzsadat
    description: Kategoria es termek - amit a tulajdonos karbantart
  - name: hozzaferes
    description: |
      Ziggurat-felhasznalok es a jogosultsagaik.

      ⚠️ **EZEKET A VEGPONTOKAT CSAK A FELHO VALOSITJA MEG.** A telephelyi
      szerver hatarozott **501**-et ad (`CSAK_A_FELHOBEN` kod), nem veletlen
      404-et. A hozzaferes gazdaja a felho (HOZZAFERES.md), es a telephelyi
      szerver sajat maga nem dontheti el, ki lephet be a Zigguratba.

      Ezzel a szerzodes igerete ("egy admin, ket helyrol") **reszben serul**: van
      benne olyan resz, amit csak az egyik oldal tud. Ezt inkabb KIMONDJUK, mint
      hogy egy kulon szerzodest verziozzunk ugyanezert.

paths:

  /bejelentkezes/mod:
    get:
      tags: [bejelentkezes]
      operationId: belepesiMod
      summary: Hogyan lehet itt belepni?
      description: |
        A felulet ebbol tudja, melyik belepo kepernyot mutassa.

          - JELSZO: nev + jelszo (a felho).
          - PIN: pultos azonosito + PIN (a telephely, KIMARADAS alatt).
          - FELHORE: a telephely, de a felho elerheto - a felulet a `felhoCim`
            cimre kuld, es itt belepni nem lehet.
      security: []
      responses:
        '200':
          description: A belepes modja
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BelepesiMod'
        default:
          $ref: '#/components/responses/Hiba'

  /bejelentkezes:
    post:
      tags: [bejelentkezes]
      operationId: bejelentkezes
      summary: Belepes nevvel es jelszoval (a felho)
      description: |
        Siker eseten a valasz `Set-Cookie` fejleccel munkamenet-sutit allit be
        (HttpOnly, Secure, SameSite=Strict) - a bongeszoben futo kod NEM latja,
        tehat egy XSS nem viszi el.

        ⚠️ ROSSZ NEV ES ROSSZ JELSZO UGYANAZT A VALASZT KAPJA, ugyanannyi ido
        alatt: a valaszbol nem derulhet ki, letezik-e a felhasznalo.

        ⚠️ FEKEZES, NEM KIZARAS: fiokonkent novekvo varakozas (429). A kizaras
        maga is tamadas lenne - barki kizarhatna barkit, aki a nevet ismeri.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JelszavasBelepes'
      responses:
        '200':
          description: Belepve
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
            Set-Cookie:
              $ref: '#/components/headers/MunkamenetSuti'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Munkamenet'
        '401':
          $ref: '#/components/responses/Hiba401'
        '429':
          $ref: '#/components/responses/Hiba429'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

  /bejelentkezes/pin:
    post:
      tags: [bejelentkezes]
      operationId: pinesBejelentkezes
      summary: Belepes pultos azonositoval es PIN-nel (a telephely, kimaradaskor)
      description: |
        ⚠️ CSAK A TELEPHELY valositja meg, es CSAK AKKOR nyitott, ha a felho
        nem erheto el. Ha elerheto: 409 (FELHO_ELERHETO), a valaszban a felhos
        Ziggurat cimevel. A negyjegyu PIN gyengebb egy jelszonal - ezert csak
        akkor van kapu, amikor tenyleg szukseg van ra.

        A felho 501-et ad (CSAK_A_TELEPHELYEN).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinesBelepes'
      responses:
        '200':
          description: Belepve
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
            Set-Cookie:
              $ref: '#/components/headers/MunkamenetSuti'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Munkamenet'
        '401':
          $ref: '#/components/responses/Hiba401'
        '409':
          description: A felho elerheto - ott kell belepni (FELHO_ELERHETO).
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BelepesiMod'
        '429':
          $ref: '#/components/responses/Hiba429'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

  /kijelentkezes:
    post:
      tags: [bejelentkezes]
      operationId: kijelentkezes
      summary: Kijelentkezes - a munkamenet AZONNAL megszunik
      responses:
        '204':
          description: Kijelentkezve. A suti torlodik.
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
        default:
          $ref: '#/components/responses/Hiba'

  /munkamenet:
    get:
      tags: [bejelentkezes]
      operationId: munkamenet
      summary: Ki vagyok, es meddig el a munkamenetem?
      description: |
        ⚠️ EZ AZ EGYETLEN HITELESITETT KERES, AMI NEM NULLAZZA A TETLENSEGI IDOT.
        A felulet ebbol olvassa a visszaszamlalo pontos allasat - ha a kerdes
        maga meghosszabbitana, a szamlalo hazudna.
      responses:
        '200':
          description: A munkamenet
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Munkamenet'
        '401':
          $ref: '#/components/responses/Hiba401'
        default:
          $ref: '#/components/responses/Hiba'

  /munkamenet/frissites:
    post:
      tags: [bejelentkezes]
      operationId: munkamenetetFrissit
      summary: A tetlensegi ido nullazasa - "Maradok"
      description: |
        A felulet "Maradok" gombja hivja. NEM tolt ujra es nem navigal: a
        felbehagyott szerkesztes a kepernyon marad.

        ⚠️ Az ABSZOLUT hatart (legfeljebb 12 ora) NEM tolja ki.
      responses:
        '200':
          description: A frissitett munkamenet
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Munkamenet'
        '401':
          $ref: '#/components/responses/Hiba401'
        default:
          $ref: '#/components/responses/Hiba'

  /jelszo/elfelejtett:
    post:
      tags: [bejelentkezes]
      operationId: elfelejtettJelszo
      summary: Jelszo-visszaallito level kerese (a felho)
      description: |
        ⚠️ A VALASZ MINDIG 202, akkor is, ha nincs ilyen felhasznalo - kulonben
        a felhasznalonevek egyenkent kiprobalhatok lennenek.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElfelejtettJelszo'
      responses:
        '202':
          description: Ha letezik ilyen fiok, a level elindult.
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
        '400':
          $ref: '#/components/responses/Hiba'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

  /jelszo/beallitas:
    post:
      tags: [bejelentkezes]
      operationId: jelszotBeallit
      summary: Jelszo beallitasa jeggyel - meghivo elfogadasa vagy visszaallitas (a felho)
      description: |
        A jegy EGYSZER hasznalhato. Meghivo: 72 ora, visszaallitas: 1 ora.
        Siker utan a felhasznalo MINDEN korabbi munkamenete megszunik.

        ⚠️ A lejart, a mar felhasznalt es a nem letezo jegy UGYANAZT a valaszt
        kapja (410) - a jegyek ne legyenek kiprobalhatok.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JelszoBeallitas'
      responses:
        '204':
          description: A jelszo beallitva. Belepni kulon kell.
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
        '410':
          description: A jegy lejart, mar felhasznaltak, vagy nem letezik (ERVENYTELEN_JEGY).
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '422':
          description: |
            A jelszo nem felel meg (GYENGE_JELSZO): legalabb 12 karakter, nem
            szerepelhet a gyakori jelszavak kozott, es nem lehet a felhasznalo
            neve.
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

  /felhasznalok/{felhasznaloAzonosito}/meghivo:
    post:
      tags: [hozzaferes]
      operationId: meghivotKuld
      summary: A meghivo (ujra)kuldese
      description: |
        Uj jegyet keszit, es a korabbiakat ervenyteleniti. Akkor is hasznalhato,
        ha a fiok mar aktiv: ilyenkor jelszo-visszaallitaskent mukodik.
      parameters:
        - $ref: '#/components/parameters/Telephely'
        - $ref: '#/components/parameters/FelhasznaloAzonosito'
      responses:
        '202':
          description: A level elindult.
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeghivoAllapot'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '501':
          $ref: '#/components/responses/Hiba501'
        '503':
          description: |
            A levelkuldes nincs beallitva vagy nem erheto el
            (LEVELKULDES_NEM_ELERHETO). A felulet ezt KIMONDJA.
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        default:
          $ref: '#/components/responses/Hiba'

  /kategoriak:
    get:
      tags: [torzsadat]
      operationId: kategoriak
      summary: A kategoriafa
      description: |
        A teljes fa egyben, lapozas nelkul: a kategoriak szama legfeljebb
        szazas nagysagrendu, es a fat darabokban megjeleniteni rosszabb, mint
        egyben lekerni.

        A fa LEGFELJEBB NEGY SZINT MELY - ezt az adatbazis kenyszeriti ki, nem
        az alkalmazas jomodora.

        Az afakulcs barmely szinten megadhato, es LEFELE oroklodik. A valasz azt
        adja vissza, ami az adott szinten ALL - nem a kiszamolt orokolt erteket.
        A kettot osszekeverni csendes hiba: az oroklodes a mentesnel dol el.
      parameters:
        - $ref: '#/components/parameters/Telephely'
        - name: aktiv
          in: query
          required: false
          schema:
            type: boolean
          description: >
            Ha hianyzik, az aktiv ES az inaktiv kategoriak is jonnek. Az
            inaktivakat a felulet halvanyitva mutatja - torles nincs, mert a
            regi bizonylatok hivatkoznak rajuk.
      responses:
        '200':
          description: A kategoriafa
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                type: object
                required: [kategoriak]
                properties:
                  kategoriak:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kategoria'
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

    post:
      tags: [torzsadat]
      operationId: kategoriatFelvesz
      summary: Uj kategoria (1.16.0) - mindket oldalon
      description: |
        Jog: `kategoria.kezeles`. Legfeljebb 4 szint (MELYSEG, 422); ugyanazon
        szulo alatt a nev egyedi (FOGLALT_NEV, 409). A felhoben felvett kategoria
        a szinkronnal jut le a telephelyre.
      parameters:
        - $ref: '#/components/parameters/Telephely'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KategoriaFelvetel'
      responses:
        '201':
          description: Felveve
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KategoriaReszletek'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '409':
          description: A nev foglalt ugyanazon szulo alatt (FOGLALT_NEV).
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

