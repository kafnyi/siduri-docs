      description: |
        Az afakategoria (1.14.0) egy NEV es a nyolc rogzitett penztargepi GYUJTO
        egyike; a kulcs es a betujel a gyujtobol adodik (NYITOTT_KERDESEK G1,
        H5). A termeknel csak a TERMEK-gyujtos kategoriak valaszthatok
        (`termekre`); a szerviz-kategoriak a szervizdije (G1.2).

        A lista a berloe, minden telephelyen ugyanaz. A telephelyi szerver a
        szinkronnal lejott masolatot adja.

        Jog: `termek.megtekintes`.
      parameters:
