        default:
          $ref: '#/components/responses/Hiba'

  /felhasznalok/{felhasznaloAzonosito}/szerepek:
    put:
      tags: [hozzaferes]
      operationId: szerepeketBeallit
      summary: A pultos felhasznalo szerepei EGY hatokorben
      description: |
        A megadott hatokorre vonatkozo **teljes** szerephalmazt allitja be: ami
        nincs a listaban, az elkerul.

        ⚠️ **KET KORLAT all ra egyszerre:**

          1. **Maga fole senkit nem emelhet** - a kiosztott szerep szintje nem
             lehet erosebb a muveletet vegzoenel *(`EROSEBB_SZINT`)*;
          2. **a burok**: a szerep jogainak meg kell lenniuk nala is
             *(`BUROK`)*.

        A masodik nelkul az elso megkerulheto lenne egy AZONOS szintu, de tobb
        jogot tartalmazo szereppel.
      parameters:
        - $ref: '#/components/parameters/Telephely'
        - $ref: '#/components/parameters/FelhasznaloAzonosito'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SzerepKeres'
      responses:
        '200':
          description: A felhasznalo, a modositott szerepekkel
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FelhasznaloReszletek'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '404':
          $ref: '#/components/responses/Hiba404'
        '422':
          $ref: '#/components/responses/Hiba422'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

  /felhasznalok/{felhasznaloAzonosito}/kapcsolat:
    put:
      tags: [hozzaferes]
      operationId: kapcsolatotBeallit
      summary: A Ziggurat-fiok es a pultos fiok osszekapcsolasa
      description: |
        Ugyanaz az ember lehet mindketto - peldaul egy kis helyen dolgozo
        uzletvezeto, aki reggel PIN-nel nyit muszakot, delutan a bongeszoben
        arat ir.

        ⚠️ **A KAPCSOLAT NEM VON MAGA UTAN AUTOMATIKUS LETILTAST.** Ha az
        egyiket letiltjak, a valasz `kapcsoltFigyelmeztetes` mezoje szol rola,
        es a felulet **rakerdez** - MINDKET iranyban. A rendszer nem dont
        helyettunk, de nem is hallgat.

        Ures `kapcsoltAzonosito` = a kapcsolat **bontasa**.
      parameters:
        - $ref: '#/components/parameters/Telephely'
        - $ref: '#/components/parameters/FelhasznaloAzonosito'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KapcsolatKeres'
      responses:
        '200':
          description: A felhasznalo, a modositott kapcsolattal
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FelhasznaloReszletek'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '404':
          $ref: '#/components/responses/Hiba404'
        '422':
          description: |
            A ket fiok ugyanaz, VAGY a ketto AZONOS FAJTAJU. Kapcsolat csak
            ZIGGURAT es PULTOS kozott ertelmes - ket pultos fiok osszekapcsolasa
            nem "ugyanaz az ember", hanem elgepeles.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

  /jogosultsagok:
    get:
      tags: [hozzaferes]
      operationId: jogosultsagKatalogus
      summary: A jogosultsagok emberi neve (1.8.0)
      description: |
        A felulet ezt mutatja a nyers kodok (termek.ar_modositas) helyett.

        ⚠️ MINDKET KISZOLGALO VALOSITJA MEG, UGYANAZZAL A VALASSZAL: a nevek
        egy kozos forrasbol jonnek, amit egy teszt a telephelyi
        adatbazis-katalogussal kodrol kodra egyeztet. Egy uj jogosultsag, ami
        csak az egyikbe kerul be, a buildet buktatja el - nem a felulet mutat
        csendben nyers kodot.

        A CSAK SIDURI-kollegaknak szolo kodok (siduri.*) NINCSENEK a valaszban:
        a berlonek nincs velük dolga.

        Ismeretlen kodot (amit a felulet lat, de a katalogus nem ismer) a
        felulet NYERSEN mutat - nem talal ki ra nevet.
      parameters:
        - $ref: '#/components/parameters/Telephely'
      responses:
        '200':
          description: A katalogus
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                type: object
                required: [jogosultsagok]
                properties:
                  jogosultsagok:
                    type: array
                    items:
                      $ref: '#/components/schemas/JogosultsagLeiras'
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        default:
          $ref: '#/components/responses/Hiba'

  /sablonok:
    get:
      tags: [hozzaferes]
      operationId: sablonok
      summary: A jogosultsagi sablonok
      description: |
        ⚠️ **A SABLON NEM SZEREPKOR.** Egyszer masolodik a felhasznalora,
        onnantol a ketto **fuggetlen**: a sablon kesobbi atirasa a **meglevo**
        felhasznalokat nem valtoztatja. A feluleten ezt ki kell irni, kulonben
        mindenki azt hiszi, hogy visszamenoleg hat.
      parameters:
