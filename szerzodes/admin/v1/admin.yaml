            application/json:
              schema:
                $ref: '#/components/schemas/TelepitesiJegy'
        '404':
          $ref: '#/components/responses/Hiba404'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

  /siduri/telephelyek/{telephelyAzonosito}/tanusitvanyok:
    get:
      tags: [siduri]
      operationId: tanusitvanyok
      summary: A telephely tanusitvanyai - es mikor jelentkezett utoljara
      description: |
        Kapcsolo: `TANUSITVANY_VISSZAVONAS`, `TELEPITESI_JEGY` vagy
        `BERLO_REGISZTRACIO` (1.15.0). A visszavontak is latszanak.

        ⚠️ Egy telephelynek egyszerre TOBB ervenyes tanusitvanya lehet -
        szandekosan: a csere nem egy pillanat.
      parameters:
        - name: telephelyAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      responses:
        '200':
          description: A tanusitvanyok
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                type: object
                required: [tanusitvanyok]
                properties:
                  tanusitvanyok:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tanusitvany'
                  utolsoJelentkezes:
                    type: [string, "null"]
                    format: date-time
                    description: |
                      A telephely utolso lekerdezese. Egy leallt vagy ellopott
                      gepnel ebbol latszik, mikor beszelt utoljara.
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '404':
          $ref: '#/components/responses/Hiba404'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

  /siduri/telephelyek/{telephelyAzonosito}/tanusitvanyok/{ujjlenyomat}/visszavonas:
    post:
      tags: [siduri]
      operationId: tanusitvanytVisszavon
      summary: Egy tanusitvany visszavonasa - azonnal hat
      description: |
        Kapcsolo: `TANUSITVANY_VISSZAVONAS` (1.15.0). Az indok KOTELEZO, es a
        kollegak naplojaba kerul. A kovetkezo kerestol a telephely ezzel a
        tanusitvannyal nem szinkronizalhat.

        ⚠️ A berlo nem vonhatja vissza: egy teves visszavonas a telephelyet
        leallitja (FOLYAMATBAN 7.0/a). Idempotens: a mar visszavont
        tanusitvanyra 200, a korabbi indok marad.
      parameters:
        - name: telephelyAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        - name: ujjlenyomat
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [indok]
              properties:
                indok:
                  type: string
                  minLength: 3
                  maxLength: 500
              additionalProperties: false
      responses:
        '200':
          description: Visszavonva
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tanusitvany'
        '422':
          $ref: '#/components/responses/Hiba422'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '404':
          $ref: '#/components/responses/Hiba404'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

components:

  securitySchemes:

    MunkamenetSuti:
      type: apiKey
      in: cookie
      name: siduri_munkamenet
      description: |
        A BEJELENTKEZETT ADMIN FELHASZNALO munkamenete (1.7.0). A belepes
        allitja be: HttpOnly, Secure, SameSite=Strict.

        Szerveroldali, atlatszatlan azonosito - NEM JWT: kijelentkezeskor,
        letiltaskor es jelszocserekor AZONNAL megszunik. Egy alairt tokent a
        lejaratig nem lehetne visszavonni, es egy letiltott dolgozo addig bent
        maradna.

        Tetlenseg utan 20 perccel lejar, es legfeljebb 12 oraig el. Minden
        hitelesitett keres nullazza a tetlensegi idot, KIVEVE a GET /munkamenet.

    MunkamenetToken:
      type: http
      scheme: bearer
      description: |
        ⚠️ CSAK FEJLESZTOI ES TESZTHASZNALAT, kapcsoloval: a token maga a
        felhasznalo azonositoja. Elesben ki van kapcsolva, es a felulet sem
        hasznalja.

  headers:

    MunkamenetSuti:
      description: >
        A munkamenet-suti (siduri_munkamenet). HttpOnly, Secure,
        SameSite=Strict, Path=/admin.
      schema:
        type: string

    SiduriSzerzodes:
      description: >
        Melyik szerzodessel szolgaltak ki. Egy "neha maskepp viselkedik"
        hibabejelentesnel ez az elso kerdes - ha nem latszik, orakba kerul.
      required: true
      schema:
        type: string
        examples: ["admin/1.16.0"]

    SiduriKiszolgalo:
      description: |
        MELYIK OLDAL SZOLGALT KI. Ket megvalositas van, es a felhasznalo nem
        feltetlenul tudja, melyikhez ert el: az offline tartalek eseten a
        bongeszo ugyanazt az alkalmazast mutatja. Ha a valasz nem mondja meg,
        akkor egy "nem latom a tegnapi valtoztatasomat" bejelentesnel senki nem
        tudja, hol kezdje.
      required: true
      schema:
        type: string
        enum: [felho, telephely]

  parameters:

    Telephely:
      name: Siduri-Telephely
      in: header
      required: true
      schema:
        $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      description: >
        MELYIK TELEPHELY adatait keri. A tobb telephely alapmodell, nem
        franchise-funkcio (spec §22.3), ezert ez MINDEN keresen kotelezo - a
        felho tobb telephelyet szolgal ki, a telephelyi szerver pedig sajat
        maga azonositojat varja, es masra 403-mal valaszol.

    FelhasznaloAzonosito:
      name: felhasznaloAzonosito
      in: path
      required: true
      schema:
        $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'

    KollegaAzonosito:
      name: kollegaAzonosito
      in: path
      required: true
      schema:
        $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'

    KerelemAzonosito:
      name: kerelemAzonosito
      in: path
      required: true
      schema:
        $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'

    Kurzor:
      name: kurzor
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: >
        Az elozo valasz kovetkezoKurzor erteke. A tartalma a kiszolgalo dolga,
        a kliens nem ertelmezi. Ervenytelen kurzorra 422 jon, nem csendes elso
        oldal.

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: >
        Egy oldal merete. A felso hatar nem kenyelmi korlat: a telephelyi
        szerver egy J1900, ami kozben kasszat is kiszolgal.

  responses:

    Hiba:
      description: Hiba
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
        Siduri-Kiszolgalo:
          $ref: '#/components/headers/SiduriKiszolgalo'
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba401:
      description: Nincs ervenyes munkamenet.
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
        Siduri-Kiszolgalo:
          $ref: '#/components/headers/SiduriKiszolgalo'
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba403:
      description: |
        Nincs jogosultsag, VAGY a kert telephely nem ezen a kiszolgalon van. A
        kettot a gepi KOD kulonbozteti meg: NINCS_JOGOSULTSAG, illetve
        MASIK_TELEPHELY.

        ⚠️ A VALASZ MEGMONDJA, MELYIK OLDAL UTASITOTTA EL. Ez nem kenyelmi adat:
        a ket megvalositas KULON hozzaferes-nyilvantartasbol dolgozik, tehat
        ugyanaz a felhasznalo az egyik oldalon jogosult lehet, a masikon nem. A
        kiszolgalo megnevezese nelkul egy "nekem ehhez van jogom" bejelentes
        megfejthetetlen.
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
        Siduri-Kiszolgalo:
          $ref: '#/components/headers/SiduriKiszolgalo'
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba404:
      description: Nincs ilyen termek ezen a telephelyen.
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
        Siduri-Kiszolgalo:
          $ref: '#/components/headers/SiduriKiszolgalo'
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba429:
      description: |
        Tul sok sikertelen kiserlet (VARJON). A Retry-After fejlec mondja meg,
        hany masodperc mulva lehet ujra probalni.
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
        Siduri-Kiszolgalo:
          $ref: '#/components/headers/SiduriKiszolgalo'
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba501:
      description: |
        ⚠️ **EZT A VEGPONTOT CSAK A FELHO VALOSITJA MEG** (`CSAK_A_FELHOBEN`).

        A telephelyi szerver hatarozottan elutasitja, nem veletlen 404-gyel: a
        hozzaferes gazdaja a felho, es a telephelyi szerver sajat maga nem
        dontheti el, ki lephet be a Zigguratba. A felulet ebbol tudja, hogy a
        menüpontot el kell rejtenie, ha eppen a telephely szolgal ki.
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
        Siduri-Kiszolgalo:
          $ref: '#/components/headers/SiduriKiszolgalo'
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba422:
      description: Ertelmezhetetlen parameter - peldaul ervenytelen kurzor.
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
        Siduri-Kiszolgalo:
          $ref: '#/components/headers/SiduriKiszolgalo'
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  schemas:

    JogosultsagLeiras:
      title: Egy jogosultsag leirasa
      type: object
      required: [kod, terulet, megnevezes, magasKockazatu]
      properties:
        kod:
          type: string
          examples: ["termek.ar_modositas"]
        terulet:
          type: string
          description: A csoport gepi kodja (ELADAS, TERMEK, ...) - a felulet forditja.
          examples: ["TERMEK"]
        megnevezes:
          type: string
          examples: ["Ár módosítása"]
        magasKockazatu:
          type: boolean
          description: >
            Igaz: a felulet kiemeli. Ezek a jogok penzt, bizonylatot vagy mas
            fiokjat erintik - kiosztasuk tobb figyelmet erdemel.
      additionalProperties: false

    BelepesiMod:
      title: A belepes modja
      type: object
      required: [mod]
      properties:
        mod:
          type: string
          enum: [JELSZO, PIN, FELHORE]
        felhoCim:
          type: [string, "null"]
          description: FELHORE modnal a felhos Ziggurat cime.
      additionalProperties: false

    JelszavasBelepes:
      title: Belepes nevvel es jelszoval
      type: object
      required: [felhasznalonev, jelszo]
      properties:
        felhasznalonev:
          type: string
          maxLength: 200
          examples: ["kiskocsma.pista"]
        jelszo:
          type: string
          maxLength: 128
      additionalProperties: false

    PinesBelepes:
      title: Belepes pultos azonositoval es PIN-nel
      type: object
      required: [azonosito, pin]
      properties:
        azonosito:
          type: string
          maxLength: 100
          description: A pultos kulso azonositoja - amivel a pult mogott is belep.
        pin:
          type: string
          pattern: '^[0-9]{4,8}$'
      additionalProperties: false

    Munkamenet:
      title: Munkamenet
      type: object
      required: [felhasznalo, tetlensegiLejar, abszolutLejar, tetlensegiIdoMp]
      properties:
        felhasznalo:
          type: object
          required: [azonosito, nev]
          properties:
            azonosito:
              $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
            nev:
              type: string
            bejelentkezesiNev:
              type: [string, "null"]
          additionalProperties: false
        tetlensegiLejar:
          type: string
          format: date-time
          description: Ekkor jar le, ha addig nem erkezik keres.
        abszolutLejar:
          type: string
          format: date-time
          description: Ekkor MINDENKEPP lejar. Nem tolhato ki.
        tetlensegiIdoMp:
          type: integer
          description: >
            Mennyivel tol ki egy keres (20 perc = 1200). A felulet EBBOL szamol a
            kozbenso keresek utan - nem sajat, beegetett ertekbol.
        telephelyek:
          type: array
          description: |
            A ceg telephelyei (1.9.0) - a felulet ebbol kinal valasztot, ha egynel
            tobb van. A felhoben a berlo MINDEN telephelye; a telephelyi
            szerveren csak a sajatja.

            ⚠️ A LISTA NEM JOGOSULTSAG: egy telephely szerepelhet benne, es a
            kiszolgalo ott megis 403-at adhat. A jog telephelyenkent all - a
            lista csak azt mondja meg, hova lehet egyaltalan valtani.
          items:
            $ref: '#/components/schemas/TelephelyRovid'
        kollega:
          description: |
            Csak a Siduri kollegafiokjanal van (1.10.0). A berloi fioknal
            HIANYZIK.
          $ref: '#/components/schemas/KollegaAllapot'
      additionalProperties: false

    KollegaAllapot:
      title: A kollega munkamenete
      type: object
      required: [kapcsolok]
      properties:
        rang:
          type: [string, "null"]
          enum: [SZUPERADMIN, MANAGER, null]
          description: >
            Nincs rang: a kollega csak a kapcsoloi szerint tehet. A SZUPERADMIN
            kizarolag adatbazisbol adhato.
        kapcsolok:
          type: array
          description: A TENYLEGES kapcsolok - rangbol, jogkorbol es egyedileg.
          items:
            $ref: '#/components/schemas/KollegaKapcsolo'
        berlo:
          description: A valasztott berlo. Hianyzik, amig nem valasztott.
          $ref: '#/components/schemas/BerloRovid'
      additionalProperties: false

    KollegaKapcsolo:
      title: Egy kollega-kapcsolo
      type: string
      enum: [IDEGEN_BERLO, BERLO_REGISZTRACIO, NAPLO, KOLLEGAK, TELEPITESI_JEGY,
             TANUSITVANY_VISSZAVONAS]
      description: |
        IDEGEN_BERLO: belepes egy berlo adataihoz. BERLO_REGISZTRACIO: uj berlo
        es uj telephely felvetele. NAPLO: a hozzaferesi naplo. KOLLEGAK: a
        kollegafiokok kezelese. TELEPITESI_JEGY (1.13.0): telepitesi jegy
        generalasa a telephelyi szerver elso tanusitvanyahoz.
        TANUSITVANY_VISSZAVONAS (1.15.0): egy telephelyi gep tanusitvanyanak
        visszavonasa (ellopott, leselejtezett gep).

        ⚠️ Uj kapcsolo = kisverzio; a felulet az ismeretlent figyelmen kivul
        hagyja.

    BerloRovid:
      title: Egy berlo neve
      type: object
      required: [azonosito, nev, rovidNev]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
        rovidNev:
          type: string
          description: A bejelentkezesi nevek eloTagja.
      additionalProperties: false

    Kollega:
      title: Egy kollegafiok
      type: object
      required: [azonosito, nev, bejelentkezesiNev, aktiv, jogkorok, egyediKapcsolok, kapcsolok]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
        bejelentkezesiNev:
          type: string
          examples: ["siduri.kata"]
        email:
          type: [string, "null"]
        aktiv:
          type: boolean
        rang:
          type: [string, "null"]
          enum: [SZUPERADMIN, MANAGER, null]
        jogkorok:
          type: array
          items:
            $ref: '#/components/schemas/JogkorRovid'
        egyediKapcsolok:
          type: array
          description: A kozvetlenul adott kapcsolok - ezek egyenkent elvehetok.
          items:
            $ref: '#/components/schemas/KollegaKapcsolo'
        kapcsolok:
          type: array
          description: |
            A TENYLEGES kapcsolok. ⚠️ Amit egy jogkor ad, az egyedileg nem veheto
            el - csak a jogkor modositasaval vagy elvetelevel (HOZZAFERES.md 4.1).
          items:
            $ref: '#/components/schemas/KollegaKapcsolo'
        fuggoKerelem:
          description: Ha a kollegarol negy szem kerelem fugg.
          $ref: '#/components/schemas/KollegaKerelem'
      additionalProperties: false

    KollegaFelvetel:
      title: Uj kollega
      type: object
      required: [nev, azonosito, email]
      properties:
        nev:
          type: string
          minLength: 1
          maxLength: 200
        azonosito:
          type: string
          description: A `siduri.` utani resz. Kisbetu, szam, pont, alulvonas, kotojel.
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        email:
          type: string
          format: email
      additionalProperties: false

    KollegaModositas:
      title: Kollega modositasa
      type: object
      properties:
        aktiv:
          type: boolean
        egyediKapcsolok:
          type: array
          description: A TELJES uj halmaz, nem kulonbseg.
          items:
            $ref: '#/components/schemas/KollegaKapcsolo'
        jogkorok:
          type: array
          description: A TELJES uj halmaz - a jogkorok azonositoi.
          items:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      additionalProperties: false

    RangKeres:
      title: Rang
      type: object
      required: [rang]
      properties:
        rang:
          type: [string, "null"]
          enum: [MANAGER, null]
          description: MANAGER = megadas, null = elvetel. A SZUPERADMIN nem adhato.
      additionalProperties: false

    JogkorRovid:
      title: Egy jogkor neve
      type: object
      required: [azonosito, nev]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
      additionalProperties: false

    Jogkor:
      title: Egy jogkor
      type: object
      required: [azonosito, nev, kapcsolok, viselok]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
        kapcsolok:
          type: array
          items:
            $ref: '#/components/schemas/KollegaKapcsolo'
        viselok:
          type: integer
          description: Hany kollega viseli - ennyi emberre hat AZONNAL egy modositas.
      additionalProperties: false

    JogkorKeres:
      title: Jogkor felvetele vagy atirasa
      type: object
      required: [nev, kapcsolok]
      properties:
        nev:
          type: string
          minLength: 1
          maxLength: 100
        kapcsolok:
          type: array
          items:
            $ref: '#/components/schemas/KollegaKapcsolo'
      additionalProperties: false

    KollegaKerelem:
      title: Negy szem kerelem
      type: object
      required: [azonosito, fajta, cel, kero, letrehozva, allapot]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        fajta:
          type: string
          enum: [MANAGER_ELVETEL, LETILTAS]
        cel:
          $ref: '#/components/schemas/KollegaRovid'
        kero:
          $ref: '#/components/schemas/KollegaRovid'
        letrehozva:
          type: string
          format: date-time
        allapot:
          type: string
          enum: [FUGGO, VEGREHAJTVA, VISSZAVONVA]
      additionalProperties: false

    KollegaRovid:
      title: Egy kollega neve
      type: object
      required: [azonosito, nev]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
      additionalProperties: false

    BerloRegisztracio:
      title: Uj berlo
      type: object
      required: [nev, rovidNev, telephelyNev, tulajdonos]
      properties:
        nev:
          type: string
          minLength: 1
          maxLength: 200
          description: A ceg neve.
        rovidNev:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,39}$'
          description: |
            A bejelentkezesi nevek eloTagja - GYAKORLATILAG VEGLEGES. Kisbetu,
            szam, alulvonas; pont nem (az valasztja el a nevtol). A `siduri`
            tiltott.
        telephelyNev:
          type: string
          minLength: 1
          maxLength: 200
        tulajdonos:
          type: object
          required: [nev, azonosito, email]
          properties:
            nev:
              type: string
              minLength: 1
              maxLength: 200
            azonosito:
              type: string
              pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
            email:
              type: string
              format: email
          additionalProperties: false
      additionalProperties: false

    BerloRegisztralva:
      title: A regisztracio eredmenye
      type: object
      required: [berlo, telephely, tulajdonosBejelentkezesiNev, meghivo]
      properties:
        berlo:
          $ref: '#/components/schemas/BerloRovid'
        telephely:
          $ref: '#/components/schemas/SiduriTelephely'
        tulajdonosBejelentkezesiNev:
          type: string
          examples: ["kiskocsma.pista"]
        meghivo:
          $ref: '#/components/schemas/MeghivoAllapot'
      additionalProperties: false

    SiduriTelephely:
      title: Egy telephely a Siduri szemevel
      type: object
      required: [azonosito, nev, regisztralva]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
        regisztralva:
          type: boolean
          description: Van-e a telephelynek ervenyes (vissza nem vont, le nem jart) tanusitvanya.
        eloJegyLejar:
          type: [string, "null"]
          format: date-time
          description: Ha van be nem valtott, ervenyes jegy - eddig el. A jegy maga nem.
      additionalProperties: false

    TelephelyFelvetel:
      title: Uj telephely
      type: object
      required: [nev]
      properties:
        nev:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false

    Tanusitvany:
      title: Egy telephelyi tanusitvany
      type: object
      required: [ujjlenyomat, alany, sorozatszam, kiadva, lejar]
      properties:
        ujjlenyomat:
          type: string
          description: A DER alak SHA-256-ja, kisbetus hexa - ez az azonosito.
        alany:
          type: string
        sorozatszam:
          type: string
        kiadva:
          type: string
          format: date-time
        lejar:
          type: string
          format: date-time
        visszavonva:
          type: [string, "null"]
          format: date-time
        visszavonasOka:
          type: [string, "null"]
      additionalProperties: false

    TelepitesiJegy:
      title: Telepitesi jegy
      type: object
      required: [jegy, lejar]
      properties:
        jegy:
          type: string
          description: EGYSZER latszik - a telepito a telephelyi szerver beallitasaba masolja.
        lejar:
          type: string
          format: date-time
      additionalProperties: false

    BerloValasztas:
      title: Berlovalasztas
      type: object
      required: [berloAzonosito]
      properties:
        berloAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      additionalProperties: false

    KollegaNaploBejegyzes:
      title: Egy bejegyzes a kollegak naplojaban
      type: object
      required: [azonosito, tortent, esemeny, felhasznalonev]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        tortent:
          type: string
          format: date-time
        esemeny:
          type: string
          description: |
            BELEPES, SIKERTELEN_BELEPES, BERLOBE_LEPES; 1.11.0-tol a kezeles:
            KOLLEGA_FELVETEL, KOLLEGA_MODOSITAS, RANG, JOGKOR, KERELEM,
            JOVAHAGYAS, VISSZAVONAS; 1.13.0-tol BERLO_REGISZTRACIO,
            TELEPHELY_FELVETEL, TELEPITESI_JEGY; 1.15.0-tol
            TANUSITVANY_VISSZAVONAS. ⚠️ A lista bovulhet; a felulet az
            ismeretlent a kodjaval mutatja.
          examples: ["BERLOBE_LEPES"]
        felhasznalonev:
          type: string
          description: A beirt nev - ismeretlen fioknal ez az egyetlen nyom.
        kollegaNev:
          type: [string, "null"]
        berlo:
          description: BERLOBE_LEPES-nel a berlo.
          $ref: '#/components/schemas/BerloRovid'
        ok:
          type: [string, "null"]
          description: A sikertelen belepes oka (HIBAS_JELSZO, NINCS_ILYEN, ...).
        reszlet:
          type: [string, "null"]
          description: |
            A kollegakezeles esemenyeinel (1.11.0): kin, mi valtozott - a
            felulet igy mutatja, ahogy van.
        ip:
          type: [string, "null"]
      additionalProperties: false

    TelephelyRovid:
      title: Egy telephely neve
      type: object
      required: [azonosito, nev]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
      additionalProperties: false

    ElfelejtettJelszo:
      title: Elfelejtett jelszo
      type: object
      required: [felhasznalonev]
      properties:
        felhasznalonev:
          type: string
          maxLength: 200
      additionalProperties: false

    JelszoBeallitas:
      title: Jelszo beallitasa jeggyel
      type: object
      required: [jegy, jelszo]
      properties:
        jegy:
          type: string
          maxLength: 200
        jelszo:
          type: string
          minLength: 12
          maxLength: 128
      additionalProperties: false

    MeghivoAllapot:
      title: A meghivo sorsa
      type: object
      required: [allapot]
      properties:
        allapot:
          type: string
          enum: [ELKULDVE, NEM_SIKERULT]
          description: |
            ⚠️ NEM_SIKERULT eseten a fiok LETEZIK, csak a level nem ment ki. A
            felulet ezt kimondja, es felajanlja az ujrakuldest.
        uzenet:
          type: [string, "null"]
      additionalProperties: false

    Felhasznalo:
      title: Felhasznalo
      type: object
      required: [azonosito, fajta, nev, aktiv, abszolutJog]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        fajta:
          type: string
          enum: [ZIGGURAT, PULTOS]
        nev:
          type: string
        bejelentkezesiNev:
          type: string
          description: >
            A berlo rovid neve es az azonosito egyutt (pl. kiskocsma.Pista). A
            ZIGGURAT-fiokoknal van csak ertelme.
        meghivo:
          allOf:
            - $ref: '#/components/schemas/MeghivoAllapot'
          description: >
            CSAK a felvetel valaszaban (1.7.0): elment-e a meghivo.
        email:
          type: [string, "null"]
        aktiv:
          type: boolean
          description: >
            Hamis: LETILTVA. Torles nincs - a letiltott ember is latszik, hogy
            vissza lehessen kapcsolni.
        abszolutJog:
          type: boolean
          description: |
            Az **abszolut jogosultsagkezeles**: felmentes a burok ala. A felulet
            ezt **koronaval** jelzi - ez az egyetlen vizualis jel arrol, kinel
            van a fokulcs.
        kapcsoltAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      additionalProperties: false

    FelhasznaloReszletek:
      title: Felhasznalo reszletei
      type: object
      required: [felhasznalo, hatokorok]
      properties:
        felhasznalo:
          $ref: '#/components/schemas/Felhasznalo'
        hatokorok:
          type: array
          description: Hatokoronkent, amire van beallitott joga.
          items:
            $ref: '#/components/schemas/HatokoriJogok'
        hatokoriSzerepek:
          type: array
          description: >
            Hatokoronkent a kiosztott SZEREPEK. Csak a PULTOS fiokoknal van
            tartalma - a Ziggurat oldalan nincs szerepkor.
          items:
            $ref: '#/components/schemas/HatokoriSzerepek'
        kapcsoltFigyelmeztetes:
          type: [string, "null"]
          description: |
            ⚠️ Ha van kapcsolt pultos fiok, itt all a figyelmeztetes szovege. A
            felulet ebbol kerdezi meg, hogy a masikat is tiltsa-e. **A rendszer
            nem dont helyette, de nem is hallgat.**
      additionalProperties: false

    HatokoriJogok:
      title: Jogok egy hatokorben
      type: object
      required: [hatokorTipus, jogosultsagok]
      properties:
        hatokorTipus:
          type: string
          enum: [TELEPHELY, RAKTAR, GLOBALIS]
        hatokorAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        hatokorNev:
          type: [string, "null"]
        jogosultsagok:
          type: array
          items:
            type: string
      additionalProperties: false

    FelhasznaloKeres:
      title: Uj felhasznalo
      type: object
      required: [nev, azonosito]
      properties:
        fajta:
          type: string
          enum: [ZIGGURAT, PULTOS]
          default: ZIGGURAT
        nev:
          type: string
          minLength: 1
          maxLength: 200
        azonosito:
          type: string
          description: >
            ZIGGURAT-nal a bejelentkezesi nev berlo utani resze; PULTOS-nal a
            pult mogott hasznalt azonosito. Kisbetu, szam, pont es alulvonas.
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        email:
          type: [string, "null"]
          format: email
          description: |
            Ide megy a regisztracios meghivo. **ZIGGURAT-nal kotelezo**,
            PULTOS-nal nincs ertelme: a pultos fiok nem a bongeszobe lep be.
        kapcsoltAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      additionalProperties: false

    Szerep:
      title: Pultos szerep
      type: object
      required: [azonosito, kod, nev, szint, jogosultsagok]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        kod:
          type: string
        nev:
          type: string
        szint:
          type: integer
          minimum: 0
          description: Kisebb szam = erosebb. A 0. szint a Siduri rendszergazdae.
        serthetetlen:
          type: boolean
          description: >
            A Siduri szerep. Nem modosithato es nem torolheto - adatbazisszinten
            sem.
        jogosultsagok:
          type: array
          items:
            type: string
      additionalProperties: false

    HatokoriSzerepek:
      title: Szerepek egy hatokorben
      type: object
      required: [hatokorTipus, szerepek]
      properties:
        hatokorTipus:
          type: string
          enum: [TELEPHELY, RAKTAR, GLOBALIS]
        hatokorAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        szerepek:
          type: array
          items:
            $ref: '#/components/schemas/Szerep'
      additionalProperties: false

    SzerepKeres:
      title: Szerepek egy hatokorben
      type: object
      required: [hatokorTipus, szerepek]
      properties:
        hatokorTipus:
          type: string
          enum: [TELEPHELY, RAKTAR, GLOBALIS]
        hatokorAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        szerepek:
          type: array
          description: A TELJES halmaz erre a hatokorre. Ami nincs benne, elkerul.
          items:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      additionalProperties: false

    KapcsolatKeres:
      title: Fiokok osszekapcsolasa
      type: object
      properties:
        kapcsoltAzonosito:
          type: [string, "null"]
          format: uuid
          description: Ures = a kapcsolat bontasa.
      additionalProperties: false

    FelhasznaloModositas:
      title: Felhasznalo modositasa
      type: object
      properties:
        nev:
          type: string
          minLength: 1
          maxLength: 200
        aktiv:
          type: boolean
          description: Hamis = LETILTAS. Torles nincs.
      additionalProperties: false

    JogosultsagKeres:
      title: Jogosultsagok egy hatokorben
      type: object
      required: [hatokorTipus, jogosultsagok]
      properties:
        hatokorTipus:
          type: string
          enum: [TELEPHELY, RAKTAR, GLOBALIS]
        hatokorAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        jogosultsagok:
          type: array
          description: >
            A TELJES halmaz erre a hatokorre. Ami nincs benne, az elkerul.
          items:
            type: string
      additionalProperties: false

    Sablon:
      title: Jogosultsagi sablon
      type: object
      required: [azonosito, kod, nev, jogosultsagok]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        kod:
          type: string
        nev:
          type: string
        leiras:
          type: [string, "null"]
        jogosultsagok:
          type: array
          items:
            type: string
      additionalProperties: false

    Kategoria:
      title: Kategoria
      description: >
        A fa egy csomopontja. A fat a szuloId koti ossze; a lapos lista es a
        szint egyutt eleg a felepitesehez, es lapos listat lapozni, szurni es
        exportalni is lehet - beagyazott fat nem.
      type: object
      required: [azonosito, nev, szint, aktiv]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        szuloId:
          allOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
          description: Hianyzik a gyokerszintu kategorianal.
        nev:
          type: string
        szint:
          type: integer
          minimum: 1
          maximum: 4
          description: >
            1-tol 4-ig. A negy szintes korlatot az adatbazis tartja, nem az
            alkalmazas.
        afaHelyben:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
          description: >
            AMI EZEN A SZINTEN ALL, nem a kiszamolt orokolt ertek. Hianyzik, ha
            ez a szint nem mond rola semmit - olyankor a szulotol oroklodik.
        afaElvitel:
          $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
        ntakFokategoria:
          type: string
        ntakAlkategoria:
          type: string
        sorrend:
          type: integer
        aktiv:
          type: boolean
        afaHelybenKategoria:
          description: Az ezen a szinten allo helyben afakategoria (1.16.0); hianyzik = orokli.
          $ref: '#/components/schemas/AfakategoriaRovid'
        afaElvitelKategoria:
          $ref: '#/components/schemas/AfakategoriaRovid'
      additionalProperties: false

    KategoriaReszletek:
      title: Egy kategoria a mezoinek eredetevel
      type: object
      required: [kategoria, mezok]
      properties:
        kategoria:
          $ref: '#/components/schemas/Kategoria'
        mezok:
          type: object
          description: Mezonkent (O3) - mikor es honnan, mi volt elotte, mi nem lepett ervenybe.
          properties:
            nev:
              $ref: '#/components/schemas/MezoAllapot'
            szulo:
              $ref: '#/components/schemas/MezoAllapot'
            allapot:
              $ref: '#/components/schemas/MezoAllapot'
            afa:
              $ref: '#/components/schemas/MezoAllapot'
            ntak:
              $ref: '#/components/schemas/MezoAllapot'
          additionalProperties: false
      additionalProperties: false

    MezoAllapot:
      title: Egy mezo eredete es tortenete
      type: object
      properties:
        eredet:
          $ref: '#/components/schemas/Mezoeredet'
        elozo:
          $ref: '#/components/schemas/SzovegesMezoertek'
        elveszett:
          $ref: '#/components/schemas/ElveszettSzovegesIras'
      additionalProperties: false

    KategoriaFelvetel:
      title: Uj kategoria
      type: object
      required: [nev]
      properties:
        nev:
          type: string
          minLength: 1
          maxLength: 200
        szuloId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        afaHelyben:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        afaElvitel:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        ntakFokategoria:
          type: string
        ntakAlkategoria:
          type: string
      additionalProperties: false

    KategoriaMezoKeres:
      title: Egy kategoria-mezo uj erteke
      description: Csak az adott mezohoz tartozo tulajdonsag szamit (lasd a vegpontot).
      type: object
      properties:
        nev:
          type: string
          minLength: 1
          maxLength: 200
        szuloId:
          oneOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
            - type: "null"
        aktiv:
          type: boolean
        afaHelyben:
          oneOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
            - type: "null"
        afaElvitel:
          oneOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
            - type: "null"
        ntakFokategoria:
          type: [string, "null"]
        ntakAlkategoria:
          type: [string, "null"]
        indok:
          type: string
          maxLength: 500
      additionalProperties: false

    TermekSor:
      title: Termek egy listasorban
      description: >
        Amit a tablazat mutat. A kiszerelesek NINCSENEK benne - egy 400 soros
        listaban minden termek minden kiszerelesenek kikuldese sokszorosara
        novelne a valaszt azert, amit a felhasznalo nem lat.
      type: object
      required: [azonosito, megnevezes, afaHelyben, afaElvitel, mennyisegiEgyseg, aktiv, kiszerelesSzam]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        megnevezes:
          type: string
        kategoriaId:
          allOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
          description: >
            Hianyozhat: NTAK-koteles helyen a termek kategoria nelkul nem
            mentheto, de a nem NTAK-koteles telephelyen igen.
        afaHelyben:
          $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
        afaElvitel:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
          description: >
            MASOLAT, nem hivatkozas. Ha hivatkozas lenne, a helyben fogyasztas
            kulcsanak csokkentese csendben lecsokkentene ezt is - ami komoly
            jogsertes.
        mennyisegiEgyseg:
          type: string
          examples: ["DARAB", "KILOGRAMM", "LITER"]
        aktiv:
          type: boolean
        kiszerelesSzam:
          type: integer
          description: Hany ertekesitheto kiszerelese van. A reszletek a termek lapjan.
        legolcsobbBruttoAr:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: >
            A kiszerelesek legolcsobbja, TAJEKOZTATASUL a listaban. Hianyzik,
            ha nincs aktiv kiszereles. NEM ebbol kell arat szamolni.
      additionalProperties: false

    Termek:
      title: Termek
      type: object
      required: [azonosito, megnevezes, afaHelyben, afaElvitel, mennyisegiEgyseg, aktiv, kiszerelesek]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        megnevezes:
          type: string
        megnevezesEn:
          type: string
        kategoriaId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        afaHelyben:
          $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
        afaElvitel:
          $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
        mennyisegiEgyseg:
          type: string
        korhatarosJelzes:
          type: boolean
          description: Piktogram a tetelsoron, SOHA nem felugro ablak (I46).
        aktiv:
          type: boolean
        kiszerelesek:
          type: array
          items:
            $ref: '#/components/schemas/Kiszereles'
        megnevezesEredet:
          allOf:
            - $ref: '#/components/schemas/Mezoeredet'
          description: Mikor es honnan kapta a nev a mostani erteket (1.12.0).
        megnevezesElozo:
          allOf:
            - $ref: '#/components/schemas/SzovegesMezoertek'
          description: Az ELOTTE ervenyes nev (1.12.0).
        megnevezesElveszett:
          allOf:
            - $ref: '#/components/schemas/ElveszettSzovegesIras'
          description: A legutobbi nev-iras, ami NEM lepett ervenybe (1.12.0).
        allapotEredet:
          allOf:
            - $ref: '#/components/schemas/Mezoeredet'
          description: Mikor es honnan kapta az allapot (aktiv/inaktiv) a mostani erteket.
        allapotElozo:
          allOf:
            - $ref: '#/components/schemas/SzovegesMezoertek'
          description: Az ELOTTE ervenyes allapot - AKTIV vagy INAKTIV.
        allapotElveszett:
          allOf:
            - $ref: '#/components/schemas/ElveszettSzovegesIras'
          description: A legutobbi allapot-iras, ami NEM lepett ervenybe.
        afaHelybenKategoria:
          description: A helyben fogyasztas afakategoriaja (1.14.0).
          $ref: '#/components/schemas/AfakategoriaRovid'
        afaElvitelKategoria:
          description: Az elvitel afakategoriaja (1.14.0).
          $ref: '#/components/schemas/AfakategoriaRovid'
        afaEredet:
          allOf:
            - $ref: '#/components/schemas/Mezoeredet'
          description: Mikor es honnan kapta az afa (a ket kategoria egyutt) a mostani erteket.
        afaElozo:
          allOf:
            - $ref: '#/components/schemas/SzovegesMezoertek'
          description: Az elotte ervenyes afa, olvashatoan ("Ital 27% / Ital 27%").
        afaElveszett:
          allOf:
            - $ref: '#/components/schemas/ElveszettSzovegesIras'
          description: A legutobbi afa-iras, ami NEM lepett ervenybe.
      additionalProperties: false

    Afakategoria:
      title: Afakategoria
      type: object
      required: [azonosito, nev, gyujto, termekre, aktiv, alap]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
          examples: ["Ital 27%"]
        gyujto:
          $ref: '#/components/schemas/AfaGyujto'
        termekre:
          type: boolean
          description: Termekhez valaszthato-e (a szerviz-gyujtosek nem).
        aktiv:
          type: boolean
        alap:
          type: boolean
          description: A kilenc alapkategoria egyike (rogzitett azonosito).
      additionalProperties: false

    AfakategoriaRovid:
      title: Egy afakategoria neve
      type: object
      required: [azonosito, nev, gyujto]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
        gyujto:
          $ref: '#/components/schemas/AfaGyujto'
      additionalProperties: false

    AfaGyujto:
      title: A penztargepi gyujto
      type: string
      enum: [A_5, B_18, C_27, D_AJT, E_0, SZERVIZ_5, SZERVIZ_18, SZERVIZ_27]
      description: |
        A nyolc rogzitett rekesz (G1). A termek-gyujtok kodja azonos az NTAK
        afaKategoria erteke (H5): A_5, B_18, C_27, D_AJT, E_0 (a gyujton "TAM").
        ⚠️ Az AAM alapkategoria is az E_0-ra kerul - sajat rekesze nincs
        (KONYVELOI_KERDESEK B7).

    AfakategoriaFelvetel:
      title: Uj afakategoria
      type: object
      required: [nev, gyujto]
      properties:
        nev:
          type: string
          minLength: 1
          maxLength: 100
        gyujto:
          $ref: '#/components/schemas/AfaGyujto'
      additionalProperties: false

    AfakategoriaModositas:
      title: Afakategoria modositasa
      type: object
      properties:
        nev:
          type: string
          minLength: 1
          maxLength: 100
        aktiv:
          type: boolean
      additionalProperties: false

    AfaKeres:
      title: A termek afaja
      type: object
      required: [helyben, elvitel]
      properties:
        helyben:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        elvitel:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        indok:
          type: string
          maxLength: 500
      additionalProperties: false

    NevKeres:
      title: Nevmodositas
      type: object
      required: [megnevezes]
      properties:
        megnevezes:
          type: string
          minLength: 1
          maxLength: 200
          description: A szelein levo szokozok nem szamitanak; ures nev nincs.
        indok:
          type: string
          maxLength: 500
      additionalProperties: false

    AllapotKeres:
      title: Aktivalas vagy inaktivalas
      type: object
      required: [aktiv]
      properties:
        aktiv:
          type: boolean
        indok:
          type: string
          maxLength: 500
      additionalProperties: false

    SzovegesMezoertek:
      title: Egy szoveges mezo egy korabbi erteke
      type: object
      required: [ertek, modositva, forras]
      properties:
        ertek:
          type: string
          description: A nevnel a nev; az allapotnal AKTIV vagy INAKTIV.
        modositva:
          type: string
          format: date-time
        forras:
          type: string
          enum: [felho, telephely]
      additionalProperties: false

    ElveszettSzovegesIras:
      title: Egy szoveges iras, ami nem lepett ervenybe
      type: object
      required: [ertek, modositva, forras, ok]
      properties:
        ertek:
          type: string
        modositva:
          type: string
          format: date-time
        forras:
          type: string
          enum: [felho, telephely]
        ok:
          type: string
          enum: [KESOBBI_ERTEK, ELUTASITVA]
          description: Ugyanaz, mint az arnal - zarolas ezekre a mezokre nincs.
        kod:
          type: [string, "null"]
      additionalProperties: false

    ArKeres:
      title: Armodositas
      type: object
      required: [bruttoAr]
      properties:
        bruttoAr:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: >
            AZ UJ TELJES AR, egesz forintban - nem kulonbozet es nem szazalek.
            A nulla ervenyes, a negativ nem.
          minimum: 0
        indok:
          type: string
          maxLength: 500
          description: >
            Szabad szoveges indoklas. Nem kotelezo, de az audit-bejegyzesbe
            bekerul, es egy "miert lett dragabb a marciusi ar" kerdesnel ez az
            egyetlen dolog, ami valaszol.
      additionalProperties: false

    Mezoertek:
      title: Egy mezo egy korabbi erteke
      type: object
      required: [bruttoAr, modositva, forras]
      properties:
        bruttoAr:
          $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
        modositva:
          type: string
          format: date-time
        forras:
          type: string
          enum: [felho, telephely]
      additionalProperties: false

    ElveszettIras:
      title: Egy iras, ami nem lepett ervenybe
      type: object
      required: [bruttoAr, modositva, forras, ok]
      properties:
        bruttoAr:
          $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
        modositva:
          type: string
          format: date-time
          description: Amikor az iras TORTENT - nem amikor elbiraltak.
        forras:
          type: string
          enum: [felho, telephely]
        ok:
          type: string
          enum: [KESOBBI_ERTEK, ELUTASITVA, ZAROLT]
          description: |
            ⚠️ HAROM OK, es a felulet KULON mondja oket - egy kozos "elveszett"
            azt sugallna, hogy hiba tortent, pedig a szabaly szerint mukodott:

              - KESOBBI_ERTEK: valaki KESOBB atirta. Sorrend, senkirol nem szol.
              - ELUTASITVA: a felho elutasitotta, mert az ironak az iras idejen
                nem volt joga. A kozben tortent eladasok rendben vannak.
              - ZAROLT: a kozpont kozben zarolta. Hataskor.
        kod:
          type: [string, "null"]
          description: A pontos gepi ok, ha van (pl. NINCS_ILYEN_FELHASZNALO).
      additionalProperties: false

    Zarolas:
      title: Zarolas
      description: |
        A mezo egy MAGASABB SZINTEN zarolva van, tehat a telephelyrol nem
        irhato at - idobelyegtol fuggetlenul (B16.3).

        ⚠️ AZERT MEGY KI A DROTON, MERT A FELULETNEK MEG KELL MONDANIA. Ha csak
        elrejtene a szerkesztest, a menedzser nem ertene, miert nem sikerul; ha
        csak visszautasitana, ugyanugy nem. "Ar: 1200 Ft - a kozpont allitotta
        be, zarolva" - ez a kulonbseg.
      type: object
      required: [szint]
      properties:
        szint:
          type: string
          enum: [lanc]
          description: >
            Melyik szint zarolta. Ma csak a lanc/franchise kozpont zarolhat; ha
            tobb szint lesz, ez a felsorolas bovul.
        zarolva:
          type: string
          format: date-time
      additionalProperties: false

    Mezoeredet:
      title: Mezoeredet
      description: |
        MIKOR es MELYIK OLDALROL kapta a mezo a mostani erteket.

        Azert van a szerzodesben, mert az utkozest mezonkenti idobelyeg oldja
        fel (O3): a kesobbi iras nyer. A felulet enelkul nem tudna megmutatni,
        hogy egy valtoztatas mar nem ervenyes - a tulajdonos a szamlan
        szembesulne vele.
      type: object
      required: [modositva, forras]
      properties:
        modositva:
          type: string
          format: date-time
          description: >
            A modositast ELFOGADO kiszolgalo oraja szerint - nem a bongeszoe.
          examples: ["2026-09-19T08:12:04Z"]
        forras:
          type: string
          enum: [felho, telephely]
      additionalProperties: false

    Kiszereles:
      title: Kiszereles
      description: >
        Az ERTEKESITHETO egyseg: ezen all az ar es a vonalkod. A 0,3 l nem a
        0,5 l aranyos resze, hanem amennyit az ugyfel mond.
      type: object
      required: [azonosito, nev, bruttoAr, aktiv]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
          examples: ["Alap", "0,3 l"]
        bruttoAr:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: EGESZ FORINT (I1). Lebegopontos ertek itt sem fordul elo.
        arEredet:
          allOf:
            - $ref: '#/components/schemas/Mezoeredet'
          description: >
            Hianyzik, ha az arat meg SOHA nem irta at senki ezen a rendszeren
            (peldaul importbol vagy telepiteskor keletkezett). A hianya tehat
            informacio, nem hiba.
        arZarolas:
          allOf:
            - $ref: '#/components/schemas/Zarolas'
          description: >
            Hianyzik, ha az ar NINCS zarolva - vagyis a telephelyrol
            szerkesztheto. Ha jelen van, az armodositas 403-at ad.
        arElozo:
          allOf:
            - $ref: '#/components/schemas/Mezoertek'
          description: |
            Az ELOTTE ervenyes ar (1.6.0): mennyi volt, mikor es honnan kapta.
            Hianyzik, ha a mostani ertek elott nem ismert masik - az iras-
            tortenet a bevezetese napjatol gyulik, a korabbi mult nincs meg.
        arElveszett:
          allOf:
            - $ref: '#/components/schemas/ElveszettIras'
          description: |
            A LEGUTOBBI iras, ami NEM lepett ervenybe (1.6.0) - az elozo ertek
            ota. Hianyzik, ha ilyen nincs.

            ⚠️ AZERT VAN ITT, MERT AZ O3 SZABALY SZERINT A VESZTES ERTEK NEM
            TUNIK EL, CSAK NEM ERVENYES - es ezt a felulet koteles megmutatni.
            Enelkul a tulajdonos a szamlan szembesulne azzal, hogy az atirt ar
            nem el.
        vonalkodok:
          type: array
          items:
            type: string
        aktiv:
          type: boolean
      additionalProperties: false
