      operationId: felhasznalok
      summary: A berlo Ziggurat-felhasznaloi
      description: |
        A letiltottak is szerepelnek - **torles nincs**, csak letiltas, es a
        letiltott embert is latni kell (peldaul hogy vissza lehessen kapcsolni).
      parameters:
        - $ref: '#/components/parameters/Telephely'
        - name: fajta
          in: query
          required: false
          schema:
            type: string
            enum: [ZIGGURAT, PULTOS]
          description: >
            Melyik populacio. Alapertelmezesben a ZIGGURAT-fiokok. A pultos
            fiokok kezelese kesobbi szelet; a szuro azert van MOST itt, hogy a
            felveteleuk ne legyen toro valtozas.
      responses:
        '200':
          description: A felhasznalok
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                type: object
                required: [felhasznalok]
                properties:
                  felhasznalok:
                    type: array
                    items:
                      $ref: '#/components/schemas/Felhasznalo'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

    post:
      tags: [hozzaferes]
      operationId: felhasznalotLetrehoz
      summary: Uj Ziggurat-felhasznalo
      description: |
        A felhasznalo **e-mailes meghivot** kap; a bejelentkezes azonositoja a
        berlo rovid neve es az itt megadott azonosito egyutt (pl.
        `kiskocsma.Pista`).

        ⚠️ A **jogosultsagokat NEM itt adjuk meg**: a felvetel utan kulon
        hivassal allnak be, mert a burok ellenorzese ott tortenik, es egy
        felig sikerult felvetel rosszabb, mint ket lepes.

        A meghivo sorsat a valasz `meghivo` mezoje mondja meg (1.7.0). ⚠️ Ha a
        levelet nem sikerult elkuldeni, a FIOK ATTOL MEG LETREJON - a meghivo
        kesobb ujrakuldheto. A felulet ezt KIMONDJA, nem tesz ugy, mintha a
        level elment volna.

        ⚠️ A meghivo LINKJE a valaszban SOHA nem szerepel: ha a meghivo latna,
        o maga allithatna be a masik jelszavat, es utana az o neveben
        dolgozhatna - a naplo pedig a meghivottat mutatna.
      parameters:
        - $ref: '#/components/parameters/Telephely'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FelhasznaloKeres'
      responses:
        '201':
          description: A letrehozott felhasznalo
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Felhasznalo'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '409':
          description: Ez az azonosito mar foglalt ennel a berlonel.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '422':
          $ref: '#/components/responses/Hiba422'
        '501':
          $ref: '#/components/responses/Hiba501'
        default:
          $ref: '#/components/responses/Hiba'

  /felhasznalok/{felhasznaloAzonosito}:
    get:
      tags: [hozzaferes]
      operationId: felhasznalo
      summary: Egy felhasznalo, a jogosultsagaival
      parameters:
