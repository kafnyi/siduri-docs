      summary: Nev es allapot
      description: |
        ⚠️ **A LETILTAS NEM TORLES.** Az `aktiv: false` letiltja a fiokot; az
        adat, a naplo es a korabbi bejegyzesek erintetlenek maradnak.

        ⚠️ **HA VAN KAPCSOLT PULTOS FIOK**, a valasz `kapcsoltFigyelmeztetes`
        mezoje megmondja - a felulet ebbol kerdezi meg a felhasznalot, hogy a
        masikat is tiltsa-e. **A rendszer nem dont helyette, de nem is hallgat.**
      parameters:
        - $ref: '#/components/parameters/Telephely'
        - $ref: '#/components/parameters/FelhasznaloAzonosito'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FelhasznaloModositas'
      responses:
        '200':
          description: A modositott felhasznalo
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
            Siduri-Kiszolgalo:
              $ref: '#/components/headers/SiduriKiszolgalo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FelhasznaloReszletek'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          description: |
            Nincs jogosultsag, VAGY a **burok**: csak olyan jogot/szerepet lehet
            adni es elvenni, amivel a muveletet vegzo maga is rendelkezik
            (`BUROK` kod), VAGY a cel **erosebb szinten** all (`EROSEBB_SZINT`),
            VAGY a **kizaras elleni vedelem** fogott (`KIZARAS` kod).
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '404':
