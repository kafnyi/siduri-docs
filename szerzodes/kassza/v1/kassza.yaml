openapi: 3.1.0

info:
  title: Siduri kasszaprotokoll (K1)
  version: 1.23.0
  summary: POS kliens es vekonykliensek a telephelyi szerverrel
  license:
    name: Zart - Myth System tulajdona
    identifier: LicenseRef-MythSystem-Zart
  description: |
    A K1 szerzodes: POS kliens (C#/WPF), PDA, KDS, rendeleskijelzo es standolo
    beszelnek a telephelyi szerverrel. Egyetlen megvalositoja van, a telephelyi
    szerver.

    Ez az F1 fazis szelete: EGY TERMEK -> KOSAR -> KESZPENZES FIZETES ->
    NYOMTATAS VALODI ADOUGYI ESZKOZRE. Nem funkciolista, hanem bizonyitek arra,
    hogy a technologiai alap es a P1 premissza all.

    Amit ez a szelet mar most szerkezetileg rogzit, mert utolag nem tehető bele:
      - epoch (fencing) minden irason        (F1.4)
      - idempotencia-kulcs minden irason     (F1.5)
      - (epoch, szamlalo) sorrend            (F1.2 / I17)
      - eszkozonkent elhatarolt bizonylatszam(F1.3 / I13)
      - nullazhato adougyi mezo              (I14)
      - penz egesz forintban, tort ertek szovegkent (I1)

servers:
  - url: https://{telephelyiSzerver}/kassza/v1
    variables:
      telephelyiSzerver:
        default: siduri.helyi

security:
  - EszkozTanusitvany: []
    MunkamenetToken: []

tags:
  - name: torzsadat
    description: Amit a kliens gyorsitotarba tesz, hogy degradalt modban is mukodjon
  - name: rendeles
    description: Nyitas, tetelfelvetel, lezaras
  - name: bizonylat
    description: A lezaras utani adougyi ut

paths:
  /nap/nyitas:
    post:
      operationId: napotNyit
      summary: Munkanap nyitasa
      description: |
        ⚠️ EZ A RESZ HIANYZOTT, ES A HIANY BLOKKOLO VOLT: az eladas lezarasa
        nyitott munkanapot es muszakot igenyel, a kliensnek viszont nem volt
        modja egyiket sem megnyitni. A kassza a szerzodes korabbi alakjaval el
        sem tudott volna kezdeni kereskedni.

        A nyitast a kotelezo SZUNET korlatozza: a napzaras ota el kell telnie
        egy beallitott idonek. Ez nem kenyelmi szabaly, hanem az a biztonsagi
        tartalek, ami miatt a munkanap matematikailag nem erheti el a 24 orat -
        amit az NTAK napi zaras szinkron, azonnali elutasitassal ellenoriz.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NapNyitasKeres'
      responses:
        '200':
          description: A megnyitott nap allapota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NapAllapot'
        '403':
          description: Nincs jogosultsag a napnyitashoz.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '409':
          description: |
            Mar van nyitott nap, VAGY a kotelezo szunet meg tart.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /nap/allapot:
    get:
      operationId: napAllapot
      summary: A nyitott munkanap allapota
      description: |
        A felulet ebbol irja ki a figyelmeztetest. A csakFaliora jelzest KI KELL
        IRNI: ha a nap nyitasat MAS ora merte (ujraindult szerver, masik gep,
        tartalek szerver), a meresunk visszaesik a fali orara, es egy
        orajavitas eszrevetlenul elmozdithatja.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
      responses:
        '200':
          description: A nap allapota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NapAllapot'
        '409':
          description: Nincs nyitott nap.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /nap/zaras:
    post:
      operationId: napotZar
      summary: Munkanap kezi zarasa
      description: |
        A KEZI zaras valakinek a dontese, ezert jogosultsaghoz kotott. Az
        automatikus es a kenyszerzaras mogott nincs ember - azokat az utemezo
        vegzi, es ott nincs mit ellenorizni.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EszkozIdoKeres'
      responses:
        '200':
          description: A nap lezarva
          content:
            application/json:
              schema:
                type: object
                properties:
                  lezarva:
                    type: boolean
        '403':
          description: Nincs jogosultsag.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /muszak/nyitas:
    post:
      operationId: muszakotNyit
      summary: Muszak nyitasa az eszkozon
      description: |
        MUSZAK NELKUL NINCS ELADAS. Nem formasag: a bizonylat a muszakhoz
        tartozik, es enelkul a kassza soha nem lenne elszamolhato.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuszakNyitasKeres'
      responses:
        '200':
          description: A megnyitott muszak
          content:
            application/json:
              schema:
                type: object
                required: [muszak]
                properties:
                  muszak:
                    $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        '403':
          description: Nincs jogosultsag.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '409':
          description: Mar van nyitott muszak ezen az eszkozon, vagy nincs nyitott nap.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /muszak/zaras:
    post:
      operationId: muszakotZar
      summary: Muszak zarasa cimletbontassal
      description: |
        ⚠️ A VALASZ ALAKJA A JOGOSULTSAGTOL FUGG, NEM A KERESETOL. Aki nem latja
        a muszakosszesitot, annak a valasz NEM TARTALMAZ osszeget - nem nullat,
        nem ureset: A MEZO NINCS OTT. Amit nem kuldunk el, azt a kliens nem
        tudja veletlenul kiirni.

        A vakzaras nem kulon jelzo, hanem a muszak.osszesito_lathato jogosultsag
        HIANYA. Kulon kapcsoloval a ketto szetcsuszhatna: valakinek latszana az
        osszesito, de megis vaknak jelolnenk.

        ⚠️ A ROGZITES UTAN SEM mutatjuk vissza az elterest. Egy "elteres: +5 000"
        visszajelzesbol a kezelo megtanulta a vart szamot a kovetkezo alkalomra.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuszakZarasKeres'
      responses:
        '200':
          description: |
            A zaras eredmenye. Vakzarasnal az osszegmezok HIANYOZNAK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuszakZarasValasz'
        '403':
          description: Nincs jogosultsag, vagy mas muszakjahoz kell kulon jog.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '409':
          description: A muszak mar le van zarva.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /kezelok:
    get:
      operationId: kezelok
      summary: A belepokepernyon felkinalhato kezelok
      description: |
        Csak azok, akik BE TUDNAK lepni: aktiv felhasznalok, akiknek van
        beallitott PIN-juk. Aki nincs koztuk, azt felkinalni csak arra lenne jo,
        hogy valaki hiaba probalkozzon vele.

        ⚠️ Ez a lista a szemelyzet nevet adja vissza HITELESITES NELKUL. Tudatos:
        ugyanezek a nevek a kioszk kepernyojen amugy is ott vannak, es a
        belepeshez PIN kell. Amit NEM ad vissza: jogosultsagot, szerepet,
        kartyat - azaz semmit, ami a probalgatast segitene.

        A zaroltak benne maradnak: aki zarolva van, arrol a sajat belepesi
        kiserletekor kap ertelmes uzenetet. A listabol kihagyva csak annyit
        latna, hogy "eltuntem", es a tamogatas keresne, mi tortent.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
      responses:
        '200':
          description: A felkinalhato kezelok
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Kezelo'
        '400':
          description: |
            Hianyzo vagy rossz alaku keresfejlec. Kulon kod, mert egy hianyzo
            fejlec nem uzemzavar: a kliensfejlesztonek egy mondatban meg lehet
            mondani, mi hianyzik.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /szemelyzet:
    get:
      operationId: szemelyzet
      summary: A telephely pultos felhasznaloi - SZERKESZTESHEZ
      description: |
        ⚠️ NEM AZONOS A /kezelok LISTAVAL. Az a belepokepernyo listaja: nevet ad,
        hitelesites nelkul, es szandekosan SEMMI mast. Ez itt a szemelyzet
        kezelese: szerepek, allapot, es hogy mi var elbiralasra - ehhez
        felhasznalo.megtekintes jogosultsag kell.

        ⚠️ A NYILVANTARTAS GAZDAJA A FELHO (HOZZAFERES.md 2.1). Ez a lista a
        telephelyi MASOLAT, es a masolat kora szamit: a valasz megmondja, mikor
        frissult utoljara. Egy nema masolat ugyanolyan "rendben" kepet mutat,
        mint egy friss - pedig lehet, hogy hetek ota nem frissult, es egy
        kilepett dolgozo meg mindig be tud lepni a pult mogott.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Felhasznalo'
      responses:
        '200':
          description: A szemelyzet, a masolat korenak jelzesevel
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SzemelyzetValasz'
        '403':
          $ref: '#/components/responses/Hiba403'

  /szemelyzet/szerepek:
    get:
      operationId: szemelyzetSzerepek
      summary: A kioszthato szerepek, szintekkel
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Felhasznalo'
      responses:
        '200':
          description: A szerepek
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PultosSzerep'
        '403':
          $ref: '#/components/responses/Hiba403'

  /szemelyzet/{felhasznaloAzonosito}/szerepek:
    put:
      operationId: szemelyzetSzerepeket
      summary: Egy pultos szerepeinek beallitasa
      description: |
        ⚠️ A TELJES kivant halmaz, nem novekmeny. A reszleges alkalmazas olyan
        allapotot allitana elo, amit soha senki nem akart.

        ⚠️ A VALTOZTATAS HELYBEN AZONNAL EL, es a felho UTOLAG birlalja el
        (HOZZAFERES.md 7.2). A valasz ezert NEM azt jelenti, hogy vegleges: a
        `varakozo` mezo megmondja, hogy meg elbiralasra var. A sorsat a
        /szemelyzet lista `sorsuk` mezoje mutatja.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Felhasznalo'
        - name: felhasznaloAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SzerepKeres'
      responses:
        '200':
          description: A valtoztatas helyben ervenyes, elbiralasra var
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelyiValtoztatasValasz'
        '403':
          $ref: '#/components/responses/Hiba403'
        '422':
          $ref: '#/components/responses/Hiba422'

  /szemelyzet/{felhasznaloAzonosito}/jogosultsagok:
    put:
      operationId: szemelyzetJogokat
      summary: Egy pultos egyedi jogosultsagainak beallitasa
      description: |
        A szerepen FELULI, szemelyre szabott jogok - a teljes kivant halmaz.

        ⚠️ A HATALMI JOGOK KAPCSOLAT NELKUL NEM OSZTHATOK, es ezt MAR EZ A
        VEGPONT megtagadja (422, OFFLINE_NEM_OSZTHATO). A felho is megtagadna,
        de akkor a pultfonok azt hinne, elintezte - es csak masnap derulne ki,
        hogy nem. Az elso nem-et ott kell kimondani, ahol a gomb van.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Felhasznalo'
        - name: felhasznaloAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JogosultsagKeres'
      responses:
        '200':
          description: A valtoztatas helyben ervenyes, elbiralasra var
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelyiValtoztatasValasz'
        '403':
          $ref: '#/components/responses/Hiba403'
        '422':
          $ref: '#/components/responses/Hiba422'

  /szemelyzet/{felhasznaloAzonosito}/letiltas:
    post:
      operationId: szemelyzetLetiltas
      summary: Egy pultos lezarasa - KAPCSOLAT NELKUL IS
      description: |
        ⚠️ KIFELE MINDIG, BEFELE SOHA. Letiltani kapcsolat nelkul is lehet, es
        azonnal el; VISSZAENGEDNI nem - ahhoz a felho kell. Szandekosan nem
        szimmetrikus: kijuttatni valakit SURGOS lehet, epp a kapcsolat nelkuli
        orakban, beengedni sosem az.

        ⚠️ Nem torles, hanem letiltas. A korabbi bizonylatok mellol nem tunhet
        el, ki csinalta oket.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Felhasznalo'
        - name: felhasznaloAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      responses:
        '200':
          description: Letiltva, elbiralasra var
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelyiValtoztatasValasz'
        '403':
          $ref: '#/components/responses/Hiba403'

  /belepes:
    post:
      operationId: belepes
      summary: Belepes PIN-nel, kartyaval vagy nev alapjan azonositva
      description: |
        ⚠️ EZ AZ EGYETLEN VEGPONT, AMI NEM KER Siduri-Felhasznalo FEJLECET - es
        ez nem kivetel a szabaly alol, hanem a szabaly ertelme: ITT DERUL KI, KI
        A FELHASZNALO. Ha ez a vegpont is felhasznalot kerne, a belepeshez mar
        be kellene lepni.

        A belepes KET LEPES: eloszor kiderul, KI allitja magat valakinek
        (kartyaval vagy a nevere koppintva), azutan jon a PIN.

        ⚠️ A KARTYA AZONOSITO, NEM HITELESITO. Az olcso kartyak azonositoja
        barmelyik telefonnal kiolvashato es percek alatt masolhato, ezert a
        kartya ONMAGABAN nem leptet be: a PIN dont.

        A valasz visszaadja a jogosultsaghalmazt is, hogy a felulet ne kinaljon
        fel olyat, ami ugyis elutasitasba futna. Ez NEM jelenti azt, hogy a
        dontes a kliense: minden muvelet a szerveren is ellenorzodik.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BelepesKeres'
      responses:
        '200':
          description: Sikeres belepes
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BelepesValasz'
        '401':
          description: |
            Sikertelen belepes. A valasz MINDIG ugyanaz - "Hibas azonosito vagy
            PIN" -, akkor is, ha a felhasznalo nem letezik, es akkor is, ha a
            PIN alakja rossz. Kulon uzenet megmondana a probalgatonak, melyik
            felen jar a feladatnak.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '423':
          description: A fiok zarolva van; a feloldas vezetoi dontes, nem idozito.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '429':
          description: |
            Tul sok sikertelen kiserlet - varakozni kell. NEM kemeny zarolas: az
            fegyver lenne a szemelyzet kezeben (eleg otszor rossz PIN-t utni az
            uzletvezeto nevere szombat este). A novekvo varakozas ugyanazt a
            tamadast megallitja, de nem zarja ki azt, akinek dolga van.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'


  /pin:
    post:
      operationId: pintCserel
      summary: A SAJAT PIN csereje
      description: |
        ⚠️ EZ NELKUL EGY UJ FELHASZNALO EGYALTALAN NEM TUD DOLGOZNI. A belepes
        valasza pinCsereKotelezo jelzest adhat, es a felulet ilyenkor SEMMIT nem
        engedhet a csereig - vegpont nelkul viszont a csere sem volt lehetseges.
        A kezelo egy zsakutcaban allt.

        Miert kotelezo a csere: a felvetelkor adott PIN-t a FELVEVO ismeri. Amig
        nem cserelik, a "ki nyomta meg" kerdesre a valasz nem az, akire
        hivatkoznank.

        ⚠️ A JELENLEGI PIN-T IS KERJUK. Nem formasag: a munkamenet egy nyitva
        hagyott kassza elott is el, es akkor barki atirhatna a bejelentkezett
        kezelo PIN-jet - vagyis kizarhatna a sajat gepebol, es a nevében
        dolgozhatna tovabb.

        A jelenlegi PIN ellenorzese ugyanazon az uton megy, mint a belepes:
        ugyanaz a novekvo varakozas, es a rossz PIN UGYANAZT a 401-et adja.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinCsereKeres'
      responses:
        '200':
          description: A PIN lecserelve. A kotelezo csere ezzel megszunik.
          content:
            application/json:
              schema:
                type: object
                required: [lecserelve]
                properties:
                  lecserelve:
                    type: boolean
        '401':
          description: |
            A jelenlegi PIN hibas. UGYANAZ a valasz, mint a sikertelen
            belepesnel - kulon uzenet megmondana a probalgatonak, melyik felen
            jar a feladatnak.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '422':
          description: Az uj PIN gyenge (tul rovid, csupa azonos jegy, sorozat, gyakori).
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /felhatalmazas:
    post:
      operationId: felhatalmazastKer
      summary: Vezetoi jovahagyas a HELYSZINEN, EGY muveletre
      description: |
        A pincer sztornozni akar, de nincs joga. NEM az a megoldas, hogy kilep
        es az uzletvezeto bejelentkezik - az lassu, es a MUSZAK is
        osszekeveredne: a bizonylatok hirtelen az uzletvezeto muszakjaba
        kerulnenek.

        Helyette az uzletvezeto a helyszinen jovahagyja az EGY muveletet, es az
        auditba MINDKET szemely bekerul. A valaszul kapott azonositot a
        kezdemenyezo a muvelet keresenek felhatalmazas mezojebe teszi.

        ⚠️ A JOVAHAGYONAK IS PIN-T KELL UTNIE. Enelkul a kero egyszeruen
        BEIRHATNA a vezetoje azonositojat, es sajat magat hatalmazna fel - a
        jovahagyas pont annyit erne, mint a hianya.

        ⚠️ A siduri.* kor jovahagyassal SEM gyakorolhato, es nem minden
        jogosultsag delegalhato egyszeri felhatalmazassal.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FelhatalmazasKeres'
      responses:
        '201':
          description: A felhatalmazas azonositoja
          content:
            application/json:
              schema:
                type: object
                required: [felhatalmazas]
                properties:
                  felhatalmazas:
                    $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        '401':
          description: A jovahagyo PIN-je hibas.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '403':
          description: |
            A jovahagyonak sincs meg a jogosultsaga, VAGY a jogosultsag
            egyszeri felhatalmazassal nem adhato.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /kassza/mozgas:
    post:
      operationId: keszpenzmozgas
      summary: Befizetes, kifizetes, folozes, valtopenz
      description: |
        A KASSZA MINDEN MOZDULATANAK VAN OKA, es az ok LISTABOL valasztott.
        Szabad szovegbol egy ev mulva nem lehet megmondani, hanyszor vittek ki
        penzt beszerzesre: "beszerzes", "bevasarlas", "boltba mentem" mind
        ugyanaz - csak a gep szamara nem.

        A JOG A MOZGAS TIPUSAHOZ tartozik, nem a "keszpenzmozgas" fogalmahoz.
        Egy pultosnak a valtopenz betetele napi munka; a folozes mar a trezor
        fele mozgat penzt, es az mas felelosseg.

        Az osszeg ELOJELET a szerver adja a tipusbol: a befizetes es a
        valtopenz pozitiv, a kifizetes es a folozes negativ. Egyetlen osszegzes
        adja a vart kasszatartalmat, nem tipusonkenti agazas - az utobbi egy
        elfelejtett aggal csendben hamis szamot adna.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeszpenzmozgasKeres'
      responses:
        '200':
          description: A mozgas rogzitve
          content:
            application/json:
              schema:
                type: object
                required: [rogzitve]
                properties:
                  rogzitve:
                    type: boolean
        '403':
          description: Nincs jogosultsag EHHEZ a mozgastipushoz.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '422':
          description: Nulla osszeg, ismeretlen tipus, vagy hianyzo indokkod.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /indokok/{keszlet}:
    get:
      operationId: indokok
      summary: Egy indokkeszlet felkinalhato kodjai
      description: |
        A felulet ebbol epiti az indokvalasztot.

        ⚠️ EZ NELKUL A SZTORNO NEM MUKODIK. A szerver kotelezo indokkodot ker,
        es CSAK a telephelyen ervenyes kodot fogadja el - a kliensnek viszont
        nem volt honnan megtudnia, melyek ezek. Ugyanaz a hiba, mint amikor a
        belepes kotelezo volt, de nem volt belepes-vegpont.

        Az ALAPKESZLET telephelyfuggetlen, de barmelyik telephely felvehet
        sajat kodot melle - ezert nem lehet a kliensbe egetni.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - name: keszlet
          in: path
          required: true
          schema:
            type: string
            enum: [SZTORNO, KEDVEZMENY, ARFELULIRAS, LELTAR, FIOKNYITAS,
                   NEM_FIZETETT_LEZARAS, KESZPENZMOZGAS, INTEGRACIO_KIKAPCSOLAS,
                   ORAALLITAS, DEGRADALT_MOD, SZAMLAIGENY]
      responses:
        '200':
          description: A felkinalhato indokkodok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Indokkod'
        '400':
          description: Ismeretlen indokkeszlet.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /rendelesek/{rendelesAzonosito}/megosztas:
    post:
      operationId: rendelestMegoszt
      summary: A rendeles megosztasa reszekre
      description: |
        ⚠️ KET LEPES, ES A SZETVALASZTAS SZANDEKOS. Eloszor megosztjuk a
        rendelest - ekkor MEG SENKI NEM FIZETETT -, azutan a reszek egyenkent
        fizetnek. Egy lepesben nem menne: az asztalnal a masodik vendeg akkor
        is elmehet a mosdoba, amikor az elso mar fizetne.

        A KETFELE MEGOSZTAS UGYANAZ A MUVELET, MAS SULYOKKAL. Az egyenlo osztas
        nem kulon eljaras: minden tetelsort N reszre bontunk azonos sullyal; a
        teteles osztasnal a sulyokat a kezelo adja meg. Ha ket kulon eljaras
        lenne, elobb-utobb csak az egyikbe kerulne bele egy javitas.

        MIERT NEM A VEGOSSZEGET OSZTJUK EL: mert az afa afakulcs-csoportonkent,
        bizonylatszinten szamolodik vissza. Ha a 12 000 Ft-os vegosszeget
        osztanank haromfele, minden resznel ujra kellene donteni, melyik
        afakulcsba mennyi esik - es a dontes onkenyes lenne. SORONKENT OSZTVA A
        KERDES FEL SEM MERUL.

        ⚠️ A RESZEK AFAJANAK OSSZEGE NEM FELTETLENUL EGYEZIK az osztatlan
        bizonylat afajaval. Nem hiba: a visszaszamolas bizonylatonkent kerekit,
        es harom bizonylat haromszor kerekit. Az elteres afakulcsonkent es
        reszenkent legfeljebb egy forint - de LETEZIK, es aki a napi
        osszesitot nezi, talalkozni fog vele.

        KIOSZTATLAN TETEL NEM MARADHAT. Ha maradhatna, a reszek osszege
        kevesebb lenne, mint a rendeles, es a kulonbozet csendben eltunne.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
        - name: rendelesAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MegosztasKeres'
      responses:
        '200':
          description: A reszek, soronkenti bontassal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MegosztasValasz'
        '403':
          description: Nincs jogosultsag a szamlamegosztashoz.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '409':
          description: A rendeles mar meg van osztva, vagy mar nem nyitott.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '422':
          description: |
            A megosztas nem lehetseges: kiosztatlan tetel maradt, egy reszre
            nulla forint jutna, vagy ketto alatti reszszam.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    get:
      operationId: megosztasAllapota
      summary: A megosztas allapota - melyik resz fizetett mar
      description: |
        A felulet ebbol tudja, melyik reszre kinaljon fizetest. Enelkul a
        kezelo a sajat emlekezetebol dolgozna, es egy megszakadt muszak utan
        ket resznek is fizettetne.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - name: rendelesAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      responses:
        '200':
          description: A megosztas allapota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MegosztasAllapot'
        '404':
          description: Ez a rendeles nincs megosztva.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    delete:
      operationId: megosztastVisszavon
      summary: A megosztas visszavonasa
      description: |
        ⚠️ CSAK ADDIG, AMIG EGYETLEN RESZ SEM FIZETETT. Egy kiadott bizonylat a
        vendeg kezeben van, es az nem ervenytelenedik attol, hogy mi
        atrendeznenk a maradekot. Ilyenkor a SZTORNO az ut.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
        - name: rendelesAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      responses:
        '200':
          description: A megosztas visszavonva
          content:
            application/json:
              schema:
                type: object
                required: [visszavonva]
                properties:
                  visszavonva:
                    type: boolean
        '404':
          description: Ez a rendeles nincs megosztva.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '409':
          description: Mar van fizetett resz - innentol a sztorno az ut.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /rendelesek/{rendelesAzonosito}/megosztas/{reszSorszam}/lezaras:
    post:
      operationId: reszSzamlatLezar
      summary: Egy resz fizetese
      description: |
        A resz a SAJAT SORAIBOL szamolja az afajat, ugyanazzal a szaballyal,
        mint egy osztatlan bizonylat - es ugyanazon a kiallitasi utvonalon megy
        at. A kerés alakja ezert azonos a rendeles lezarasaeval.

        Minden resz sajat bizonylatot kap, sajat sorszammal. A tobbi resz
        addig nyitva marad.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
        - name: rendelesAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        - name: reszSorszam
          in: path
          required: true
          description: 1-tol indexelve, ahogy a megosztas valasza adja.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LezarasKeres'
      responses:
        '201':
          description: A resz bizonylata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bizonylat'
        '404':
          description: Ez a rendeles nincs megosztva.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '409':
          description: Ez a resz mar fizetett, vagy a rendeles mar nem nyitott.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '422':
          description: Nincs ilyen resz, vagy a fizetesek osszege nem egyezik.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /rendelesek/{rendelesAzonosito}/tetelek/{tetelsorAzonosito}/torles:
    post:
      operationId: tetelsortTorol
      summary: Nyitott rendeles tetelsoranak torlese
      description: |
        ⚠️ A TORLES ES A SZTORNO NEM UGYANAZ, es a kulonbseg nem szohasznalat:

        |                      | Torles                    | Sztorno                  |
        |----------------------|---------------------------|--------------------------|
        | Mit erint            | NYITOTT rendeles tetelsorat | LEZART, fizetett bizonylatot |
        | Keletkezik bizonylat | nem                       | igen, NEGATIV bizonylat  |
        | Adougyi szam kell    | nem                       | igen, az eredetie        |

        Ha a kettot osszemosnank, a lezart bizonylat "torolhetove" valna - ami
        pontosan az a kar, amivel egy muszakot nyugtaadas nelkul le lehet
        vezetni.

        A JOG ATTOL FUGG, ELMENT-E MAR A KONYHARA. A felutes utan tiz
        masodperccel torolt tetel elgepeles; a konyhara mar elkuldott tetel
        torlese fizetes elott a visszaeles mintaja - ket kulon dolog, ket
        kulon jog.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
        - name: rendelesAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        - name: tetelsorAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndokolasKeres'
      responses:
        '200':
          $ref: '#/components/responses/Rendeles'
        '403':
          description: Nincs jogosultsag - kulon jog kell a konyhara mar elkuldott tetelhez.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '409':
          description: A rendeles mar nem nyitott, vagy a tetelsor mar torolve van.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /bizonylatok/szam/{siduriBizonylatszam}:
    get:
      operationId: bizonylatSzamSzerint
      summary: Egy bizonylat a Siduri bizonylatszama alapjan
      description: |
        EZ AZ, AMI A VENDEG KEZEBEN VAN. A masnap visszatero vendeg hozza a
        nyugtat, es a pincer a szamot uti be.

        ⚠️ EZ A KERESES NEM IGENYEL RIPORTJOGOT - szemben a nap teljes
        listajaval. Aki a szamot be tudja utni, az a papirt is latja; a
        riportjog ott vedene, ahol nincs mit vedeni.

        A valasz FEJLEC, nem teljes bizonylat: szam, ido, vegosszeg, allapot.
        Amit nem kuldunk el, azt nem is kell vedeni. Az allapotbol latszik,
        hogy a bizonylatot mar sztornoztak-e.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - name: siduriBizonylatszam
          in: path
          required: true
          schema:
            type: string
          description: A nyugtan szereplo Siduri bizonylatszam.
      responses:
        '200':
          description: A megtalalt bizonylat fejlece
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BizonylatFejlec'
        '404':
          description: Nincs ilyen szamu bizonylat ezen a telephelyen.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /bizonylatok:
    get:
      operationId: napBizonylatai
      summary: A nyitott uzleti nap bizonylatai
      description: |
        A nap forgalmanak listaja, legujabb elol - ezert RIPORTJOGHOZ KOTOTT
        (riport.napi_forgalom), szemben a szamra keresessel. Aki egy konkret
        nyugtat akar visszavonni, annak a szam eleg.

        CSAK A NYITOTT NAP. A lezart napok bizonylatainak listazasa riport, nem
        kasszamuvelet - az a webes adminra tartozik. A lezart nap egy konkret
        bizonylata tovabbra is elerheto szam szerint.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Felhasznalo'
      responses:
        '200':
          description: A nyitott nap bizonylatai, legujabb elol
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BizonylatFejlec'
        '403':
          description: Nincs riport.napi_forgalom jogosultsag.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '409':
          description: Nincs nyitott uzleti nap.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /bizonylatok/{bizonylatAzonosito}/sztorno:
    post:
      operationId: bizonylatotSztornoz
      summary: Lezart bizonylat sztornozasa
      description: |
        NEM TOROL: UJ, NEGATIV BIZONYLAT keletkezik, sajat sorszammal,
        ellentetes elojelu osszegekkel, az eredetire hivatkozva. Az eredeti
        allapota SZTORNOZOTT lesz, de a TARTALMA ERINTETLEN MARAD.

        ⚠️ AZ INDOKKOD KOTELEZO, es csak a telephelyen ervenyes kod fogadhato el.
        A felkinalhato kodokat a GET /indokok/SZTORNO adja.

        ⚠️ AZ ADOUGYI SZTORNOHOZ KELL AZ EREDETI ADOUGYI SZAM. Ha hianyzik, a
        muvelet nem indul el csendben: az tamogatoi eset, az eszkoz sajat
        naplojabol feloldva.

        ⚠️ A SZTORNO A NYITOTT NAPRA ES A SAJAT NYITOTT MUSZAKBA KERUL, nem az
        eredetieibe. A penz MOST jon ki a fiokbol, tehat ott is kell
        megjelennie. Ebbol harom dolog kovetkezik a kliensre nezve:
          - a valaszban kapott bizonylat szamanak ELOTAGJA A MAI NAP (yyMMdd),
            nem az eredetie - a kettot ne hasonlitsa ossze;
          - NYITOTT MUSZAK NELKUL a sztorno 409-cel elutasitasra kerul
            (NINCS_NYITOTT_MUSZAK): csukott fiokbol nem jon ki penz;
          - az eredeti bizonylat uzleti napja es muszakja VALTOZATLAN marad.

        ⚠️ MAS MUSZAKBOL VALO SZTORNOHOZ KULON JOG KELL
        (sztorno.mas_muszakbol) a sztorno.bizonylat MELLETT. A sajat
        muszakban az imenti elgepeles visszavonasa a normalis munka resze; egy
        mar elszamolt muszak bizonylata utolagos beavatkozas.

        VEZETOI JOVAHAGYAS: ha a kezdemenyezonek nincs sztornojoga, nem kell
        kilepnie es az uzletvezetonek belepnie - az lassu, es a muszak is
        osszekeveredne. Az uzletvezeto a helyszinen jovahagyja az EGY
        muveletet (felhatalmazas mezo), es az auditba MINDKET szemely bekerul.

        ⚠️ A JOVAHAGYAS EGY JOGOT POTOL, NEM KETTOT. A felhatalmazas egyetlen
        kodra szol es egyszer hasznalhato fel. Ha a kezelonek MINDKET jog
        hianyzik (sztorno.bizonylat ES sztorno.mas_muszakbol), a szerver
        TOBB_JOGOSULTSAG_HIANYZIK kodu 403-at ad, es a kliensnek NEM szabad
        jovahagyast kernie: a vezeto odaallna, jovahagyna, es a muvelet a
        masodik kapun megis elhasalna - mar elhasznalt jovahagyassal.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
        - name: bizonylatAzonosito
          in: path
          required: true
          schema:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SztornoKeres'
      responses:
        '201':
          description: A keletkezett NEGATIV bizonylat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bizonylat'
        '403':
          description: >
            Nincs sztornojog es vezetoi jovahagyas sem erkezett
            (NINCS_JOGOSULTSAG), vagy ket jog is hianyzik, amit egyetlen
            jovahagyas nem potol (TOBB_JOGOSULTSAG_HIANYZIK).
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '409':
          description: >
            A bizonylat mar sztornozva van (MAR_SZTORNOZVA), vagy nincs nyitott
            muszak, amibol a penz kijohetne (NINCS_NYITOTT_MUSZAK).
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '422':
          description: Hianyzo vagy ervenytelen indokkod.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /beallitasok:
    get:
      tags: [torzsadat]
      operationId: beallitasok
      summary: A telephely kuszobei
      description: |
        ⚠️ KODBA EGETVE EZEK EGY HONAP MULVA MAST MUTATNANAK, mint amit a
        szerver elfogad. A kedvezmenykuszob es a szervizdij-megerosites hatara
        TELEPHELYENKENT allithato.

        A kassza a kedvezmeny beutesekor - A KERES ELKULDESE ELOTT - meg akarja
        mondani a kezelonek, hogy indok kell-e hozza, es hogy vezetoi jovahagyas
        kell-e. Enelkul ezt a SZERVER ELUTASITASABOL tudna meg, a vendeg elott.

        NEM jogosultsaghoz kotott: ez nem forgalmi adat, hanem a telephely
        szabalya. Aki egyaltalan el tud adni, annak tudnia kell, hol a hatar.

        A kliens ezt GYORSITOTARBA TESZI, a termeklistahoz hasonloan.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
      responses:
        '200':
          description: A telephely kuszobei
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beallitasok'
        '401':
          $ref: '#/components/responses/Hiba401'

  /arfolyamok:
    get:
      tags: [torzsadat]
      operationId: arfolyamok
      summary: Az ervenyes valutaarfolyamok
      description: |
        ⚠️ ARFOLYAMFORRAS NELKUL A VALUTAS FIZETES NEM KONYVELHETO. A fizetes
        alakja es az adatbazis eddig is ismerte a valutat, forras viszont sehol
        nem volt a rendszerben: a kliens barmilyen arfolyamot kuldhetett, es a
        szerver elfogadta. A penztaros elveszi a husz eurot, a bizonylatra pedig
        az az osszeg kerul, amit a kliens mondott.

        FELULIRASIG ERVENYES (G5.6). Nincs lejarat: ami utoljara be lett
        allitva, az az ervenyes.

        A "friss" jelzo azt mondja meg, hogy a NYITOTT UZLETI NAP megnyitasa ota
        allitottak-e be. Ha nem, a feluletnek FELTUNOEN ki kell irnia a
        figyelmeztetest - de a fizetes NEM tiltott. A blokkolastol a helyek
        egyszeruen kikapcsolnak a valutaelfogadast.

        NEM jogosultsaghoz kotott: aki valutat vesz at, annak latnia kell,
        mennyivel szamol a kassza.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
      responses:
        '200':
          description: Penznemenkent egy sor; ures lista, ha nincs beallitva semmi
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArfolyamAllapot'
        '401':
          $ref: '#/components/responses/Hiba401'

    post:
      tags: [torzsadat]
      operationId: arfolyamot
      summary: Arfolyam rogzitese
      description: |
        SAJAT, MAGAS KOCKAZATU JOG (arfolyam.megadas), es SZANDEKOSAN nem az
        kapja meg, aki a valutat elfogadja (eladas.fizetes.valuta). Az arfolyam
        a valutas fizetes egyetlen forrasa: aki beallithatja, az donti el,
        mennyit er a vendeg husz euroja. A rossz arfolyam a kasszavisszaeles
        legrovidebb utja, mert nem a penzt kell eltuntetni, csak rosszul
        atvaltani.

        ESEMENYNAPLO, NEM BEALLITAS: minden rogzites uj sor, es az ELOZO ertek
        is bekerul az auditba. Egy "395,50 -> 300,00" sor onmagaban elmondja, mi
        tortent; egy "300,00" sor nem.

        AZ ERVENYESSEG KEZDETET A SZERVER ADJA, nem a hivo: jovobeli arfolyamot
        be lehetne allitani es elfelejteni, es akkor a kassza egy olyan
        arfolyammal szamolna, amirol senki nem tud.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArfolyamKeres'
      responses:
        '201':
          description: A rogzitett arfolyam
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArfolyamAllapot'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'

  /termekek:
    get:
      tags: [torzsadat]
      operationId: termekekLekerdezese
      summary: Ertekesitheto tetelek listaja
      description: |
        A kliens ezt GYORSITOTARBA TESZI. Degradalt modban a szerver nem
        elerheto, de eladni akkor is kell tudni - tehat a lista a kliensnel el,
        es a valtozas-jelzobol tudja meg, mikor avult el.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - name: valtozasJelzo
          in: query
          required: false
          schema:
            type: string
          description: >
            A legutobb kapott valtozas-jelzo. Ha nem valtozott semmi, a valasz
            304, tartalom nelkul - egy J1900-on ez nem apro kulonbseg.
      responses:
        '200':
          description: A teljes lista
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                type: object
                required: [valtozasJelzo, tetelek]
                properties:
                  valtozasJelzo:
                    type: string
                  tetelek:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErtekesithetoTetel'
                additionalProperties: false
        '304':
          description: Nem valtozott
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '409':
          $ref: '#/components/responses/Hiba409'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

  /asztalok:
    get:
      tags: [asztal]
      operationId: asztalok
      summary: Asztalok es a rajtuk allo nyitott rendelesek
      description: |
        ⚠️ EZ A VENDEGLATOHELY LEGGYAKORIBB KERESE - minden kepernyofrissitesnel
        lefut, ezert EGY lekerdezesbol jon, nem asztalonkent kulon. Egy
        huszasztalos helyen az N+1 husz kort jelentene, ami a J1900-as
        pultgepen lathato akadas.

        A szabad asztal SZABADKENT jon vissza (rendelesAzonosito = null), nem
        hianyzo adatkent.

        A valasz tartalmazza a FIGYELMEZTETEST is, ha egy rendeles kozelit a
        24 oras korlathoz (H6.5): a korlatba beleutkozni a legrosszabb
        pillanat - a vendeg fizetni akar, es a kassza nemet mond.
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
      responses:
        '200':
          description: Az AKTIV asztalok, sorrend szerint
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asztal'
        '401':
          $ref: '#/components/responses/Hiba401'

  /rendelesek/{rendelesAzonosito}:
    get:
      tags: [rendeles]
      operationId: rendelestLekerdez
      summary: Egy nyitott rendeles tartalma
      description: |
        ⚠️ ENELKUL AZ ASZTALOS RENDELES NEM FOLYTATHATO. A pincer egy masik
        gepnel ul le, vagy a sajatja ujraindult; a rendeles a szerveren all, de
        a kliens nem tudja, mi van rajta - es a VERZIOT sem, ami nelkul nem is
        irhat ra.
      parameters:
        - $ref: '#/components/parameters/RendelesAzonosito'
        - $ref: '#/components/parameters/Eszkoz'
      responses:
        '200':
          $ref: '#/components/responses/Rendeles'
        '404':
          description: Nincs ilyen rendeles ezen a telephelyen.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /rendelesek/{rendelesAzonosito}/vendegszam:
    post:
      tags: [rendeles]
      operationId: vendegszamot
      summary: A vendegszam modositasa
      description: |
        SAJAT JOGOT IGENYEL (rendeles.vendegszam_modositas), mert
        RIPORTALAPADAT: az egy vendegre juto kosarertek ebbol szamolodik. Aki
        elirja, a helyi mutatot rontja el.

        Asztalos rendelesnel a VERZIO kotelezo, mint minden irasnal.
      parameters:
        - $ref: '#/components/parameters/RendelesAzonosito'
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendegszamKeres'
      responses:
        '200':
          $ref: '#/components/responses/Rendeles'
        '403':
          $ref: '#/components/responses/Hiba403'
        '409':
          description: >
            A rendeles kozben megvaltozott (RENDELES_MEGVALTOZOTT), vagy 24
            oranal regebbi (RENDELES_TUL_REGI).
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  /rendelesek:
    post:
      tags: [rendeles]
      operationId: rendelesNyitasa
      summary: Rendeles nyitasa
      parameters:
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [azonosito, eszkozIdo]
              properties:
                azonosito:
                  $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
                eszkozIdo:
                  $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
                asztalAzonosito:
                  allOf:
                    - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
                  description: |
                    HA MEGVAN, ASZTALOS RENDELES. A ketto ket kulon folyamat, es
                    a katalogusban ket kulon jog all rajtuk
                    (eladas.gyorseladas, eladas.asztalra):

                    - a pultos kosara a KLIENSNEL el, masodpercekig, egy kezelo
                      nyul hozza - ha a gep meghal, a vendeg ujra elmondja;
                    - az asztalon allo rendeles a SZERVEREN all, ORAKIG, tobb
                      kezelo nyul hozza tobb geprol - a vendeg nincs ott, hogy
                      ujra elmondja.

                    Asztalos rendelesnel minden irashoz VERZIO kell, es egy
                    asztalon egy nyitott rendeles lehet.
                vendegszam:
                  type: integer
                  minimum: 1
                  description: >
                    Csak asztalosnal ertelmes. RIPORTALAPADAT: az egy vendegre
                    juto kosarertek ebbol szamolodik.
                teljesitesMod:
                  $ref: '#/components/schemas/TeljesitesMod'
              additionalProperties: false
            examples:
              gyorseladas:
                summary: Gyorseladas, asztal nelkul
                value:
                  azonosito: "0192f3a1-4c2e-7b3d-8e91-5a6b7c8d9e0f"
                  eszkozIdo: "2026-08-25T19:36:38+02:00"
                  teljesitesMod: HELYBEN
      responses:
        '201':
          $ref: '#/components/responses/Rendeles'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '409':
          $ref: '#/components/responses/Hiba409'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

  /rendelesek/{rendelesAzonosito}/tetelek:
    post:
      tags: [rendeles]
      operationId: tetelFelvetele
      summary: Tetel felvetele a rendelesre
      description: |
        AZ AR A SOR LETREHOZASAKOR ROGZUL, es soha nem ertekelodik ujra (I42).
        A mennyisegnoveles ezert UJ SORT hoz letre, nem modositja a meglevot -
        kulonben egy kozben valtozott ar visszamenoleg irna at a mar felutott
        tetelt.
      parameters:
        - $ref: '#/components/parameters/RendelesAzonosito'
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UjTetel'
      responses:
        '201':
          $ref: '#/components/responses/Rendeles'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '409':
          $ref: '#/components/responses/Hiba409'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

  /rendelesek/{rendelesAzonosito}/lezaras:
    post:
      tags: [rendeles, bizonylat]
      operationId: rendelesLezarasa
      summary: Rendeles lezarasa es bizonylat kiosztasa
      description: |
        ITT OSZTJA KI A SZERVER A SIDURI BIZONYLATSZAMOT, es itt szamolja vissza
        az afat AFAKULCS-CSOPORTONKENT, BIZONYLATSZINTEN - nem soronkent (I3).

        A valasz meg NEM jelenti, hogy nyomtattunk. A kliens ezutan nyomtat az
        adougyi eszkozre, majd a /bizonylatok/{id}/adougyi-eredmeny hivassal
        jelenti, mi lett belole. A ketto kozott a bizonylat allapota
        NYOMTATASRA_VAR.

        ⚠️ A LEZARAS JOGOSULTSAGAI. A sima lezarashoz nincs kulon "lezaras" jog;
        az alabbiak akkor lepnek eletbe, ha a keres tartalmazza oket. A
        kliensnek ezt ELORE tudnia kell, mert a gombot ennek alapjan kinalja
        fel:

        | Jog | Mikor kell | Miert |
        |-----|-----------|-------|
        | eladas.fizetes.keszpenz | pozitiv keszpenzsornal | |
        | eladas.fizetes.kartya | kartyas sornal | |
        | eladas.fizetes.utalvany | utalvanysornal | |
        | eladas.fizetes.valuta | valutas sornal | Az arfolyam a bizonylatra kerul |
        | eladas.fizetes.vegyes | egynel tobb POZITIV fizetesi modnal | |
        | kedvezmeny.vegosszeg | barmilyen kedvezmenynel | Itt valhat szet a vendeg altal fizetett es a gepbe utott osszeg |
        | kedvezmeny.kuszob_felett | a telephelyi kuszob felett | A kuszob pont az a hatar, ami folott vezetonek kell latnia |
        | szervizdij.modositas | nem nulla szervizdijnal | A felszolgaloi jutalek alapja |
        | eladas.szamla_keres | SZAMLA modnal | Mas adougyi ut, mas bizonylat |

        ⚠️ A FIZETESI MODOK JOGAIT A LEZARAS SOKAIG NEM KERDEZTE MEG. Az ot kod
        ott allt a katalogusban, a szerep-sablonok helyesen osztottak ki oket,
        es a kassza el is rejtette a gombot - a szerver viszont barmit
        elfogadott. EGY ELREJTETT GOMB NEM JOGOSULTSAG: a kerest nem a gomb
        kuldi el, hanem a kliens.

        ⚠️ A NEGATIV ES A NULLA KESZPENZSOR NEM SZAMIT BELE. A valutabol adott
        visszajaro negativ keszpenzsor, a kerekitessel lezart bizonylate nulla -
        egyik sem keszpenzatvetel, es egyik sem tesz vegyesse egy fizetest.

        ⚠️ A KUSZOB A FIX OSSZEGU KEDVEZMENYRE IS VONATKOZIK. A fix osszeget a
        kedvezmeny elotti alaphoz aranyitjuk; enelkul a kuszob egyetlen
        legordulo-valasztassal megkerulheto lenne (10 000 Ft-ra adott 9 999
        Ft-os "fix" kedvezmeny 99,99%).

        Hianyzo jog eseten a "felhatalmazas" mezo az ut - de az EGY jogot potol,
        nem kettot. Reszletek a LezarasKeres alaknal.
      parameters:
        - $ref: '#/components/parameters/RendelesAzonosito'
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LezarasKeres'
            examples:
              keszpenz:
                summary: Tiszta keszpenz, ot forintra kerekitve
                value:
                  eszkozIdo: "2026-08-25T19:40:02+02:00"
                  fizetesek:
                    - mod: KESZPENZ
                      osszeg: 1235
                      kerekitesiKulonbozet: 1
              vegyes:
                summary: >
                  1234 Ft-bol 1000 kartya + 234 keszpenz. A KEREKITES A
                  KESZPENZES RESZRE megy, nem a vegosszegre: 234 -> 235.
                value:
                  eszkozIdo: "2026-08-25T19:40:02+02:00"
                  fizetesek:
                    - mod: BANKKARTYA
                      osszeg: 1000
                    - mod: KESZPENZ
                      osszeg: 235
                      kerekitesiKulonbozet: 1
              valuta:
                summary: >
                  7940 Ft-os szamlara 25 EUR, 395,50-es arfolyamon. A husz euro
                  forintertekebol (9888) a szamla 7940; a kulonbozet FORINTBAN
                  megy vissza, ezert negativ keszpenzsor. 9888 + (-1950) = 7938
                  = 7940 + (-2).
                value:
                  eszkozIdo: "2026-08-25T19:41:07+02:00"
                  fizetesek:
                    - mod: VALUTA
                      osszeg: 9888
                      valutaOsszeg:
                        penznem: EUR
                        osszeg: "25.00"
                      arfolyam:
                        penznem: EUR
                        forintPerEgyseg: "395.500000"
                    - mod: KESZPENZ
                      osszeg: -1950
                      kerekitesiKulonbozet: -2

      responses:
        '201':
          description: A bizonylat letrejott, nyomtatasra var
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bizonylat'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '409':
          $ref: '#/components/responses/Hiba409'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

  /bizonylatok/{bizonylatAzonosito}/adougyi-eredmeny:
    post:
      tags: [bizonylat]
      operationId: adougyiEredmenyJelentese
      summary: Az adougyi eszkoz valaszanak jelentese
      description: |
        A KLIENS NYOMTAT, mert nala van az adougyi eszkoz. A szerver nincs a
        nyomtatas kritikus utjan: akadozo szervernel minden nyugta varna, es
        szerver nelkul a veszhelyzeti mod sem mukodne.

        A kliens a nyomtatasi szandekot a SAJAT HELYI outboxaba rogziti a gep
        hivasa ELOTT. Ez a hivas mar az eredmenyt jelenti - sikert vagy hibat.

        Elfogadott kockazat: ha a kliens kinyomtat, majd meghal a jelzes elott,
        a gepben van egy lezart bizonylat, amirol a rendszer nem tud. Feloldas
        tamogatoi uton, az eszkoz sajat naplojabol.

        ⚠️ VALUTAS BIZONYLATNAL AZ ESZKOZ ARFOLYAMA IS IDE JON (G5.6). Nem
        diszites: a nyugtat a gep irja, a SAJAT beallitasaval, es enelkul utolag
        csak az lenne rogzitve, hogy a kliens HITTE, hogy egyeznek.
      parameters:
        - $ref: '#/components/parameters/BizonylatAzonosito'
        - $ref: '#/components/parameters/Eszkoz'
        - $ref: '#/components/parameters/Epoch'
        - $ref: '#/components/parameters/Felhasznalo'
        - $ref: '#/components/parameters/IdempotenciaKulcs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eszkozIdo, eredmeny]
              properties:
                eszkozIdo:
                  $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
                eredmeny:
                  type: string
                  enum: [SIKERES, HIBA]
                adougyiBizonylatszam:
                  $ref: '../../kozos/azonosito.yaml#/components/schemas/AdougyiBizonylatszam'
                nyomtatoEszkozAzonosito:
                  allOf:
                    - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
                  description: Melyik adougyi eszkoz nyomtatta.
                hibaKod:
                  type: string
                hibaSzoveg:
                  type: string
                eszkozArfolyam:
                  allOf:
                    - $ref: '../../kozos/penz.yaml#/components/schemas/Arfolyam'
                  description: |
                    Amit az ADOUGYI ESZKOZ mondott a VISSZAOLVASASKOR, valutas
                    bizonylatnal. Ures, ha nem volt valutas sor.

                    ⚠️ A NYUGTAT AZ ESZKOZ IRJA, A SAJAT BEALLITASAVAL. A
                    bizonylat a mi arfolyamunkkal keszult; ha a gepe mas, KET
                    ARFOLYAM KERUL KET PAPIRRA ugyanarra a fizetesre. A kliens
                    ezert a nyomtatas ELOTT egyeztet (kiiras, majd
                    VISSZAOLVASAS), es elteres eseten el sem inditja a lezarast.

                    ⚠️ ENELKUL A MEZO NELKUL utolag nem az lenne rogzitve, hogy
                    a GEP egyetertett, csak az, hogy a KLIENS hitte.

                    Elteres eseten a szerver NEM utasitja el a jelentest: a
                    nyomtatas mar megtortent, es az elutasitas azt jelentene,
                    hogy a rendszer nem tud a papirrol, ami a vendeg kezeben
                    van. Az elteres BIZTONSAGI AUDITBA kerul
                    (ADOUGYI_ARFOLYAM_ELTERES).
              additionalProperties: false
      responses:
        '200':
          description: Rogzitve
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bizonylat'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '409':
          $ref: '#/components/responses/Hiba409'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

components:

  securitySchemes:

    EszkozTanusitvany:
      type: mutualTLS
      description: |
        AZ ESZKOZ azonossaga. A regisztralt eszkoz sajat tanusitvannyal
        jelentkezik be.

        NYITOTT DONTES (SZERZODES S5): a kolcsonos TLS a javaslat, mert egy
        LAN-on egy masolhato jelszo tul keves egy olyan geptol, ami bizonylatot
        allithat ki. Az ara valos: tanusitvany-kiosztas es -megujitas a
        telepitesnel es a telepites elettartama alatt. Amig ez a dontes nem
        zarul le, a mezo a szerzodesben benne van, es a megvalositas nem
        kezdodhet el nelkule.

    MunkamenetToken:
      type: http
      scheme: bearer
      description: |
        A BEJELENTKEZETT FELHASZNALO munkamenete. Az eszkoz azonossagatol
        fuggetlen: ugyanazon a gepen tobb kezelo valtja egymast, es a bizonylat
        ahhoz kotodik, aki kiadta.

        A token megszerzese (eszkozregisztracio, kezeloi bejelentkezes) a K1
        kesobbi szelete - az F1 bizonyito szelete mar hitelesitett allapotbol
        indul. EZ HIANY, KIMONDVA: az F2-ben potlando.

  parameters:

    Eszkoz:
      name: Siduri-Eszkoz
      in: header
      required: true
      schema:
        $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      description: >
        A kero eszkoz azonositoja. A bizonylatszam eszkozonkent elhatarolt
        tartomanybol jon, tehat ez nem naplozasi kenyelem, hanem a szamozas
        bemenete.

    Epoch:
      name: Siduri-Epoch
      in: header
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
      description: |
        A kliens altal ismert fencing-generacio. A magas rendelkezesre allas az
        F6-ban epul meg, DE EZ A MEZO AZ ELSO NAPTOL KOTELEZO: egy mezo
        felvetele a protokollba kesobb minden kliens minden verziojat erinti.

        A szerver a regebbi epochu kerest REGI_EPOCH kodu hibaval utasitja el.

    Felhasznalo:
      name: Siduri-Felhasznalo
      in: header
      required: true
      schema:
        $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
      description: |
        AKI a muveletet kezdemenyezi.

        Nem naplozasi kenyelem: enelkul egyetlen muvelet sem engedelyezheto, es
        az audit "ki" mezoje ures marad. A megvalositas ezt ugy deritette ki,
        hogy a jogosultsagi modell elkeszult, de SEMMI nem hivta - nem
        mulasztasbol, hanem mert a hivasnak nem volt hova megmondania, ki
        kezdemenyezi.

        A szerver a hianyzo jogosultsagot NINCS_JOGOSULTSAG kodu hibaval
        utasitja el, es kerulout soha nem ajanl fel.

    IdempotenciaKulcs:
      name: Idempotencia-Kulcs
      in: header
      required: true
      schema:
        $ref: '../../kozos/azonosito.yaml#/components/schemas/IdempotenciaKulcs'
      description: >
        A megismetelt kulcs UGYANAZT a valaszt adja, nem hibat es nem masodik
        hatast. A degradalt modbol valo visszajatszas definicio szerint ismetel.

    RendelesAzonosito:
      name: rendelesAzonosito
      in: path
      required: true
      schema:
        $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'

    BizonylatAzonosito:
      name: bizonylatAzonosito
      in: path
      required: true
      schema:
        $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'

  headers:
    SiduriSzerzodes:
      description: >
        Melyik szerzodessel szolgaltak ki. Egy "neha rosszul viselkedik"
        hibabejelentesnel az elso kerdes az, hogy melyik oldal melyik verziot
        futtatja - ha ez nem latszik, ez a kerdes orakba kerul.
      required: true
      schema:
        type: string
        examples: ["kassza/1.0.0"]

  responses:

    Rendeles:
      description: A rendeles allapota a muvelet utan
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rendeles'

    Hiba:
      description: Egyeb hiba
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba401:
      description: |
        Nincs ervenyes munkamenet vagy eszkozazonossag.
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba403:
      description: |
        A kezelonek nincs jogosultsaga a muvelethez. A valasz TENYT KOZOL, es
        keruloutat soha nem ajanl fel (A8 elv).
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba409:
      description: |
        Allapotutkozes. A ket legfontosabb eset:

          REGI_EPOCH   - a kliens regebbi fencing-generaciot ismer, mint a
                         kiszolgalo szerver. A keres NEM hajtodik vegre.
          NAP_LEZARVA  - az uzleti nap mar le van zarva.
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba422:
      description: |
        A keres alakilag helyes, de tartalmilag nem fogadhato el - peldaul
        hianyos afa-besorolas. A KEMENY KAPU KAPU MARAD: ezen az uton sem lehet
        megkerulni.
      headers:
        Siduri-Szerzodes:
          $ref: '#/components/headers/SiduriSzerzodes'
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  schemas:
    SzemelyzetValasz:
      title: A szemelyzet es a masolat kora
      type: object
      required: [felhasznalok, egyuzletes]
      properties:
        felhasznalok:
          type: array
          items:
            $ref: '#/components/schemas/PultosFelhasznalo'
        masolatFrissitve:
          type: [string, "null"]
          format: date-time
          description: |
            Mikor jott le utoljara a pillanatkep a felhobol.

            ⚠️ EZT KI KELL IRNI A FELULETEN. Egy nema masolat ugyanolyan
            "rendben" kepet mutat, mint egy friss - pedig lehet, hogy hetek ota
            nem frissult.
        varakozoDarab:
          type: integer
          minimum: 0
          description: >
            Hany helyi valtoztatas var meg elbiralasra. Nullanal nagyobb ertek
            azt jelenti, hogy a lathato allapot TOBBET enged, mint a felhos
            igazsag - es ezt a felhasznalonak tudnia kell.
        egyuzletes:
          type: boolean
          description: |
            Egyetlen telephelye van-e a berlonek. IGAZ eseten a globalis
            szerkesztes oldala NEM JELENIK MEG (HOZZAFERES 7.1): folosleges es
            zavaro lenne.

            ⚠️ A felho mondja meg, de a telephely ELTAROLJA - mert a pultnak ezt
            kapcsolat nelkul is tudnia kell.

    PultosFelhasznalo:
      title: Egy pultos - szerkesztesi nezetben
      type: object
      required: [azonosito, nev, aktiv, szerepek, jogosultsagok, sorsuk]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
          maxLength: 200
        bejelentkezesiNev:
          type: [string, "null"]
          maxLength: 100
        aktiv:
          type: boolean
        szerepek:
          type: array
          items:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        jogosultsagok:
          type: array
          description: A szerepen FELULI, szemelyre szabott jogok.
          items:
            type: string
            maxLength: 100
        sorsuk:
          type: array
          description: |
            Mi lett a rajta vegzett helyi valtoztatasokkal.

            ⚠️ EZT MEG KELL MUTATNI. A pultfonok kedden valtoztatott, a valasz
            szerdan erkezik - esetleg mas muszakban. Ha nem latszik, a
            valtoztatas ugy vesz el, hogy senki nem tud meg rola.
          items:
            $ref: '#/components/schemas/ValtoztatasSorsa'

    ValtoztatasSorsa:
      title: Egy helyi valtoztatas sorsa
      type: object
      required: [azonosito, tortent, fajta, allapot]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        tortent:
          type: string
          format: date-time
        fajta:
          type: string
          enum: [SZEREPEK, JOGOK, AKTIV]
        allapot:
          type: string
          enum: [VAR, ELFOGADVA, ELUTASITVA, ELAVULT]
          description: |
            ⚠️ Az ELUTASITVA es az ELAVULT NEM UGYANAZ, es a felulet KULON kell
            hogy mondja oket. Az elso a cselekvorol szol (nem volt joga); a
            masodik senkirol, csak sorrendrol (a kozpont idokozben dontott).
            A teendo is mas: az elsonel jogot kell kerni, a masodiknal meg kell
            nezni, mi lett az uj ertek.
        kod:
          type: [string, "null"]
          maxLength: 64
        uzenet:
          type: [string, "null"]
          maxLength: 500

    PultosSzerep:
      title: Kioszthato szerep
      type: object
      required: [azonosito, nev, szint, kioszthato]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
          maxLength: 200
        szint:
          type: integer
          description: Kisebb szam = erosebb. A 0. szint a Siduri rendszergazdae.
        kioszthato:
          type: boolean
          description: |
            Kioszthatja-e EZ a kezelo. Hamis, ha a szerep erosebb a sajatjanal,
            vagy ha van benne olyan jog, ami neki sincs meg.

            ⚠️ A felulet ezt ELORE tudja, tehat nem kell probalkozni. De a
            vedelem nem itt van: az elrejtett gomb nem jogosultsag.

    SzerepKeres:
      type: object
      required: [szerepek]
      properties:
        szerepek:
          type: array
          maxItems: 50
          description: A TELJES kivant szerephalmaz, nem novekmeny.
          items:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'

    JogosultsagKeres:
      type: object
      required: [jogosultsagok]
      properties:
        jogosultsagok:
          type: array
          maxItems: 500
          description: A TELJES kivant, szerepen feluli joghalmaz.
          items:
            type: string
            maxLength: 100

    HelyiValtoztatasValasz:
      title: A helyi valtoztatas nyugtazasa
      type: object
      required: [azonosito, varakozo]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        varakozo:
          type: boolean
          description: |
            ⚠️ IGAZ eseten a valtoztatas HELYBEN ERVENYES, de a felho meg nem
            mondott rola semmit. A felulet ezt NEM hallgathatja el: a
            pultfonoknek tudnia kell, hogy amit lat, az meg nem vegleges.

    PinCsereKeres:
      type: object
      required: [jelenlegiPin, ujPin, eszkozIdo]
      properties:
        jelenlegiPin:
          type: string
          pattern: '^[0-9]{4,8}$'
        ujPin:
          type: string
          pattern: '^[0-9]{4,8}$'
          description: |
            A szerver tovabbi gyengeseget is elutasit: csupa azonos jegy,
            novekvo vagy csokkeno sorozat, es a gyakori PIN-ek listaja.
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false

    FelhatalmazasKeres:
      type: object
      required: [jovahagyo, jovahagyoPin, jogosultsagKod, eszkozIdo]
      properties:
        jovahagyo:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        jovahagyoPin:
          type: string
          pattern: '^[0-9]{4,8}$'
          description: |
            ⚠️ KOTELEZO. Enelkul a kero beirhatna a vezetoje azonositojat, es
            sajat magat hatalmazna fel.
        jogosultsagKod:
          type: string
          description: Amire a felhatalmazas szol. EGY muveletre ervenyes.
        muveletLeiras:
          type: string
          description: Mit hagy jova - ez kerul az auditba, a ket szemely neve melle.
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false

    KeszpenzmozgasKeres:
      type: object
      required: [muszak, tipus, osszeg, indokKod, eszkozIdo]
      properties:
        muszak:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        tipus:
          type: string
          enum: [BEFIZETES, KIFIZETES, FOLOZES, VALTOPENZ, BORRAVALO_KIVET]
        osszeg:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: |
            POZITIV szam. Az elojelet a szerver adja a tipusbol - igy a kliens
            nem tud "negativ befizetest" kuldeni.
        indokKod:
          type: string
        indokSzoveg:
          type: string
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false

    Indokkod:
      type: object
      required: [kod, megnevezes, szabadSzovegKotelezo, alap]
      properties:
        kod:
          type: string
        megnevezes:
          type: string
        szabadSzovegKotelezo:
          type: boolean
          description: |
            Ha igaz, a kod mellé SZOVEGET is kell irni. Az "egyeb" tipusu kodok
            onmagukban semmit nem magyaraznak meg.
        alap:
          type: boolean
          description: |
            Alapkeszletbeli kod: a jelentese MINDEN telephelyen ugyanaz. A
            telephely sajat kodjai nem osszehasonlithatok telephelyek kozott.

    IndokolasKeres:
      type: object
      required: [indokKod, eszkozIdo]
      properties:
        indokKod:
          type: string
        indokSzoveg:
          type: string
          description: Kotelezo, ha az indokkod szabadSzovegKotelezo jelzoje igaz.
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false

    SztornoKeres:
      type: object
      required: [indokKod, eszkozIdo]
      properties:
        indokKod:
          type: string
        indokSzoveg:
          type: string
        felhatalmazas:
          allOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
          description: |
            A HELYSZINEN JOVAHAGYO vezeto azonositoja, ha a kezdemenyezonek
            nincs sztornojoga. Az auditba MINDKET szemely bekerul - a
            jovahagyas nem mossa el, ki inditotta.
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false

    NapNyitasKeres:
      type: object
      required: [uzletiNap, eszkozIdo]
      properties:
        uzletiNap:
          type: string
          format: date
          description: |
            Az uzleti nap datuma. NEM naptari nap: a 23:40-kor felutott rendeles
            es a 00:20-kor kiadott nyugta ugyanahhoz az uzleti naphoz tartozik.
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'

    EszkozIdoKeres:
      type: object
      required: [eszkozIdo]
      properties:
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'

    MuszakNyitasKeres:
      type: object
      required: [nyitoKeszpenz, eszkozIdo]
      properties:
        nyitoKeszpenz:
          $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'

    MuszakZarasKeres:
      type: object
      required: [muszak, cimletbontas, eszkozIdo]
      properties:
        muszak:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        cimletbontas:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: |
            Cimletenkenti darabszam, pl. {"TIZEZER": 3, "OTEZER": 2}.

            A BONTAST is taroljuk, nem csak a vegosszeget: egy kasszaelteresnel
            a cimletszerkezet gyakran megmondja, mi tortent - egy hianyzo
            huszezres nem centizes, hanem egy darab bankjegy.
        zaroFelhasznalo:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'

    MuszakZarasValasz:
      type: object
      required: [muszak, vakzaras]
      properties:
        muszak:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        vakzaras:
          type: boolean
          description: |
            Ha igaz, az osszegmezok HIANYOZNAK a valaszbol - nem uresek, nem
            nullak: nincsenek ott.
        vartKeszpenz:
          $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
        szamoltKeszpenz:
          $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
        elteres:
          $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'

    NapAllapot:
      type: object
      required: [munkanap, uzletiNap, hosszPerc, szint, csakFaliora]
      properties:
        munkanap:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        uzletiNap:
          type: string
          format: date
        hosszPerc:
          type: integer
          format: int64
          description: |
            A nyitas ota eltelt ido percben, a KONZERVATIVABB meres szerint
            (monoton es faliora kozul a nagyobb).
        szint:
          type: string
          enum: [NINCS, ENYHE, EROS, KENYSZER]
          description: |
            A kuszobok ELTELT IDOTARTAMOK, nem oraidok. A "23:45" nem este
            negyed tizenkettot jelent, hanem huszonharom ora negyvenot percet a
            nyitas ota.
        csakFaliora:
          type: boolean
          description: |
            ⚠️ KI KELL IRNI. Igaz, ha a nap nyitasat MAS monoton ora merte, mint
            ami most fut: ujraindult szerver, masik gep, tartalek szerver. Ilyenkor
            a meres visszaesik a fali orara, es egy orajavitas eszrevetlenul
            elmozdithatja.

            ⚠️ 1.22.0 OTA GYAKRABBAN IGAZ. Korabban a szerver egy MASIK ora
            szamlalojat is valodi meresnek hitte, ha az nem volt kisebb a
            mostaninal - ilyenkor a jelzes tevesen elmaradt, sot egy idegen,
            nagyobb szamlalo hamis veszzarast okozhatott. Most minden szerver-
            ujrainditas utan igaz, amig a nap le nem zarul.

    Kezelo:
      type: object
      required: [azonosito, nev]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
          description: A belepokepernyon megjeleno nev. MAS nem megy ki.

    BelepesKeres:
      type: object
      required: [pin]
      properties:
        kartyaUid:
          type: string
          description: |
            A leolvasott kartyaazonosito. A szerver ezt NEM tarolja nyersen -
            egy kiszivargott listabol a kartyak celzottan masolhatok lennenek.
          maxLength: 64
        felhasznalo:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        pin:
          type: string
          pattern: '^[0-9]{4,8}$'
          description: |
            Mindket azonositasi modnal KOTELEZO.

            ⚠️ Egy negyjegyu PIN-t a lenyomatolas onmagaban nem vedi meg -
            tizezer lehetoseg van. A vedelem a szerveren tartott kulcs (ami nincs
            az adatbazisban), a novekvo varakozas, es az, hogy a magas kockazatu
            muveletekhez vezetoi jovahagyas is kell.
      description: |
        Vagy a kartyaUid, vagy a felhasznalo szerepel - a PIN mindig.

    BelepesValasz:
      type: object
      required: [felhasznalo, pinCsereKotelezo, jogosultsagok, magasKockazatu]
      properties:
        felhasznalo:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        pinCsereKotelezo:
          type: boolean
          description: |
            Ha igaz, a felulet a PIN cserejeig semmit nem engedhet.

            A felvetelkor adott PIN-t a felvevo ISMERI. Amig nem cserelik, a
            "ki nyomta meg" kerdesre a valasz nem az, akire hivatkoznank.
        jogosultsagok:
          type: array
          items:
            type: string
          description: |
            A felulet ebbol tudja, mit kinaljon fel. A siduri.* kor SOHA nem
            kerul bele: helyben ugysem gyakorolja oket senki, viszont egy
            gyorsitotarazott masolat a kliens lemezen folosleges tamadasi
            felulet.
        magasKockazatu:
          type: array
          items:
            type: string
          description: |
            Ezek a kliensen LEJARNAK, ha regen latta a szervert. A sima eladas
            soha - mert annak az alternativaja az, hogy egy halozati hiba
            megallitja a kereskedest, es az nagyobb kar, mint amit megelozne.

            A lejaratot a kliens MONOTON oran meri: fali oran eleg lenne
            visszaallitani a gep orajat, es a jogok soha nem jarnanak le.


    ErtekesithetoTetel:
      title: Ertekesitheto tetel
      description: |
        Egy ertekesitheto egyseg: a KISZERELES, nem a termek.

        A 0,5 l csapolt sor es a 0,3 l ket kulon ertekesitheto egyseg, sajat
        arral es sajat vonalkoddal - de egyetlen termek gyermekei, tehat a
        nevet, a kategoriat es az afakulcsokat onnan oroklik.

        A RENDSZER NEM SZAMOL ARAT: a 0,3 l nem a 0,5 l aranak arányos resze,
        hanem amennyit az ugyfel mond.
      type: object
      required: [azonosito, megnevezes, bruttoAr, afaHelyben, afaElvitel, mennyisegiEgyseg]
      properties:
        azonosito:
          allOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
          description: A KISZERELES azonositoja. Ez megy a tetelfelvetelkor.
        megnevezes:
          type: string
          description: >
            A termek neve, a kiszereles nevevel kiegeszitve, ha az nem "Alap".
        megnevezesEn:
          type: string
        bruttoAr:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: >
            EGESZ FORINT. Nem kenyelembol: az egesz egysegar mennyiseggel
            pontosan szorzodik, tort egysegarnal harom kulon sor osszege nem
            feltetlenul adna ki a 3x menuart - pont az NTAK kovetelmenyet
            sertenenk meg.
        afaHelyben:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
          description: Helyben fogyasztas eseten ervenyes kulcs.
        afaElvitel:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
          description: |
            Elvitel es kiszallitas eseten ervenyes kulcs.

            MASOLAT, nem hivatkozas. Ha hivatkozas lenne, a helyben fogyasztas
            kulcsanak csokkentese csendben lecsokkentene ezt is - ami komoly
            jogsertes. A ket hibairany nem egyenerteku: a tul magas afa
            penzugyi hatrany, a tul alacsony jogsertes.

            NINCS kulon elviteli BRUTTO ar. Csak a kulcs mas - es ezert a netto
            arbevetel teljesitesi modonkent kulonbozik.
        mennyisegiEgyseg:
          type: string
          examples: ["DARAB", "KILOGRAMM", "LITER"]
        vonalkodok:
          type: array
          description: >
            Valtozat-szinten, tobb is lehet. Nem cikkszam: azert van, hogy a
            pultnal levo olvasoval egy uditot is be lehessen olvasni.
          items:
            type: string
        korhatarosJelzes:
          type: boolean
          description: >
            Piktogram a tetelsoron, SOHA nem felugro ablak (I46). A besorolast
            az ugyfel tartja karban.
      additionalProperties: false

    UjTetel:
      title: Uj tetelsor
      type: object
      required: [azonosito, tetelAzonosito, mennyiseg, eszkozIdo]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        tetelAzonosito:
          allOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
          description: A KISZERELES azonositoja, az ertekesitheto tetel listajabol.
        verzio:
          type: integer
          format: int64
          description: |
            A rendeles verzioja, AHOGY A KLIENS LATTA. Asztalos rendelesnel
            KOTELEZO: ket pincer ugyanahhoz az asztalhoz nyulhat egyszerre, es
            enelkul az egyik irasa CSENDBEN felulirna a masiket.

            Ha a szerveren azota valtozott, a valasz 409 RENDELES_MEGVALTOZOTT
            - a kliensnek frissitenie kell, es meg kell mutatnia, mi kerult ra.

            Gyorseladasnal elhagyhato: ott nincs mit utkoztetni.
        mennyiseg:
          $ref: '../../kozos/penz.yaml#/components/schemas/Mennyiseg'
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false

    Tetelsor:
      title: Tetelsor
      type: object
      required:
        [azonosito, tetelAzonosito, megnevezes, mennyiseg, bruttoEgysegar,
         sorOsszeg, afaKategoria, sorszam]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        tetelAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        megnevezes:
          type: string
        mennyiseg:
          $ref: '../../kozos/penz.yaml#/components/schemas/Mennyiseg'
        bruttoEgysegar:
          $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
        sorOsszeg:
          $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
        afaKategoria:
          $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
        sorszam:
          $ref: '../../kozos/ido.yaml#/components/schemas/Sorszam'
      additionalProperties: false

    BizonylatMod:
      title: A bizonylat utvonala
      description: |
        KOLCSONOSEN KIZARO, es ez nem kenyelmi szabaly.

        Ha a vendeg afas szamlat kap ES a tranzakciot a fiskalis eszkozon is
        lezarjak, ugyanaz az ertekesites KETSZER kerul be a hatosag fele -
        egyszer a penztargep adatszolgaltatasan, egyszer az Online Szamla
        rendszeren. A bevetel felfujva jelenik meg, es az eltérest AZ
        ADOALANYNAK kell magyaraznia.

        ADOUGYI: a kliens az adougyi eszkozre nyomtat.
        SZAMLA:  a fiskalis eszkoz fele NEM megy semmi, es amit papiron kiadunk,
                 azon "NEM ADOUGYI BIZONYLAT" all.

        Utolagos szamlaigenynel - ez a gyakoribb eset, mert a vendeg a nyugta
        lattan keri a szamlat - a NYUGTAT ELOBB SZTORNOZNI KELL.
      type: string
      enum: [ADOUGYI, SZAMLA]
      default: ADOUGYI

    BizonylatTipus:
      title: A bizonylat tipusa
      description: >
        A SZTORNO onallo bizonylat, sajat sorszammal es ellentetes elojelu
        osszegekkel, az eredetire hivatkozva. Az eredetit nem torli es nem
        modositja - csak az allapotat allitja SZTORNOZOTT-ra.
      type: string
      enum: [NORMAL, SZTORNO]
      default: NORMAL

    Kedvezmeny:
      title: Kedvezmeny
      description: |
        A vegosszegi kedvezmeny AFAKULCS-ARANYOSAN oszlik szet a teteleken -
        igy nem keletkezik rossz gyujtore kerulo osszeg.

        A fix osszegu kedvezmenynel a szetosztas MARADEK NELKUL tortenik: a
        reszek osszege pontosan a kedvezmeny. Ha nem igy lenne, a kulonbozet nem
        tunne el, hanem rossz gyujtore kerulne.
      type: object
      required: [tipus, ertek]
      properties:
        tipus:
          type: string
          enum: [SZAZALEKOS, FIX]
        ertek:
          type: string
          description: >
            Szazaleknal a mertek ket tizedessel ("10.00"), fix osszegnel a
            forintertek ("1000"). Mindketto SZOVEG - a szazalek tizedes, es a
            ket eset egy mezoben utazik.
          examples: ["10.00", "1000"]
      additionalProperties: false

    EgyebTetel:
      title: Egyeb tetel a bizonylaton
      description: >
        Kedvezmeny- vagy szervizdijsor, afakulcsonkent. A kliens ezeket KULON
        SORKENT nyomtatja.
      type: object
      required: [fajta, afaKategoria, osszeg]
      properties:
        fajta:
          type: string
          enum: [KEDVEZMENY, SZERVIZDIJ]
        afaKategoria:
          $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
        osszeg:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: >
            A kedvezmeny NEGATIV, a szervizdij POZITIV. Ha ez felcserelodne, a
            vegosszeg jo lenne, a gyujtok viszont nem.
      additionalProperties: false

    TeljesitesMod:
      title: Teljesitesi mod
      description: |
        A KISZALLITAS az ELVITELI afamezot hasznalja.

        Afakulcsot soha nem egetunk a kodba: a termeken levo mezo dont, nem a
        mod neve. Ha az ENUM bovul, a kliens az ismeretlen erteket beolvassa, de
        nem kezeli ugy, mintha ertene.
      type: string
      enum: [HELYBEN, ELVITEL, KISZALLITAS]
      default: HELYBEN

    Asztal:
      title: Asztal
      description: |
        Egy asztal es ami rajta all. A ferohely TAJEKOZTATO, nem korlat: egy
        negyszemelyes asztalhoz otet is leultetnek, es a kassza nem allhat
        ennek utjaba.
      type: object
      required: [azonosito, szam, osszeg]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        szam:
          type: string
          description: >
            A gyorsan beutheto azonosito ("12"). A megnevezes ezt NEM
            helyettesiti: az a nev, amit a pincer mond ("Terasz 3").
        megnevezes:
          type: string
        terulet:
          type: string
        ferohely:
          type: integer
        rendelesAzonosito:
          allOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
          description: NULL, ha az asztal SZABAD. Nem hianyzo adat, hanem allapot.
        vendegszam:
          type: integer
        verzio:
          type: integer
          format: int64
          description: >
            Az optimista zarolas alapja. A kliens ezt kuldi vissza a kovetkezo
            iraskor; a lista is adja, hogy az asztalra koppintva azonnal lehessen
            irni, kulon lekerdezes nelkul.
        felhasznaloAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        felhasznaloNev:
          type: string
          description: AKI MEGNYITOTTA - a rendeles.mas_pincer_asztala jog ehhez merodik.
        nyitasIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
        osszeg:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: A nyitott rendeles osszege; szabad asztalnal nulla.
        figyelmeztetes:
          type: string
          description: >
            A 24 oras korlat (H6.5) kozeledtérol, emberi mondatban. NULL, ha
            nincs mire figyelmeztetni - a zaj elvenne a jelzes erejet.
      additionalProperties: false

    VendegszamKeres:
      title: VendegszamKeres
      type: object
      required: [vendegszam, eszkozIdo]
      properties:
        vendegszam:
          type: integer
          minimum: 1
          description: Legalabb egy. Nulla vendeg nincs.
        verzio:
          type: integer
          format: int64
          description: Asztalos rendelesnel KOTELEZO.
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false

    Rendeles:
      title: Rendeles
      type: object
      required: [azonosito, allapot, tetelek, vegosszeg, sorszam, szerverIdo]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        allapot:
          type: string
          enum: [NYITOTT, LEZART, SZTORNOZOTT]
        teljesitesMod:
          $ref: '#/components/schemas/TeljesitesMod'
        asztalAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        vendegszam:
          type: integer
        verzio:
          type: integer
          format: int64
          description: >
            AZ OPTIMISTA ZAROLAS ALAPJA, es a valasz resze, nem extra. A kliens
            ezt kuldi vissza a kovetkezo iraskor. Gyorseladasnal null.
        tetelek:
          type: array
          items:
            $ref: '#/components/schemas/Tetelsor'
        vegosszeg:
          $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
        sorszam:
          $ref: '../../kozos/ido.yaml#/components/schemas/Sorszam'
        szerverIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false

    MegosztasKeres:
      title: MegosztasKeres
      type: object
      required: [mod, reszekSzama, eszkozIdo]
      properties:
        mod:
          type: string
          enum: [EGYENLO, TETELES]
          description: |
            Csak a SZANDEKOT rogziti - a szamolas mindkettonel ugyanaz. Azert
            taroljuk megis, mert a riportban mas kerdes, hogy "hanyszor
            osztottak egyenloen" es hogy "hanyszor osztottak tetelesen".
        reszekSzama:
          type: integer
          minimum: 2
          description: |
            Legalabb ketto. Egy reszre osztani nem megosztas.
        kiosztasok:
          type: array
          description: |
            TETELES modnal kotelezo, EGYENLO-nel elhagyhato (ott minden tetel
            minden reszre azonos sullyal kerul).

            ⚠️ KIOSZTATLAN TETEL NEM MARADHAT. Ha maradhatna, a reszek osszege
            kevesebb lenne, mint a rendeles, es a kulonbozet csendben eltunne.
          items:
            $ref: '#/components/schemas/Kiosztas'
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false

    Kiosztas:
      title: Kiosztas
      type: object
      required: [sorAzonosito, resz, suly]
      properties:
        sorAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        resz:
          type: integer
          minimum: 1
          description: 1-tol indexelve.
        suly:
          type: integer
          format: int64
          minimum: 0
          description: |
            ⚠️ A KIOSZTASOK SORRENDJE SZAMIT. A maradek forint a legnagyobb
            sulyu reszre kerul, holtversenynel a listaban KORABBIRA - tehat
            ugyanaz a terv mas sorrendben mas osszeget ad. A kliensnek
            SORONKENT, RESZ SZERINT NOVEKVOEN kell kuldenie, kulonben a
            kezelo koppintasi sorrendje befolyasolja, ki kapja a plusz
            forintot.

            NEM OSSZEG, HANEM ARANY. Egy harom adagos sorbol ket adag az egyik
            vendegnek: suly = 2 es suly = 1. A forintra valtas a szerver dolga,
            es MARADEK NELKUL tortenik.
      additionalProperties: false

    MegosztasValasz:
      title: MegosztasValasz
      type: object
      required: [reszekSzama, reszek]
      properties:
        reszekSzama:
          type: integer
        reszek:
          type: array
          items:
            $ref: '#/components/schemas/MegosztottResz'

    MegosztottResz:
      title: MegosztottResz
      type: object
      required: [sorszam, sorok, osszeg]
      properties:
        sorszam:
          type: integer
          minimum: 1
        sorok:
          type: array
          items:
            $ref: '#/components/schemas/Reszsor'
        osszeg:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: |
            A resz vegosszege. ⚠️ A reszek AFAJANAK osszege nem feltetlenul
            egyezik az osztatlan bizonylateval: a visszaszamolas
            bizonylatonkent kerekit, es harom bizonylat haromszor kerekit.

    Reszsor:
      title: Reszsor
      type: object
      required: [sorAzonosito, afaKategoria, osszeg]
      properties:
        sorAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        afaKategoria:
          type: string
        osszeg:
          $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'

    MegosztasAllapot:
      title: MegosztasAllapot
      type: object
      required: [mod, reszekSzama, reszek]
      properties:
        mod:
          type: string
          enum: [EGYENLO, TETELES]
        reszekSzama:
          type: integer
        reszek:
          type: array
          description: 1-tol sorrendben.
          items:
            $ref: '#/components/schemas/MegosztasAllapotResz'

    MegosztasAllapotResz:
      title: MegosztasAllapotResz
      type: object
      required: [sorszam, osszeg, fizetett]
      properties:
        sorszam:
          type: integer
          minimum: 1
        osszeg:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: |
            ⚠️ ENELKUL A MEGOSZTAS NEM FOLYTATHATO egy ujrainditas utan: a
            kliens tudna, hany resz van es melyik fizetett - azt nem, hogy
            mennyit kell kerni. Marpedig PONT EZ A MEGOSZTAS ERTELME: a
            vendegek nem egyszerre fizetnek.

            A rész SAJAT SORAIBOL adodik, nem tarolt vegosszegbol - igy nem tud
            elcsuszni attol, amibol a bizonylat keszul.
        fizetett:
          type: boolean

    Beallitasok:
      title: Beallitasok
      description: |
        A telephely kuszobei. SZOVEGKENT, mert tizedesek - ugyanaz a szabaly,
        mint mindenhol, ahol tort ertek utazik a protokollon.
      type: object
      required:
        [kedvezmenyIndokSzazalek, szervizdijMegerositesSzazalek, automatikusNapzaras]
      properties:
        kedvezmenyIndokSzazalek:
          type: string
          pattern: '^[0-9]{1,3}\.[0-9]{2}$'
          description: |
            E FOLOTT a kedvezmeny INDOKOT es kulon jogosultsagot
            (kedvezmeny.kuszob_felett) igenyel.

            ⚠️ A KUSZOB A FIX OSSZEGU KEDVEZMENYRE IS VONATKOZIK: a fix osszeget
            a kedvezmeny elotti alaphoz aranyitjuk. Enelkul egyetlen
            legordulo-valasztassal megkerulheto lenne.
          examples: ["10.00"]
        szervizdijMegerositesSzazalek:
          type: string
          pattern: '^[0-9]{1,3}\.[0-9]{2}$'
          description: >
            E FOLOTT a "megerositve" jelzo kell a lezarason. Nem az osszeget
            erositi meg, hanem a SZANDEKOT.
          examples: ["15.00"]
        automatikusNapzaras:
          type: boolean
          description: |
            Van-e a telephelyen TERVEZETT (automatikus) napzaras.

            ⚠️ EBBOL DOL EL, HOGY A KEZI ZARAS KULON JOGOT IGENYEL-E. A
            nap.kezi_zaras FELTETELES jog: csak ott kell, ahol automatikus
            zaras is be van allitva - ott a nap vege nem a kezelo dontese, mert
            aki korabban zar, a kovetkezo muszak beveteleet tolja at a masnapra.
            Ahol NINCS tervezett zaras, ott a kezi zaras a rendes uzemmod, es a
            muszakfelelosnek is mennie kell.

            A felulet enelkul nem tudna eldonteni, felkinalja-e a gombot.
      additionalProperties: false

    LezarasKeres:
      title: LezarasKeres
      description: |
        A rendeles (vagy egy MEGOSZTOTT RESZ) lezarasanak kerese.

        ⚠️ UGYANAZ AZ ALAK MINDKET UTON. A resz a sajat soraibol
        szamolja az afajat, ugyanazzal a szaballyal, mint egy osztatlan
        bizonylat - tehat a kedvezmeny, a szervizdij es a borravalo is
        ugyanugy ertelmezett. Ket kulon alak ket helyen romlana el.
      required: [eszkozIdo, fizetesek]
      properties:
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
        fizetesek:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Fizetes'
        kedvezmeny:
          $ref: '#/components/schemas/Kedvezmeny'
        szervizdijSzazalek:
          type: string
          pattern: '^[0-9]{1,3}\.[0-9]{2}$'
          description: |
            SZOVEG, mert tizedes. A szervizdij ONALLO SOR, afakulcsonkent
            bontva - soha nem a termek teteleben, mert az adougyi
            gyujtokiosztasban sajat, afakulcsonkenti rekeszei vannak.

            Kemeny korlat: 100%. E felett bizonyosan mellenyulás.
            Puha megerosites: telephelyenkent allithato kuszob (alapbol
            15%) felett a "megerositve" jelzo kell. Kemeny 15%-os
            plafont SZANDEKOSAN nem teszunk: nincs jogszabalyi felso
            hatar, es egy rendezvenyhelyszin szerzodeses szervizdija
            lehet magasabb.
          examples: ["10.00"]
        borravalo:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: |
            NINCS az afacsoportokban: a gyujtokiosztasban nincs
            borravalo-rekesz, mert a borravalo nem ellenertek egy
            szolgaltatasert. A vegosszeg viszont tartalmazza.

            A keszpenzes borravalo a fiokban marad, es a muszak vegen
            ONALLO, BIZONYLATOLT keszpenzmozgaskent kerul ki -
            soha nem nema fiokcsokkentessel.
        kedvezmenyIndokKod:
          type: string
        kedvezmenyIndokSzoveg:
          type: string
        mod:
          allOf:
            - $ref: '#/components/schemas/BizonylatMod'
          description: >
            Elhagyhato; alapertelmezes ADOUGYI. SZAMLA modban a kliens
            SOHA nem hivja az adougyi eszkozt.
        megerositve:
          type: boolean
          description: >
            A kezelo megerositette a szokatlanul magas szervizdijat. NEM
            az osszeget erositi meg, hanem a SZANDEKOT - ezert kulon
            mezo, es nem az ertek megismetlese.
        felhatalmazas:
          allOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
          description: |
            A HELYSZINEN JOVAHAGYO vezeto felhatalmazasanak azonositoja, ha a
            kezdemenyezonek hianyzik a lezarashoz kello jog.

            A pincer az asztalnal all. Nem az a megoldas, hogy kilep es az
            uzletvezeto bejelentkezik - az lassu, es a muszak is
            osszekeveredne. Az uzletvezeto a helyszinen jovahagyja az EGY
            muveletet, es az auditba MINDKET szemely bekerul.

            ⚠️ A JOVAHAGYAS EGY JOGOT POTOL, NEM KETTOT. Egyetlen kodra szol
            es egyszer hasznalhato fel. Ha a lezarashoz ket jog is hianyzik
            (peldaul kuszob feletti kedvezmenynel a kedvezmeny.vegosszeg ES a
            kedvezmeny.kuszob_felett), a szerver TOBB_JOGOSULTSAG_HIANYZIK
            kodu 403-at ad, es a kliensnek NEM szabad jovahagyast kernie: a
            vezeto odaallna, jovahagyna, es a muvelet a masodik kapun megis
            elhasalna - mar elhasznalt jovahagyassal.
      additionalProperties: false
    Fizetes:
      title: Fizetes
      description: |
        Egy fizetesi sor a bizonylaton.

        ⚠️ A VALUTAS SORON AZ ARFOLYAM KOTELEZO, es a szerver OSSZEVETI a
        telephelyen ervenyessel. Nem azert kerjuk el, hogy elhiggyuk: azert,
        hogy ki lehessen deriteni, ha a kassza mast szamolt, mint a szerver.
        Elteres eseten a lezaras 409-cel elbukik (ARFOLYAM_ELTER) - CSENDBEN
        NEM cserelunk arfolyamot, mert a vendegnek mar mondtak egy osszeget.

        ⚠️ A VALUTAS SOR OSSZEGE A VALUTAOSSZEG ATVALTASA, kereskedoi
        kerekitessel, egesz forintra. A szerver ezt is ellenorzi
        (VALUTA_ATVALTAS_ELTER): enelkul a penztaros elvehetne a husz eurot, a
        bizonylatra pedig barmilyen osszeg kerulhetne.

        ⚠️ A VISSZAJARO NEM KULON FOGALOM: forintban megy vissza (G5.6), tehat
        NEGATIV KESZPENZSORKENT all a bizonylaton - ott megy ki a penz a
        fiokbol. Egy 7940 Ft-os szamlara adott 25 EUR 395,50-es arfolyamon
        9888 Ft; a visszajaro 1948, ot forintra kerekitve 1950, tehat a
        keszpenzsor -1950, a kerekitesi kulonbozete -2. Az osszeg igy is
        stimmel: 9888 + (-1950) = 7938 = 7940 + (-2).

        Ebbol kovetkezik, hogy EGY VALUTAS FIZETES KET SORT AD, de nem lesz
        vegyes fizetes: a vegyesseg csak a POZITIV sorokbol szamolodik.
      type: object
      required: [mod, osszeg]
      properties:
        mod:
          type: string
          enum: [KESZPENZ, BANKKARTYA, UTALVANY, VALUTA]
        osszeg:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: >
            A forintban konyvelt osszeg. Keszpenzsoron NEGATIV is lehet: az a
            valutabol adott visszajaro.
        kerekitesiKulonbozet:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: >
            Csak keszpenznel. Onallo, konyvelheto tetel - ezert kulon mezo, es
            nem nyelodik el az osszegben.
        valutaOsszeg:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/ValutaOsszeg'
          description: >
            CSAK VALUTAS soron, es ott kotelezo. Mas modon kuldve a lezaras
            422-vel elbukik (VALUTA_ADAT_NEM_VALUTAS_SORON).
        arfolyam:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Arfolyam'
          description: >
            CSAK VALUTAS soron, es ott kotelezo. A telephelyen ervenyes
            arfolyamnak kell lennie - a /arfolyamok vegpont adja meg.
      additionalProperties: false

    ArfolyamAllapot:
      title: ArfolyamAllapot
      description: |
        Egy ervenyes arfolyam es amit a feluletnek tudnia kell rola.

        A "friss" jelzo nem naptari napot nez: a vendeglatohely uzleti napja
        hajnali negykor is tarthat meg, es ott a tegnap delelott megadott
        arfolyam NEM elavult. A merce a NYITOTT UZLETI NAP megnyitasa.
      type: object
      required: [arfolyam, ervenyesTol, friss]
      properties:
        arfolyam:
          $ref: '../../kozos/penz.yaml#/components/schemas/Arfolyam'
        ervenyesTol:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
        friss:
          type: boolean
          description: >
            A nyitott uzleti nap megnyitasa ota allitottak-e be. Ha nincs
            nyitott nap, igaz.
        beallitotta:
          # ⚠️ NEM `nullable: true`. Az az OpenAPI 3.0 alakja, es a 3.1-ben NEM
          # LETEZIK: az ellenorzok es a generatorok CSENDBEN ELDOBJAK. A generalt
          # kliens igy nem nullazhatonak hinne a mezot, mikozben a szerver
          # null-t kuld - a hiba a kliensnel, futasidoben jonne elo.
          type: [string, "null"]
          description: >
            Aki rogzitette. A visszaeles utolagos felderitesenek egyetlen
            fogodzoja. NULL, ha nem emberi beallitasbol szarmazik.
        figyelmeztetes:
          type: [string, "null"]
          description: >
            Emberi mondat, ha nem friss. A feluletnek FELTUNOEN ki kell irnia -
            de nem tilthatja meg a fizetest (G5.6). NULL, ha nincs mit jelezni.
      additionalProperties: false

    ArfolyamKeres:
      title: ArfolyamKeres
      type: object
      required: [penznem, forintPerEgyseg, eszkozIdo]
      properties:
        penznem:
          $ref: '../../kozos/penz.yaml#/components/schemas/Penznem'
        forintPerEgyseg:
          type: string
          pattern: '^[0-9]{1,6}\.[0-9]{6}$'
          description: >
            Egy egyseg valuta forintban. SZOVEG, mert tizedes - ugyanaz a
            szabaly, mint mindenhol, ahol tort ertek utazik a protokollon.
          examples: ["395.500000"]
        eszkozIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false

    BizonylatFejlec:
      title: BizonylatFejlec
      description: |
        Egy bizonylat annyi mezovel, amennyi a MEGTALALASAHOZ kell.

        SZANDEKOSAN KEVESEBB, MINT A Bizonylat: nincs benne tetelsor,
        afabontas, fizetes. A kereses celja az, hogy a kezelo kivalassza a
        helyes nyugtat - ehhez a szam, az ido es a vegosszeg eleg. Amit nem
        kuldunk el, azt nem is kell vedeni.

        Az allapotbol latszik, hogy a bizonylatot MAR SZTORNOZTAK-e: a
        SZTORNOZOTT alkalmatlan ujabb sztornora.
      type: object
      required:
        [azonosito, siduriBizonylatszam, adougyiBizonylatszam, allapot, tipus,
         mod, vegosszeg, szerverIdo]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        siduriBizonylatszam:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/SiduriBizonylatszam'
        adougyiBizonylatszam:
          allOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/AdougyiBizonylatszam'
          description: Nyomtatas elott, es adougyi nyomtatas nelkuli uton null.
        allapot:
          type: string
          enum: [NYOMTATASRA_VAR, KINYOMTATVA, NYOMTATASI_HIBA, SZTORNOZOTT]
        tipus:
          $ref: '#/components/schemas/BizonylatTipus'
        mod:
          $ref: '#/components/schemas/BizonylatMod'
        vegosszeg:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: Sztorno bizonylatnal NEGATIV.
        szerverIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false

    Bizonylat:
      title: Bizonylat
      type: object
      required:
        [azonosito, siduriBizonylatszam, adougyiBizonylatszam, allapot,
         mod, tipus, uzletiNap, vegosszeg, borravalo, afaCsoportok, egyebTetelek,
         fizetesek, sorszam, szerverIdo]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        siduriBizonylatszam:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/SiduriBizonylatszam'
        adougyiBizonylatszam:
          allOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/AdougyiBizonylatszam'
          description: >
            KULON, NULLAZHATO mezo (I14). Nyomtatas elott null; az adougyi
            eredmeny jelentese utan kap erteket - vagy vegleg null marad, ha az
            adott bizonylathoz nem tartozik adougyi nyomtatas.
        allapot:
          type: string
          enum: [NYOMTATASRA_VAR, KINYOMTATVA, NYOMTATASI_HIBA, SZTORNOZOTT]
        mod:
          $ref: '#/components/schemas/BizonylatMod'
        tipus:
          $ref: '#/components/schemas/BizonylatTipus'
        uzletiNap:
          $ref: '../../kozos/ido.yaml#/components/schemas/UzletiNap'
        vegosszeg:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: Az afakoteles resz ES a borravalo egyutt - ennyit fizet a vendeg.
        borravalo:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: Kulon, mert NINCS az afacsoportokban.
        afaCsoportok:
          type: array
          description: >
            Afakulcs-csoportonkent, bizonylatszinten visszaszamolva (I3). A
            kedvezmenyt es a szervizdijat MAR TARTALMAZZA; a borravalot nem.
          items:
            $ref: '../../kozos/penz.yaml#/components/schemas/AfaCsoportOsszesito'
        egyebTetelek:
          type: array
          items:
            $ref: '#/components/schemas/EgyebTetel'
        fizetesek:
          type: array
          items:
            $ref: '#/components/schemas/Fizetes'
        nyomtatoEszkozAzonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        sorszam:
          $ref: '../../kozos/ido.yaml#/components/schemas/Sorszam'
        szerverIdo:
          $ref: '../../kozos/ido.yaml#/components/schemas/Idobelyeg'
      additionalProperties: false
