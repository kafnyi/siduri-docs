# Siduri - kozos penzugyi tipusok
#
# Ez a fajl az I1 invarianst kenyszeriti ki a protokoll hataran:
# lebegopontos szam a penz kozeleben sehol - sem kodban, sem a droton.
$id: https://szerzodes.siduri.mythsystem.hu/kozos/penz.yaml

components:
  schemas:

    Osszeg:
      title: Osszeg (egesz forint)
      description: >
        Eladasi ar, sorosszeg, vegosszeg, fizetes, kedvezmeny.
        EGESZ FORINT, tizedes nelkul. JSON-szamkent biztonsagos, mert a
        forintosszegek nagysagrendekkel a 2^53 hatar alatt vannak.
        Negativ ertek ervenyes: a sztorno es a visszaterites negativ.
      type: integer
      format: int64
      examples: [1500, -1500, 0]

    Egysegkoltseg:
      title: Egysegkoltseg (Ft/mertekegyseg)
      description: >
        Beszerzesi egysegar, mozgoatlagar, receptosszetevo fajlagos ara.
        SZOVEGKENT megy at, nem szamkent - a JSON-szam a legtobb elemzoben
        lebegopontoskent olvasodna be, es egy gramm liszt ara valoban tort
        forint. Pontosan hat tizedesjegy, tizedespont, ezres elvalaszto nelkul.
      type: string
      pattern: '^-?[0-9]{1,12}\.[0-9]{6}$'
      examples: ["0.284000", "3333.333333", "-0.500000"]

    Koltseg:
      title: Koltseg (forintosszeg hat tizedesjeggyel)
      description: >
        Amibe nekunk kerul, nem amit a vendeg fizet. Ugyanaz az abrazolas, mint
        az egysegkoltsege, de mas mennyiseg: Ft, nem Ft/egyseg.
      type: string
      pattern: '^-?[0-9]{1,12}\.[0-9]{6}$'
      examples: ["6816.000000"]

    Mennyiseg:
      title: Mennyiseg
      description: >
        Hat tizedesjegy. Szovegkent, ugyanabbol az okbol, mint az
        egysegkoltseg. A "3 db" es a "0,35 kg" ugyanezen a tipuson megy at.
      type: string
      pattern: '^-?[0-9]{1,12}\.[0-9]{6}$'
      examples: ["3.000000", "0.350000"]

    Penznem:
      title: Penznem
      description: >
        Kizarolag a fizetesnel jelenik meg. Nincs tobbvaluta arlista: az arak
        mindig forintban vannak.
      type: string
      enum: [HUF, EUR]

    ValutaOsszeg:
      title: Valutaosszeg
      description: Amit a vendeg tenylegesen adott, ha nem forintban fizetett.
      type: object
      required: [penznem, osszeg]
      properties:
        penznem:
          $ref: '#/components/schemas/Penznem'
        osszeg:
          type: string
          pattern: '^-?[0-9]{1,12}\.[0-9]{2}$'
          examples: ["20.00"]
      additionalProperties: false

    Arfolyam:
      title: Arfolyam
      description: >
        Egy egyseg valuta forintban. A FELHASZNALT arfolyam a bizonylat melle
        kerul, nem csak a napi beallitasba - utolag kell tudni megmondani,
        milyen arfolyammal ment ki egy adott nyugta.
      type: object
      required: [penznem, forintPerEgyseg]
      properties:
        penznem:
          $ref: '#/components/schemas/Penznem'
        forintPerEgyseg:
          type: string
          pattern: '^[0-9]{1,6}\.[0-9]{6}$'
          examples: ["395.500000"]
      additionalProperties: false

    AfaKategoria:
      title: AFA-kategoria
      description: >
        Az NTAK afaKategoria ertekkeszlete. A kliens az ismeretlen erteket
        beolvassa, de nem kezeli ugy, mintha ertene (SZERZODES 4.2).
      type: string
      enum: [A_5, B_18, C_27, D_AJT, E_0]

    AfaCsoportOsszesito:
      title: AFA-csoport osszesito
      description: >
        Az afa visszaszamolasa AFAKULCS-CSOPORTONKENT, BIZONYLATSZINTEN
        tortenik, soha nem soronkent - mert a penztargep is igy szamol, es a
        soronkenti kerekites garantaltan elterest szul a gep nyugtajahoz kepest.
      type: object
      required: [afaKategoria, brutto, netto, afa]
      properties:
        afaKategoria:
          $ref: '#/components/schemas/AfaKategoria'
        brutto:
          $ref: '#/components/schemas/Osszeg'
        netto:
          $ref: '#/components/schemas/Osszeg'
        afa:
          $ref: '#/components/schemas/Osszeg'
      additionalProperties: false
