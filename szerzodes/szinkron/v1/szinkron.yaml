openapi: 3.1.0

info:
  title: Siduri szinkronprotokoll (K3)
  version: 1.16.0
  summary: A telephelyi szerver es a felho kozotti szinkron
  license:
    name: Zart - Myth System tulajdona
    identifier: LicenseRef-MythSystem-Zart
  description: |
    A K3 szerzodes: a telephelyi szerver es a felho kozott. Gep-gep, emberi
    felulet nelkul.

    ⚠️ EZ A LEGSZIGORUBB KOMPATIBILITASI KENYSZERU SZERZODES, mert A FELHO ES A
    TELEPHELY SOHA NEM FRISSUL EGYSZERRE. Legalabb KET kiadasi ciklusnyi
    visszafele kompatibilitas kell. Ebbol harom kotelezo szabaly kovetkezik:

      1. ISMERETLEN MEZOT FIGYELMEN KIVUL KELL HAGYNI, nem hibanak tekinteni.
      2. ISMERETLEN VALTOZAS-TIPUST A TELEPHELY NEM ALKALMAZ, hanem
         ELUTASITVA nyugtat (ISMERETLEN_TIPUS kodzal). Nem all le, es nem is
         ugorja at csendben: a felho igy megtudja, hogy a telephely regebbi.
      3. A SORSZAM MONOTON es telephelyenkenti. Egy mar alkalmazott sorszam
         ujbóli megerkezese NEM alkalmazodik ujra (idempotencia).

    AZ IRANY ES AZ UTEM (2026-09-21 dontes): A TELEPHELY HUZ, IDOZITVE,
    ALKALMAZKODO UTEMMEL.

      - A telephelynek nem kell bejovo portot nyitnia - egy vendeglatohely
        halozatan ez donto.
      - Az ures lekerdezes NEM pazarlas: ez egyben a SZIVVERES (licenc-eletjel,
        eszkoz-lathatosag), es ez hozza a telephely oraallasat is.
      - A valasz megmondja, MIKOR jojjon vissza (kovetkezoLekerdezesMp). Amig van
        tobb valtozas, ez nulla - igy egy tiz arat erinto szerkesztes
        masodpercek alatt leer, nyitva tartott kapcsolat nelkul.

    A LEFELE MENO IRANY PARANCS, NEM KERES: a telephely emberi jovahagyas nelkul
    alkalmazza. Ezert:

      - a csatorna KOLCSONOS TLS-sel vedett;
      - minden valtozas hordozhat ALAIRAST (alairas mezo). A telephely ma meg
        nem koveteli meg - a mezo azert van itt MOST, mert kesobb bekapcsolni
        toro valtozas lenne, es EBBEN a szerzodesben az a legdragabb;
      - ⚠️ A TELEPHELY VALIDAL, NEM VAKON ALKALMAZ (B16.8/3). Egy olyan
        afakulcs, ami a datumozott adokulcs-tablaban nem szerepel, ELUTASITANDO.
        A bizalom nem mentesit az ellenorzes alol.

    A FELFELE MENO TORZSADAT KERES, NEM PARANCS (1.4.0). A telephelyen tett
    torzsadat-iras a lekerdezes kereseben megy fel (felkuldes), es a felho
    UGYANAZZAL a szaballyal dont rola, mint a telephely a lefele erkezo
    ertekrol: a kesobbi iras nyer, a zarolt ertek mindig nyer. A teljes
    dontes: siduri-docs/TORZSADAT_FELKULDES.md.

      - A KEZDETI FELTOLTES UGYANEZ AZ UT (mint lefele az S3): a telephely
        minden rekordjat elkuldi, lapozva. Nincs masodik formatum.
      - ⚠️ NINCS VISSZHANG: egy elfogadott telephelyi irasbol a felho NEM
        keszit lefele meno valtozast ugyanannak a telephelynek. Ha keszitene,
        az azonos idobelyeg miatt a telephely a sajat erteket vesztesnek
        latna - egy nem letezo utkozes.
      - ⚠️ A felho ellenorzi, hogy az IRONAK AZ IRAS IDEJEN volt-e joga (mint
        a hozzaferes-valtoztatasoknal). Ha nem, vagy ha a mezo kozben zarolt
        lett, a felho a SAJAT erteket kuldi le, friss idobelyeggel - a
        telephelyen igy visszaall. A kozben tortent eladasok a regi szabaly
        szerint rendben vannak: a bizonylat nem modosul.

    AMI EBBEN A SZELETBEN NINCS BENNE, kimondva:

      - AZ ELADASI ADATOK FELKULDESE (archivum, 8 ev) - kesobbi szelet.
      - A MENNYISEGI, FUTO ALLAPOT (keszlet, forgalom, kassza) kizarolag
        telephely-autoritativ, es csak FELFELE aramlik (B16.4). A felho
        kuldhet "vegyel fel 20 darabot"-ot, de soha nem "a keszlet mostantol
        40"-et - ez a kesobbi keszlet-szelet dolga.

servers:
  - url: https://{felho}/szinkron/v1
    description: A felho. A telephely MINDIG a felhot hivja.
    variables:
      felho:
        default: szinkron.sidurisystems.hu

security:
  - TelephelyTanusitvany: []

tags:
  - name: szinkron
    description: Valtozasok lekerese es nyugtazasa

paths:

  /lekerdezes:
    post:
      tags: [szinkron]
      operationId: valtozasokatLekerdez
      summary: A telephely lekeri a ra varo valtozasokat - es jelenti az allapotat
      description: |
        EZ EGYSZERRE HAROM DOLOG, es ezert nincs belole harom vegpont:

          1. a ra varo valtozasok lekerese,
          2. a SZIVVERES (a felho ebbol tudja, el-e a telephely),
          3. az ORAALLAS jelentese.

        ⚠️ AZ ORAALLAS NEM KENYELMI ADAT. A torzsadat-utkozest mezonkenti
        idobelyeg oldja fel (O3), es a sorrendet ket gep FALI ORAJA donti el. Ha
        a telephely oraja siet, egy korabbi helyi iras legyozhet egy kesobbi
        felhoset. A felho ezert osszeveti a jelentett orat a sajatjaval, es a
        kuszob folotti eltérést JELZI (oraElteresMp).

        A TOMEGES ATVITEL UGYANEZ A VEGPONT (S3 dontes): az elso feltoltes vagy
        egy teljes ujraszinkron annyit jelent, hogy a telephely kurzor nelkul
        (vagy nulla kurzorral) kerdez. NINCS masodik, kulon formatum - egy ritkan
        futo masodik kodut evekig eszrevetlenul romolhatna el.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LekerdezesKeres'
      responses:
        '200':
          description: A varakozo valtozasok (lehet ures)
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LekerdezesValasz'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '409':
          description: |
            A KURZOR MAR NEM ERVENYES - a felho tulsagosan regi allapotot kerne
            ujra. Ilyenkor a telephely kurzor nelkul kerdez ujra: teljes
            ujraszinkron indul, ugyanezen a vegponton.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

  /nyugta:
    post:
      tags: [szinkron]
      operationId: valtozasokatNyugtaz
      summary: A telephely visszaigazolja, mit alkalmazott es mit utasitott el
      description: |
        ⚠️ ENELKUL A FELHO ELVEGZETTNEK MUTATNA AZT, AMI NEM TORTENT MEG (B16.5).
        Offline telephelynel ez a legkonnyebb csendes hazugsag: a felhasznalo
        beirta az arat, a felhoben "kesz", a telephelyen semmi.

        HAROM ALLAPOT VAN, NEM KETTO:
          - ATVETTE: a telephelyi szerver megkapta;
          - ALKALMAZTA: ervenyre is jutott a telephelyi adatokban;
          - ⚠️ az "OSSZES ERINTETT ESZKOZ ALKALMAZTA" harmadik allapot a K1
            oldalan dol el (egy penztargep lehet offline, es meg a regi arral
            dolgozik) - ez KESOBBI SZELET, de a fogalmat itt rogzitjuk, hogy a
            felulet ne kettot mutasson harom helyett.

        AZ ELUTASITAS NEM HIBA, HANEM VALASZ. A telephely validal (B16.8/3), es
        ha egy ertek nala ervenytelen, azt megmondja - nem alkalmazza, es nem is
        hallgat rola.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NyugtaKeres'
      responses:
        '204':
          description: A nyugta rogzitve
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

  /eladasok:
    post:
      tags: [szinkron]
      operationId: eladasokatFelkuld
      summary: A lezart bizonylatok felkuldese (1.10.0) - ELADAS_FELKULDES.md
      description: |
        A felho a JOGI ARCHIVUM (A3). A telephely a lezaraskor sorba teszi a
        bizonylatot, es kotegben kuldi, onmagaban ertelmezhetoen: az eladaskori
        nev, ar, afa benne van.

        * **Idempotens** a kimeno tetel es a bizonylat azonositoja szerint:
          ugyanaz a bizonylat ujrakuldve csak az ALLAPOTAT frissiti (nyomtatas,
          sztorno) - a tartalma nem valtozhat.
        * A felho **ujraszamolja a lenyomatot** a tartalombol; ha nem egyezik
          a kuldottel: `HIBAS_LENYOMAT`. Ha a mar tarolt bizonylat tartalma
          mas: `ELTERO_TARTALOM` - es ez eltereskent rogzul.
        * A felhoben a tarolt bizonylat **csak beszurhato**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EladasKeres'
      responses:
        '200':
          description: Bizonylatonkenti kimenet
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EladasValasz'
        '403':
          $ref: '#/components/responses/Hiba403'
        '422':
          $ref: '#/components/responses/Hiba422'

  /keszlet:
    post:
      tags: [szinkron]
      operationId: keszletetFelkuld
      summary: A keszlet tukre (1.14.0) - KESZLET.md S3
      description: |
        ⚠️ TUKOR, NEM ELBIRALANDO IRAS: a keszlet egyenlege a telephelye (B16.4).
        A telephely a konyvelt mozgasokat (a trigger teszi a kimeno sorba) es az
        erintett egyenlegek pillanatkepet kuldi. A felho idempotens a mozgas
        azonositoja szerint; az egyenleg a legutobbi allapot. A felhobol inditott
        muvelet NEM itt jon, hanem lefele, KESZLET_PARANCS valtozaskent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeszletKeres'
      responses:
        '200':
          description: Atvette
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeszletValasz'
        '403':
          $ref: '#/components/responses/Hiba403'
        '422':
          $ref: '#/components/responses/Hiba422'

  /napi-egyeztetes:
    post:
      tags: [szinkron]
      operationId: napotEgyeztet
      summary: A napi egyeztetes - a pozitiv bizonyitek (1.10.0)
      description: |
        A lezart nap osszesitoje: darab, vegosszeg, afa- es fizetesimod-bontas,
        a bizonylat-lenyomatok rendezett lenyomata. A felho a SAJAT, beerkezett
        bizonylataibol ugyanezt szamolja (ugyanazzal a kozos koddal). Ha
        egyezik: `IGAZOLT`, kulonben `ELTERES`, a felho szamaival.

        ⚠️ **A telephelyen CSAK IGAZOLT nap bizonylata torolheto** (A3, D4).

        Ugyanitt megy fel a biztonsagi audit-lanc feje (horgony): egy
        visszamenoleges atiras a telephelyen igy kiderul.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EgyeztetesKeres'
      responses:
        '200':
          description: Naponkenti kimenet
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EgyeztetesValasz'
        '403':
          $ref: '#/components/responses/Hiba403'
        '422':
          $ref: '#/components/responses/Hiba422'

  /hozzaferes:
    post:
      tags: [szinkron]
      operationId: hozzaferestLekerdez
      summary: A telephely pultos felhasznaloi es jogaik - PILLANATKEPKENT
      description: |
        ⚠️ **PILLANATKEP, NEM VALTOZASFOLYAM.** A tobbi szinkron novekmenyes; ez
        SZANDEKOSAN nem az. Harom okbol:

          1. **Nincs osszefesules, tehat nincs mit elrontani.** A jogosultsagnal
             egy elmaradt vagy rosszul sorrendezett novekmeny azt jelentene, hogy
             egy VISSZAVONT jog megmarad. A torzsadatnal ez ar-hiba; itt
             biztonsagi hiba.
          2. **A MEGVONAS MINDIG NYER** - ez a pillanatkepbol ingyen jon. A
             mezonkenti idobelyeg (O3) itt NEM ervenyes: ket gep falioraja
             donthet arrol, melyik ar nyer, de arrol nem, hogy ki mit lathat.
          3. **Kicsi.** Egy telephely nehany tucat felhasznaloja es szerepe; a
             teljes halmaz atvitele olcsobb, mint a novekmenyes gepezet.

        A telephely elkuldi, milyen verziot ismer; ha az egyezik, a valasz
        `valtozott: false`, es nem kuldunk adatot.

        ⚠️ **A PIN SOHA NEM SZEREPEL ITT.** A hitelesites helyi marad: a felho a
        SZEMELYT es a JOGAIT tartja nyilvan, a PIN-t a telephelyi szerver. Egy
        interneten athalado PIN-nek nem lenne mit keresnie ebben a rendszerben.

        ⚠️ **A SZEREPEK JOGAI MAR KIBONTVA ERKEZNEK** (a szint szerinti oroklessel
        egyutt). A kibontast a FELHO vegzi, EGY helyen - kulonben a ket oldal
        kulon szamolna ugyanazt a szabalyt, es elobb-utobb maskepp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HozzaferesKeres'
      responses:
        '200':
          description: A hozzaferes pillanatkepe - vagy a jelzes, hogy nem valtozott
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HozzaferesValasz'
        '401':
          $ref: '#/components/responses/Hiba401'
        '403':
          $ref: '#/components/responses/Hiba403'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

  /regisztracio:
    post:
      tags: [szinkron]
      operationId: telephelyetRegisztral
      summary: Egy uj telephely tanusitvanyt ker, egyszer hasznalhato jeggyel
      # ⚠️ EZ AZ EGYETLEN VEGPONT KOLCSONOS TLS NELKUL - es ez nem kivetel a
      # szabaly alol, hanem a tyuk-tojas feloldasa: a telephelynek MEG NINCS
      # tanusitvanya, eppen itt kapja meg.
      security: []
      description: |
        A telephely a SAJAT GEPEN general kulcsparat, es csak a NYILVANOS reszt
        kuldi fel, PKCS#10 tanusitvanykeres (CSR) formajaban. A MAGANKULCS SOHA
        NEM HAGYJA EL A TELEPHELYET - meg a telepito sem latja.

        A JEGY EGYSZER HASZNALHATO, es lejar. Ha ugyanazzal a jeggyel masodszor
        probalkoznak, a valasz 403: egy kiszivargott jegybol igy legfeljebb EGY
        tanusitvany szuletik, es az elso hasznalat lathato.

        ⚠️ A JEGY ES A CSR EGYUTT SEM BIZONYITJA, hogy a jogos telepito all a
        vonal masik vegen - csak azt, hogy a jegy nala van. A jegy atadasa ezert
        a telepitesi eljaras resze (kulon csatornan, rovid lejarattal). ARA: ez
        emberi fegyelem, nem gepi kenyszer; a kockazatot a rovid lejarat es az
        egyszeri felhasznalas korlatozza, nem szunteti meg.

        UJRAKIADAS ugyanezen a vegponton tortenik, uj jeggyel. A regi
        tanusitvanyt a felho NEM vonja vissza automatikusan: egy elvesztett gep
        es egy ujratelepitett gep kivulrol egyforma, es a csendes visszavonas
        eppen a mukodo telephelyet vagna el. A visszavonas kulon, tudatos lepes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisztracioKeres'
      responses:
        '200':
          description: A kiallitott tanusitvany
          headers:
            Siduri-Szerzodes:
              $ref: '#/components/headers/SiduriSzerzodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisztracioValasz'
        '403':
          description: |
            A jegy ismeretlen, lejart, vagy MAR HASZNALTAK. A harom eset
            szandekosan EGY valaszt ad kifele: kulonben a vegpont megmondana,
            melyik jegy letezik.
          content:
            application/json:
              schema:
                $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'
        '422':
          $ref: '#/components/responses/Hiba422'
        default:
          $ref: '#/components/responses/Hiba'

components:

  securitySchemes:

    TelephelyTanusitvany:
      type: mutualTLS
      description: |
        A TELEPHELY azonossaga, kolcsonos TLS-sel. A telephelyi szerver sajat
        tanusitvannyal jelentkezik be, es a felho tanusitvanyat is ellenorzi.

        ⚠️ A TELEPHELY AZONOSSAGAT A TANUSITVANY ADJA, NEM A KERES TESTE. A
        felho a felmutatott tanusitvany SHA-256 ujjlenyomatat keresi ki egy
        nyilvantartasbol, es abbol jon a telephely azonositoja. Ha a keres
        testeben mas telephely all, a valasz 403 - nem valasztunk a ketto kozul,
        hanem ELUTASITJUK. Enelkul barmelyik ervenyes telephely irhatna a tobbi
        adatat.

        A VISSZAVONAS A NYILVANTARTASBAN TORTENIK, nem visszavonasi listaval: egy
        sor megjelolese azonnal hat. ARA: a felho nyilvantartasa a hitelesseg
        egyetlen forrasa - ha az nem elerheto, egyetlen telephely sem tud
        szinkronizalni. Ezt vallaltan igy valasztottuk, mert egy visszavonasi
        lista frissessege egy offline telephely mellett amugy sem garantalhato.

        A HITELESITO (CA) A MIENK. A telephelyi tanusitvanyokat mi adjuk ki; a
        felho szinkron-allomasnevenek kiszolgaloi tanusitvanya SZINTEN a mi
        hitelesitonktol szarmazik, es a hitelesito tanusitvanya a telepitokeszlet
        resze. A bongeszos admin allomasneve ezzel szemben NYILVANOS hitelesitot
        hasznal - egy bongeszo a mi hitelesitonket nem ismeri.

        ⚠️ A CSATORNA HITELESITESE ONMAGABAN NEM ELEG a lefele meno parancsokra:
        aki a kiszolgalot vagy a kulcsot megszerzi, tetszoleges parancsot
        kuldhet. Ezert hordoz minden valtozas egy (ma meg nem kotelezo)
        ALAIRAST - lasd a Valtozas semat.

  headers:

    SiduriSzerzodes:
      description: Melyik szerzodessel szolgaltak ki.
      required: true
      schema:
        type: string
        examples: ["szinkron/1.8.0"]

  responses:

    Hiba:
      description: Hiba
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba401:
      description: A telephely nem hitelesitett.
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba403:
      description: Ez a tanusitvany nem ehhez a telephelyhez tartozik.
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

    Hiba422:
      description: Ertelmezhetetlen keres.
      content:
        application/json:
          schema:
            $ref: '../../kozos/hiba.yaml#/components/schemas/Hiba'

  schemas:

    EladasKeres:
      title: Bizonylatok kotege
      type: object
      required: [telephely, bizonylatok]
      properties:
        telephely:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        bizonylatok:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FelkuldottBizonylat'
      additionalProperties: false

    FelkuldottBizonylat:
      title: Egy felkuldott bizonylat
      type: object
      required: [kimeno, lenyomat, tartalom, allapot]
      properties:
        kimeno:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        lenyomat:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 a tartalom kanonikus JSON-alakjara (k2 EladasLenyomat).
        tartalom:
          $ref: '#/components/schemas/BizonylatTartalom'
        allapot:
          $ref: '#/components/schemas/BizonylatAllapot'
      additionalProperties: false

    BizonylatAllapot:
      title: A bizonylat utolag valtozo resze
      type: object
      required: [allapot]
      properties:
        allapot:
          type: string
          enum: [NYOMTATASRA_VAR, KINYOMTATVA, NYOMTATASI_HIBA, SZTORNOZOTT]
        adougyiBizonylatszam:
          type: [string, "null"]
        pultId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        pultNev:
          type: string
          description: |
            A LEZARASKORI pult (1.16.0, KESZLET.md S6). Elemzesi adat, ezert itt, a
            lenyomaton KIVUL: egy mar felkuldott bizonylat ujrakuldese (pl. a
            sztorno utan) igy nem mutat hamis tartalmi elterest.
      additionalProperties: false

    BizonylatTartalom:
      title: A bizonylat valtozatlan tartalma
      description: |
        Onmagaban ertelmezheto (A3/1). Penz: egesz forint. Mennyiseg, arany,
        arfolyam: szoveg - lebegopont nincs (I1).
      type: object
      required: [fej, tetelek, afaCsoportok, fizetesek]
      properties:
        fej:
          type: object
          required: [azonosito, uzletiNap, siduriBizonylatszam, mod, tipus, eszkoz, reszSorszam,
                     reszekSzama, vegosszeg, borravalo, epoch, szamlalo, eszkozIdo]
          properties:
            azonosito: {type: string}
            uzletiNap: {type: string, format: date}
            siduriBizonylatszam: {type: string}
            mod: {type: string, enum: [ADOUGYI, SZAMLA]}
            tipus: {type: string, enum: [NORMAL, SZTORNO]}
            eredetiBizonylat: {type: [string, "null"]}
            rendeles: {type: [string, "null"]}
            teljesitesMod: {type: [string, "null"]}
            eszkoz: {type: string}
            muszak: {type: [string, "null"]}
            reszSorszam: {type: integer}
            reszekSzama: {type: integer}
            vegosszeg: {type: integer, format: int64}
            borravalo: {type: integer, format: int64}
            kedvezmenyTipus: {type: [string, "null"]}
            kedvezmenyErtek: {type: [string, "null"]}
            szervizdijSzazalek: {type: [string, "null"]}
            kedvezmenyIndokKod: {type: [string, "null"]}
            kedvezmenyIndokSzoveg: {type: [string, "null"]}
            sztornoIndokKod: {type: [string, "null"]}
            sztornoIndokSzoveg: {type: [string, "null"]}
            epoch: {type: integer, format: int64}
            szamlalo: {type: integer, format: int64}
            eszkozIdo: {type: string, format: date-time}
            szerverIdo: {type: [string, "null"], format: date-time}
            kezelo:
              type: [string, "null"]
              description: (1.11.0) A muszak gazdaja - aki a bizonylatot utotte.
            kezeloNev:
              type: [string, "null"]
              description: (1.11.0) Az ELADASKORI nev - a riport 8 ev mulva is olvashato legyen.
            eszkozNev:
              type: [string, "null"]
              description: (1.11.0) A gep eladaskori neve.
        tetelek:
          type: array
          items:
            type: object
            required: [azonosito, megnevezes, bruttoEgysegar, afaKategoria, mennyiseg, sorOsszeg,
                       allapot, epoch, szamlalo]
            properties:
              azonosito: {type: string}
              termek: {type: [string, "null"]}
              kiszereles: {type: [string, "null"]}
              megnevezes: {type: string}
              bruttoEgysegar: {type: integer, format: int64}
              afaKategoria: {type: string}
              mennyiseg: {type: string}
              sorOsszeg: {type: integer, format: int64}
              allapot: {type: string}
              epoch: {type: integer, format: int64}
              szamlalo: {type: integer, format: int64}
              eszkozIdo: {type: [string, "null"]}
        torlesek:
          type: array
          description: A rendelesbol lezaras elott torolt tetelek - a csalasfelderites nyoma.
          items:
            type: object
            properties:
              azonosito: {type: string}
              tetel: {type: string}
              felhasznalo: {type: [string, "null"]}
              indokKod: {type: [string, "null"]}
              indokSzoveg: {type: [string, "null"]}
              konyharaVoltKuldve: {type: boolean}
              felutesOtaMasodperc: {type: integer, format: int64}
              epoch: {type: integer, format: int64}
              szamlalo: {type: integer, format: int64}
              eszkozIdo: {type: [string, "null"]}
              felhasznaloNev: {type: [string, "null"], description: (1.11.0) eladaskori nev}
        afaCsoportok:
          type: array
          items:
            type: object
            required: [afaKategoria, brutto, netto, afa]
            properties:
              afaKategoria: {type: string}
              brutto: {type: integer, format: int64}
              netto: {type: integer, format: int64}
              afa: {type: integer, format: int64}
        fizetesek:
          type: array
          items:
            type: object
            required: [sorrend, mod, osszeg]
            properties:
              sorrend: {type: integer}
              mod: {type: string}
              osszeg: {type: integer, format: int64}
              kerekitesiKulonbozet: {type: [integer, "null"], format: int64}
              valutaPenznem: {type: [string, "null"]}
              valutaOsszeg: {type: [string, "null"]}
              arfolyam: {type: [string, "null"]}
        egyebTetelek:
          type: array
          items:
            type: object
            required: [fajta, afaKategoria, osszeg]
            properties:
              fajta: {type: string, enum: [KEDVEZMENY, SZERVIZDIJ]}
              afaKategoria: {type: string}
              osszeg: {type: integer, format: int64}
        megosztas:
          type: array
          items:
            type: object
            required: [tetel, reszSorszam, suly, osszeg]
            properties:
              tetel: {type: string}
              reszSorszam: {type: integer}
              suly: {type: integer, format: int64}
              osszeg: {type: integer, format: int64}

    EladasValasz:
      title: Bizonylatonkenti kimenet
      type: object
      required: [kimenetek]
      properties:
        kimenetek:
          type: array
          items:
            type: object
            required: [kimeno, eredmeny]
            properties:
              kimeno: {type: string}
              eredmeny: {type: string, enum: [ELFOGADVA, ELUTASITVA]}
              kod:
                type: [string, "null"]
                enum: [HIBAS_LENYOMAT, ELTERO_TARTALOM, HIBAS_TETEL, null]
              uzenet: {type: [string, "null"]}

    EgyeztetesKeres:
      title: Napi osszesitok es az audit-lanc feje
      type: object
      required: [telephely, napok]
      properties:
        telephely:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        napok:
          type: array
          maxItems: 31
          items:
            $ref: '#/components/schemas/NapiOsszesito'
        auditFej:
          type: [object, "null"]
          required: [epoch, szamlalo, lenyomat]
          properties:
            epoch: {type: integer, format: int64}
            szamlalo: {type: integer, format: int64}
            lenyomat: {type: string}
      additionalProperties: false

    NapiOsszesito:
      title: Egy nap osszesitoje
      type: object
      required: [uzletiNap, darab, vegosszeg, afa, fizetes, lenyomat]
      properties:
        uzletiNap: {type: string, format: date}
        darab: {type: integer, format: int64}
        vegosszeg: {type: integer, format: int64}
        afa:
          type: object
          additionalProperties: {type: integer, format: int64}
        fizetes:
          type: object
          additionalProperties: {type: integer, format: int64}
        lenyomat: {type: string, pattern: '^[0-9a-f]{64}$'}

    EgyeztetesValasz:
      title: Naponkenti kimenet
      type: object
      required: [napok]
      properties:
        napok:
          type: array
          items:
            type: object
            required: [uzletiNap, allapot, felhoDarab, felhoVegosszeg]
            properties:
              uzletiNap: {type: string, format: date}
              allapot: {type: string, enum: [IGAZOLT, ELTERES]}
              felhoDarab: {type: integer, format: int64}
              felhoVegosszeg: {type: integer, format: int64}
              uzenet: {type: [string, "null"]}

    HozzaferesKeres:
      title: Hozzaferes-lekerdezes
      type: object
      required: [telephely]
      properties:
        telephely:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        ismertVerzio:
          type: [string, "null"]
          description: >
            Amit a telephely mar alkalmazott. Ha egyezik a mostanival, a valasz
            nem hoz adatot. Elso lekerdezesnel ures.
          maxLength: 128
        valtoztatasok:
          type: array
          maxItems: 200
          description: |
            A telephelyen, KAPCSOLAT NELKUL tett valtoztatasok, elbiralasra.

            ⚠️ UGYANEBBEN A KORBEN, nem kulon uton. Igy az elfogadott
            valtoztatas MAR BENNE VAN a visszakapott pillanatkepben - kulonben a
            telephely egy olyan allapotot alkalmazna, ami a sajat, imenti
            valtoztatasat meg nem tartalmazza, es az a pillanatra visszaallna.

            ⚠️ Ez NEM parancs, hanem KERES. A lefele meno irany parancs; ez az
            egyetlen hely, ahol a telephely kerdez valamit, amire a felho
            nemet is mondhat.
          items:
            $ref: '#/components/schemas/HelyiValtoztatas'
        siduriBelepesek:
          type: array
          maxItems: 500
          description: |
            (1.9.0) A Siduri-belepesek a pultnal (HOZZAFERES §8.5) - az uj es a
            kozben lezart munkamenetek. Azonosito szerint idempotens: ugyanaz a
            sor ujrakuldve csak a veget frissiti.
          items:
            $ref: '#/components/schemas/SiduriPultBelepes'

    SiduriPultBelepes:
      title: Egy Siduri-belepes a pultnal
      type: object
      required: [azonosito, kezdet]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        kollega:
          type: [string, "null"]
        eszkoz:
          type: [string, "null"]
        kezdet:
          type: string
          format: date-time
        veg:
          type: [string, "null"]
          format: date-time
        vegOka:
          type: [string, "null"]
          enum: [KILEPES, TETLENSEG, IDOKORLAT, null]
      additionalProperties: false

    SiduriPult:
      title: A Siduri-hozzaferes a pulthoz
      description: |
        (1.9.0) HOZZAFERES §8. A forgo resz (a mostani es az elozo honap) es a
        PULT_HOZZAFERES kapcsolos kollegak szemelyes resze.

        ⚠️ A telephely NEM tarolja el igy: a megerkezeskor lenyomatot kepez a
        sajat borsaval, es csak azt irja az adatbazisba. A kod csak a kolcsonos
        TLS-sel vedett valaszban utazik.
      type: object
      required: [forgo, kollegak]
      properties:
        forgo:
          type: array
          maxItems: 2
          items:
            type: object
            required: [honap, kod]
            properties:
              honap:
                type: string
                pattern: '^[0-9]{4}-[0-9]{2}$'
              kod:
                type: string
                pattern: '^[0-9]{4}$'
            additionalProperties: false
        kollegak:
          type: array
          items:
            type: object
            required: [azonosito, nev, szemelyes]
            properties:
              azonosito:
                $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
              nev:
                type: string
              szemelyes:
                type: string
                pattern: '^[0-9]{3}$'
            additionalProperties: false
      additionalProperties: false

    HozzaferesValasz:
      title: Hozzaferes-pillanatkep
      type: object
      required: [verzio, valtozott]
      properties:
        verzio:
          type: string
          description: >
            A pillanatkep tartalmanak lenyomata. A telephely EZT tarolja el, es
            ezt kuldi vissza legkozelebb.
          maxLength: 128
        valtozott:
          type: boolean
          description: >
            Hamis: a telephely allapota naprakesz, es a tobbi mezo ures. Igy egy
            valtozatlan hozzaferes nem visz at semmit.
        szerepek:
          type: array
          items:
            $ref: '#/components/schemas/SzinkronSzerep'
        felhasznalok:
          type: array
          items:
            $ref: '#/components/schemas/SzinkronFelhasznalo'
        siduriPult:
          $ref: '#/components/schemas/SiduriPult'
        elbiralasok:
          type: array
          description: >
            A felkuldott valtoztatasok sorsa. Akkor is jon, ha a pillanatkep
            valtozatlan - az elbiralas fuggetlen attol, valtozott-e a tartalom.
          items:
            $ref: '#/components/schemas/Elbiralas'
        telephelyDarab:
          type: integer
          minimum: 1
          description: |
            Hany telephelye van a berlonek. EGYETLEN telephely eseten a
            globalis szerkesztes oldala NEM JELENIK MEG (HOZZAFERES 7.1):
            folosleges es zavaro lenne.

            ⚠️ Azert jon le MINDEN korben, mert a pultnak ezt KAPCSOLAT NELKUL
            is tudnia kell. Ha csak lekerdezeskor derulne ki, a menupont
            offline vagy eltunne, vagy egy olyan oldalra vinne, ami csak annyit
            mond, hogy nem hasznalhato - es epp ezt a zavart akartuk elkerulni.

    HelyiValtoztatas:
      title: Helyi valtoztatas elbiralasra
      type: object
      required: [azonosito, tortent, cselekvo, erintett, hatokorTipus, fajta]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        tortent:
          type: string
          format: date-time
          description: |
            AMIKOR MEGTORTENT, nem amikor felkerult. A felho EHHEZ az idoponthoz
            meri, hogy a cselekvonek volt-e joga.

            ⚠️ A ket idopont kulonbsege lehet napokban merheto, es epp ez a
            szelet lenyege: egy kedden tett valtoztatas kedden tortent.
        cselekvo:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        erintett:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        hatokorTipus:
          type: string
          enum: [TELEPHELY, RAKTAR, GLOBALIS]
        hatokorAzonosito:
          oneOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
            - type: "null"
          description: GLOBALIS hatokornel ures, a tobbinel kotelezo.
        fajta:
          type: string
          enum: [SZEREPEK, JOGOK, AKTIV]
        ertekek:
          type: array
          maxItems: 500
          description: >
            A hatokor TELJES kivant halmaza - szerepazonositok vagy
            jogosultsagkodok. NEM novekmeny: a reszleges alkalmazas olyan
            allapotot allitana elo, amit soha senki nem akart.
          items:
            type: string
            maxLength: 100
        aktiv:
          type: [boolean, "null"]
          description: >
            AKTIV fajtanal. ⚠️ A hamis (letiltas) mindig elfogadhato; az igaz
            (visszaengedes) kapcsolat nelkul SOHA - kijuttatni valakit surgos
            lehet, beengedni sosem az.

    Elbiralas:
      title: Egy valtoztatas sorsa
      type: object
      required: [azonosito, eredmeny]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        eredmeny:
          type: string
          enum: [ELFOGADVA, ELUTASITVA, ELAVULT]
          description: |
            ⚠️ HAROM kimenet, nem ketto, es az utolso KETTO NEM UGYANAZ.

              - ELUTASITVA: a cselekvonek NEM VOLT JOGA hozza. Rola szol.
              - ELAVULT: a kozpont idokozben dontott ugyanarrol. Senkirol nem
                szol, csak sorrendrol.

            A felulet ezeket KULON kell hogy mondja. Egy kozos "nem sikerult"
            azt sugallna a pultfonoknek, hogy o rontott el valamit - pedig a
            masodik esetben csak megelroztek.
        kod:
          type: [string, "null"]
          maxLength: 64
        uzenet:
          type: [string, "null"]
          maxLength: 500

    SzinkronSzerep:
      title: Szerep
      type: object
      required: [azonosito, kod, nev, szint, jogosultsagok]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        kod:
          type: string
        nev:
          type: string
        szint:
          type: integer
          minimum: 0
          description: >
            Kisebb szam = erosebb. A 0. szint a Siduri rendszergazdae. A
            telephely ezt a hierarchia-szabalyokhoz hasznalja.
        jogosultsagok:
          type: array
          description: >
            ⚠️ MAR KIBONTVA: a sajat jogok ES a gyengebb szintektol OROKOLTEK
            egyutt. A kibontast a felho vegzi, hogy a szabaly EGY helyen legyen.
          items:
            type: string

    SzinkronFelhasznalo:
      title: Pultos felhasznalo
      type: object
      required: [azonosito, nev, kulsoAzonosito, aktiv, szerepek, elteresek]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
        kulsoAzonosito:
          type: string
          description: A bejelentkezeshez hasznalt azonosito a pult mogott.
        aktiv:
          type: boolean
          description: >
            Hamis: LETILTVA. Torles nincs - a telephely a sajat masolataban is
            letiltja, nem torli.
        szerepek:
          type: array
          description: A felhasznalo szerepei EZEN a telephelyen (a globalisakkal egyutt).
          items:
            $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        elteresek:
          type: array
          description: Szemelyre szabott elteres a szereptol, mindket iranyba.
          items:
            $ref: '#/components/schemas/SzinkronElteres'

    SzinkronElteres:
      title: Szemelyre szabott elteres
      type: object
      required: [kod, engedve]
      properties:
        kod:
          type: string
        engedve:
          type: boolean
          description: >
            Igaz: a szerepen felul megkapja. Hamis: a szerep ellenere elvesszuk.
            A tiltas eros.

    RegisztracioKeres:
      title: Regisztracios keres
      type: object
      required: [jegy, tanusitvanykeres]
      properties:
        jegy:
          type: string
          description: |
            Az egyszer hasznalhato regisztracios jegy, ahogy a telepito kapta. A
            felho NEM magat a jegyet tarolja, hanem a LENYOMATAT - egy
            adatbazis-mentesbol igy nem esik ki hasznalhato jegy.
          minLength: 16
          maxLength: 200
        tanusitvanykeres:
          type: string
          description: |
            PKCS#10 tanusitvanykeres (CSR), PEM alakban, a szokasos
            BEGIN CERTIFICATE REQUEST hataroloval. A benne levo alanynevet a
            felho FIGYELMEN KIVUL HAGYJA: az alanynevet a jegyhez tartozo
            telephely adja, nem a kerelmezo - kulonben a kerelmezo irna sajat
            maganak az azonossagat.
          maxLength: 8000

    RegisztracioValasz:
      title: Regisztracios valasz
      type: object
      required: [telephely, tanusitvany, hitelesito, lejar]
      properties:
        telephely:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        tanusitvany:
          type: string
          description: A kiallitott telephelyi tanusitvany, PEM alakban.
        hitelesito:
          type: string
          description: |
            A hitelesito (CA) tanusitvanya, PEM alakban. A telephely EZZEL
            ellenorzi a felho szinkron-allomasnevet - nem a gep gyari
            tanusitvanytarabol. Igy a bizalom kore zart marad.
        lejar:
          type: string
          format: date-time
          description: |
            A tanusitvany lejarata. A telephely ezt ELORE latja, es idoben
            ujrakerhet - egy lejart tanusitvany ugyanolyan nemanak tunik, mint
            egy szakadt halozat, es azt senki nem keresne itt.

    LekerdezesKeres:
      title: Lekerdezes
      type: object
      required: [telephely, allapot]
      properties:
        telephely:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        kurzor:
          type: string
          maxLength: 200
          description: >
            Az elozo valasz kovetkezoKurzor erteke. HIANYZIK az elso
            lekerdezesnel es a teljes ujraszinkronnal - ez a ketto ugyanaz a
            muvelet.
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
          description: >
            Egy koteg merete. A felso hatar nem kenyelmi korlat: a telephelyi
            szerver egy J1900, ami kozben kasszat is kiszolgal.
        allapot:
          $ref: '#/components/schemas/TelephelyAllapot'
        felkuldes:
          type: array
          maxItems: 200
          description: |
            A telephelyen tett torzsadat-irasok, elbiralasra (1.4.0). A
            SORREND SZAMIT: a felho a kuldes sorrendjeben dolgozza fel, mert egy
            termek a kategoriajara, egy kiszereles a termekere hivatkozik.

            ⚠️ Egy tetel addig marad a telephely kimeno soraban, amig a valasz
            KIMENETET nem ad ra. Ha egy tetelre nem jon kimenet (a felho
            atmeneti hiba miatt megallt, vagy regebbi, es a mezot nem ismeri),
            a kovetkezo korben ujra felmegy. Az azonosito miatt a felho egy mar
            elbiralt tetelt nem biral el ujra, hanem a regi kimenetet adja.
          items:
            $ref: '#/components/schemas/FelkuldottTetel'
      additionalProperties: false

    TelephelyAllapot:
      title: A telephely allapota
      description: >
        A szivveres tartalma. Ez teszi az ures lekerdezest is hasznossa.
      type: object
      required: [oraAllas, szerzodesVerzio, alkalmazasVerzio]
      properties:
        oraAllas:
          type: string
          format: date-time
          description: >
            A TELEPHELY fali oraja, a keres pillanataban. A felho osszeveti a
            sajatjaval - az elteres a torzsadat-utkozes feloldasat (O3) teszi
            megbizhatova vagy megbizhatatlanna.
        szerzodesVerzio:
          type: string
          description: Melyik K3-verziot beszeli a telephely.
          examples: ["szinkron/1.8.0"]
        alkalmazasVerzio:
          type: string
          description: A telephelyi szerver kiadasi verzioja.
        utolsoAlkalmazottSorszam:
          type: integer
          format: int64
          description: >
            A legmagasabb sorszam, ami a telephelyen MAR ERVENYRE JUTOTT. A
            felho ebbol latja, hol tart valojaban - a kurzor csak azt mondja
            meg, meddig OLVASOTT.
      additionalProperties: false

    LekerdezesValasz:
      title: Lekerdezes valasza
      type: object
      required: [valtozasok, kovetkezoLekerdezesMp]
      properties:
        valtozasok:
          type: array
          items:
            $ref: '#/components/schemas/Valtozas'
        kovetkezoKurzor:
          type: string
          description: >
            A kovetkezo lekerdezes kurzora. HIANYZIK, ha nem valtozott semmi -
            ilyenkor a telephely az elozovel kerdez ujra.
        vanTobb:
          type: boolean
          description: Van-e meg varakozo valtozas a kotegen tul.
        kovetkezoLekerdezesMp:
          type: integer
          minimum: 0
          description: |
            HANY MASODPERC MULVA JOJJON VISSZA A TELEPHELY.

            NULLA, amig van tobb valtozas - igy egy csomoban erkezo szerkesztes
            masodpercek alatt leer. Egyebkent a beallitott alapütem. AZ UTEMET A
            FELHO MONDJA MEG, nem a telephely talalja ki: igy egy terheles alatt
            levo felho vissza tud venni a gyakorisagbol.
          examples: [0, 60]
        oraElteresMp:
          type: integer
          description: |
            A telephely es a felho oraja kozotti elteres, masodpercben (pozitiv,
            ha a telephely SIET).

            ⚠️ A KUSZOB FOLOTTI ELTERES JELZENDO a felulet fele. Enelkul a
            mezonkenti idobelyeg-feloldas (O3) vakon fut: a sorrendet ket gep
            fali oraja donti el.
        figyelmeztetes:
          type: string
          description: >
            Emberi mondat, ha van megjegyezni valo (pl. nagy oraelteres). A
            kliens NEM erre agazik el - arra a gepi mezok valok.
        felkuldesElbiralasok:
          type: array
          description: |
            A felkuldott tetelek sorsa (1.4.0), a feldolgozas sorrendjeben.
            ⚠️ AMI NINCS BENNE, AZ NINCS ELBIRALVA - nem elutasitva. A telephely
            megtartja, es a kovetkezo korben ujra kuldi.
          items:
            $ref: '#/components/schemas/FelkuldesElbiralas'
        afakategoriak:
          type: array
          description: |
            A berlo TELJES afakategoria-listaja (1.7.0), minden valaszban. Kicsi
            (nehany tucat sor), ezert olcsobb mindig kuldeni, mint verziozni. A
            telephely a valtozasok ELOTT alkalmazza: egy lejovo afa-iras mar az
            uj kategoriara hivatkozhat.
          items:
            $ref: '#/components/schemas/SzinkronAfakategoria'
      additionalProperties: false

    SzinkronAfakategoria:
      title: Egy afakategoria
      type: object
      required: [azonosito, nev, gyujto, aktiv]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
        gyujto:
          type: string
          enum: [A_5, B_18, C_27, D_AJT, E_0, SZERVIZ_5, SZERVIZ_18, SZERVIZ_27]
        aktiv:
          type: boolean
      additionalProperties: false

    Valtozas:
      title: Egy valtozas
      description: |
        EGY LEFELE MENO PARANCS. A telephely emberi jovahagyas nelkul alkalmazza
        - ha atmegy a sajat validalasan.

        ⚠️ A FELHO A VEGALLAPOTOT KULDI, nem a lepessorozatot (B16.5). Ha egy
        telephely harom hetig offline volt, es kozben ugyanaz az ar haromszor
        valtozott, EGY valtozas erkezik: a mai ervenyes ertek. A koztes lepesek
        az AUDIT-naploban maradnak, a felhoben.
      type: object
      required: [sorszam, tipus, telephely, tabla, rekordId, mezo]
      properties:
        sorszam:
          type: integer
          format: int64
          description: >
            Telephelyenkent MONOTON novekvo. Ez adja az idempotenciat: egy mar
            alkalmazott sorszam ujbol megerkezese nem alkalmazodik ujra.
        tipus:
          type: string
          description: |
            ⚠️ ISMERETLEN TIPUST A TELEPHELY NEM ALKALMAZ, hanem ELUTASITVA
            nyugtaz (ISMERETLEN_TIPUS). Ez a ket kiadasi ciklusnyi
            visszafele kompatibilitas ara es eszkoze egyszerre: a felho igy
            megtudja, hogy a telephely regebbi, es nem hiszi alkalmazottnak.
          enum: [MEZO_ERTEK, ZAROLAS, ZAROLAS_FELOLDAS, REKORD, KESZLET_PARANCS]
        telephely:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        tabla:
          type: string
          description: |
            Melyik entitas. 1.6.0-tol a termek is (nev, allapot).

            ⚠️ Ismeretlen tabla/mezo parost a telephely ELUTASITVA nyugtaz
            (ISMERETLEN_MEZO) - nem alkalmazza talalomra.
          enum: [kiszereles, termek, kategoria, raktar, pult, anyag, recept, eszkoz_pult,
                 keszlet]
        rekordId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        mezo:
          type: string
          description: |
            kiszereles: brutto_ar. termek: megnevezes, allapot (1.6.0), afa (1.7.0).
            kategoria (1.8.0): nev, szulo, aktiv, afa, ntak. REKORD tipusnal a
            mezo "-" (nincs ertelme). A leiro-alapu tablaknal (1.13.0) a leiras
            mezoi (admin TorzsRekord). KESZLET_PARANCS-nal (1.14.0) a muvelet
            neve: bevetelezes, atadas, selejt, szemelyzeti, eloallitas - es az
            1.15.0 ota leltar (a KeszletMuvelet fordulonap es indokKod mezojevel).
        egeszErtek:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: >
            A brutto_ar MEZO_ERTEK-enel az uj ertek, egesz forintban (I1).
        szovegErtek:
          type: string
          description: |
            ⚠️ A hossza tipusonkent mas: a nev legfeljebb 200, a recept tetelei es
            a KESZLET_PARANCS (1.14.0 - a KeszletParancs JSON-ja: muvelet, keres,
            felhasznalo) hosszabb is lehet.

            A szoveges mezok uj erteke (1.6.0): a megnevezesnel a nev, az
            allapotnal AKTIV vagy INAKTIV - es az 1.12.0 ota TOROLT (soft
            delete, admin/1.21.0): a torles es a visszaallitas ugyanez a mezo. Az afanal
            (1.7.0) a ket afakategoria azonositoja vesszovel: "helyben,elvitel".

            A kategorianal (1.8.0): nev - a nev; szulo - a szulo azonositoja, vagy
            ures (gyokerszint); aktiv - "true"/"false"; afa - "helyben,elvitel",
            barmelyik resz ures lehet (= orokli); ntak - "fo|al", barmelyik resz
            ures lehet.
        kategoria:
          description: |
            REKORD tipusnal (1.8.0): egy a felhoben FELVETT kategoria teljes
            alakja. A telephely csak akkor veszi fel, ha meg nincs meg; a mezok
            kesobbi valtozasai MEZO_ERTEK-kent jonnek.
          $ref: '#/components/schemas/SzinkronKategoria'
        termek:
          description: |
            REKORD tipusnal (1.12.0): egy a felhoben FELVETT termek teljes
            alakja, mezonkenti eredettel - ugyanaz az alak, mint felfele. A
            telephely csak akkor veszi fel, ha meg nincs meg.
          $ref: '#/components/schemas/SzinkronTermek'
        kiszereles:
          description: |
            REKORD tipusnal (1.12.0): egy a felhoben FELVETT kiszereles. A termeke
            elotte jon (a sorszam adja a sorrendet); ha megsincs meg, a telephely
            NINCS_ILYEN_REKORD-dal utasitja el.
          $ref: '#/components/schemas/SzinkronKiszereles'
        rekord:
          description: |
            REKORD tipusnal (1.13.0): a LEIRO-ALAPU torzsadat (raktar, pult, anyag,
            recept, eszkoz_pult) rekordja. A telephely mezonkent dont: uj sornal a
            felhoe, meglevonel csak a kesobbi eredetu felhos ertek nyer.
          $ref: '#/components/schemas/SzinkronRekord'
        mezoeredet:
          allOf:
            - $ref: '#/components/schemas/Mezoeredet'
          description: >
            MIKOR es HONNAN kapta a mezo ezt az erteket. A telephely ebbol donti
            el, hogy a sajat erteke kesobbi-e (O3): ha igen, a sajatja nyer, es
            ezt ELUTASITVA nyugtazza (KESOBBI_HELYI_ERTEK).
        zarolasSzint:
          type: string
          enum: [lanc]
          description: A ZAROLAS tipusnal, hogy melyik szint zarolta.
        ervenyesTol:
          type: string
          format: date-time
          description: |
            KESLELTETETT ELESITES (B16.8/5). Ha jelen van, a telephely a
            valtozast ELTARTJA, es csak ekkor alkalmazza.

            ⚠️ Ezert kapja a lanc-szintu, sok telephelyet erinto armuvelet: egy
            feltort felho-fiok igy nem tudja EGY pillanat alatt kinullazni egy
            franchise osszes arat - marad ido eszrevenni.
        alairas:
          type: string
          description: |
            A valtozas alairasa. A TELEPHELY MA MEG NEM KOVETELI MEG.

            ⚠️ Azert van a szerzodesben MOST, mert kesobb bevezetni TORO
            valtozas lenne - es ebben a szerzodesben az a legdragabb fajta,
            mert a ket oldal soha nem frissul egyszerre.

            Amit majd ad: a telephely a parancs EREDETET ellenorzi, nem csak a
            csatornat. Amit NEM ad: vedelem, ha az alairo kulcs ugyanazon a
            gepen van, amit feltortek.
      additionalProperties: false

    Mezoeredet:
      title: Mezoeredet
      type: object
      required: [modositva, forras]
      properties:
        modositva:
          type: string
          format: date-time
        forras:
          type: string
          enum: [felho, telephely]
      additionalProperties: false

    NyugtaKeres:
      title: Nyugta
      type: object
      required: [telephely, nyugtak]
      properties:
        telephely:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nyugtak:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Nyugta'
      additionalProperties: false

    Nyugta:
      title: Egy valtozas nyugtaja
      type: object
      required: [sorszam, allapot]
      properties:
        sorszam:
          type: integer
          format: int64
        allapot:
          type: string
          description: |
            ATVETTE: megerkezett, de meg nem ervenyes (pl. kesleltetett
            elesites miatt var).
            ALKALMAZTA: ervenyre jutott a telephelyi adatokban.
            ELUTASITVA: a telephely NEM alkalmazta - az okot a kod mondja meg.
          enum: [ATVETTE, ALKALMAZTA, ELUTASITVA]
        kod:
          type: string
          description: |
            Az elutasitas gepi oka. ERRE agazik el a felho, soha nem a szovegre.
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          examples:
            - "ISMERETLEN_TIPUS"
            - "KESOBBI_HELYI_ERTEK"
            - "ERVENYTELEN_AFAKULCS"
            - "ZAROLT_ERTEK"
            - "NINCS_ILYEN_REKORD"
        uzenet:
          type: string
          description: Magyar szoveg a naplonak es a feluletnek.
        idopont:
          type: string
          format: date-time
          description: Mikor allt elo ez az allapot, a telephely oraja szerint.
      additionalProperties: false

    FelkuldottTetel:
      title: Egy felkuldott torzsadat-iras
      description: |
        KET FAJTA, mert egy uj rekordnal nincs mit mezonkent osszevetni - a
        felho meg nem tudja, hogy letezik.

          - REKORD: a rekord TELJES allapota. Letrehozas es frissites is
            (a kezdeti feltoltes csupa REKORD). Az idobelyeg nelkuli mezoknel
            (nev, afa, kategoria, allapot...) a TELEPHELY nyer, mert ma o az
            egyetlen iroja. Az AR kivetel: arra a mezoeredet szabalya ervenyes.
          - MEZO_ERTEK: egy mezo uj erteke, mezoeredettel es a cselekvovel.
            A kiszereles ara, es 1.6.0-tol a termek neve es allapota.

        ⚠️ 1.6.0: a termek NEVE es ALLAPOTA mar nem "a telephely nyer" mezo -
        a felho is irhatja oket. A REKORD ezert mezonkent hozza az eredetuket
        (`termek.mezoeredetek`), es a felho csak a kesobbi erteket veszi at.
      type: object
      required: [azonosito, fajta, tabla, rekordId, tortent]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        fajta:
          type: string
          enum: [REKORD, MEZO_ERTEK]
        tabla:
          type: string
          enum: [kategoria, termek, kiszereles, raktar, pult, anyag, recept, eszkoz_pult]
        rekordId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        tortent:
          type: string
          format: date-time
          description: >
            AMIKOR MEGTORTENT, a telephely oraja szerint - nem amikor
            felkerult. A felho EHHEZ meri, hogy a cselekvonek volt-e joga.
        mezo:
          type: string
          description: A leiro-alapu tablaknal (1.13.0) a leiras mezoi.
          description: MEZO_ERTEK fajtanal kotelezo.
        egeszErtek:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: A brutto_ar MEZO_ERTEK-enel az uj ertek, egesz forintban (I1).
        szovegErtek:
          type: string
          maxLength: 200
          description: |
            A megnevezes es az allapot MEZO_ERTEK-enel az uj ertek (1.6.0); az
            afanal (1.7.0) "helybenKategoriaId,elvitelKategoriaId".
        mezoeredet:
          allOf:
            - $ref: '#/components/schemas/Mezoeredet'
          description: >
            MEZO_ERTEK fajtanal kotelezo, es a forras mindig telephely. A
            felho EZT veti ossze a sajat mezoeredetevel.
        cselekvo:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        indok:
          type: [string, "null"]
          maxLength: 500
        kategoria:
          $ref: '#/components/schemas/SzinkronKategoria'
        termek:
          $ref: '#/components/schemas/SzinkronTermek'
        kiszereles:
          $ref: '#/components/schemas/SzinkronKiszereles'
        rekord:
          $ref: '#/components/schemas/SzinkronRekord'
      additionalProperties: false

    KeszletKeres:
      title: A keszlet tukre (1.14.0)
      type: object
      required: [telephely, mozgasok, egyenlegek]
      properties:
        telephely:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        mozgasok:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FelkuldottMozgas'
        egyenlegek:
          type: array
          items:
            $ref: '#/components/schemas/FelkuldottEgyenleg'
      additionalProperties: false

    FelkuldottMozgas:
      title: Egy konyvelt keszletmozgas (1.14.0)
      type: object
      required: [azonosito, sorszam, raktarId, anyagId, fajta, mennyiseg, korrekciobol, mikor]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        sorszam:
          type: integer
          format: int64
        raktarId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        anyagId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        fajta:
          type: string
        mennyiseg:
          type: string
        egysegkoltseg:
          type: string
        korrekciobol:
          type: boolean
        bizonylatId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        tetelsorId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        bizonylatszam:
          type: string
        megjegyzes:
          type: string
        mikor:
          type: string
          format: date-time
      additionalProperties: false

    FelkuldottEgyenleg:
      title: Egy egyenleg a konyveles utan (1.14.0)
      type: object
      required: [raktarId, anyagId, mennyiseg, atlagKorrekciobol]
      properties:
        raktarId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        anyagId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        mennyiseg:
          type: string
        atlagar:
          type: string
        utolsoBekerulesiAr:
          type: string
        atlagKorrekciobol:
          type: boolean
      additionalProperties: false

    KeszletValasz:
      title: Atvette (1.14.0)
      type: object
      required: [atvett]
      properties:
        atvett:
          type: integer
      additionalProperties: false

    SzinkronRekord:
      title: Leiro-alapu rekord (1.13.0)
      description: |
        Minden mezo kanonikus szovegkent (admin TorzsRekord), mezonkenti
        eredettel. Egy uj tabla nem ker uj alakot. A felhő mezonkent dont, es a
        MEZO_ERTEK-nel a tabla leirasanak jogat ellenorzi (anyag, recept:
        recept.szerkesztes; raktar, pult, eszkoz_pult: keszlet.raktar_kezeles).
      type: object
      required: [ertekek]
      properties:
        ertekek:
          type: object
          additionalProperties:
            type: string
        eredetek:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Mezoeredet'
      additionalProperties: false

    SzinkronKategoria:
      title: Kategoria (REKORD)
      type: object
      required: [nev, szint, sorrend, aktiv]
      properties:
        szuloId:
          oneOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
            - type: "null"
        nev:
          type: string
        szint:
          type: integer
          minimum: 1
          maximum: 4
        afaHelyben:
          oneOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
            - type: "null"
        afaElvitel:
          oneOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
            - type: "null"
        ntakFokategoria:
          type: [string, "null"]
        ntakAlkategoria:
          type: [string, "null"]
        sorrend:
          type: integer
        aktiv:
          type: boolean
        afaHelybenKategoriaId:
          oneOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
            - type: "null"
          description: Az ezen a szinten allo helyben afakategoria (1.8.0); null = orokli.
        afaElvitelKategoriaId:
          oneOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
            - type: "null"
        mezoeredetek:
          type: object
          description: |
            A kategoria O3-mezoinek eredete (1.8.0). A fogado oldal mezonkent
            dont: csak a kesobbi erteket veszi at.
          properties:
            nev:
              $ref: '#/components/schemas/Mezoeredet'
            szulo:
              $ref: '#/components/schemas/Mezoeredet'
            aktiv:
              $ref: '#/components/schemas/Mezoeredet'
            afa:
              $ref: '#/components/schemas/Mezoeredet'
            ntak:
              $ref: '#/components/schemas/Mezoeredet'
          additionalProperties: false
      additionalProperties: false

    SzinkronTermek:
      title: Termek (REKORD)
      type: object
      required: [megnevezes, afaHelyben, afaElvitel, mennyisegiEgyseg, korhataros, allapot]
      properties:
        megnevezes:
          type: string
        megnevezesEn:
          type: [string, "null"]
        kategoriaId:
          oneOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
            - type: "null"
        afaHelyben:
          $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
        afaElvitel:
          $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
        mennyisegiEgyseg:
          type: string
        korhataros:
          type: boolean
        allapot:
          type: string
          enum: [AKTIV, INAKTIV, TOROLT]
        mezoeredetek:
          type: object
          description: |
            A nev es az allapot EREDETE (1.6.0) - mikor es honnan kaptak a
            mostani erteket. A felho mezonkent dont: csak a KESOBBI erteket veszi
            at, a sajat, kesobbi irasat nem irja felul.

            Hianyzo kulcs: a telephely nem tudja, mikor kapta (peldaul a bevezetes
            elotti adat). Ilyenkor a felho csak akkor veszi at, ha neki sincs
            eredete - vagyis a regi "a telephely nyer" szabaly el tovabb, amig
            senki nem irta at.
          properties:
            megnevezes:
              $ref: '#/components/schemas/Mezoeredet'
            allapot:
              $ref: '#/components/schemas/Mezoeredet'
            afa:
              $ref: '#/components/schemas/Mezoeredet'
          additionalProperties: false
        afaHelybenKategoriaId:
          oneOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
            - type: "null"
          description: |
            A helyben afakategoriaja (1.7.0). Az afaHelyben KOD ebbol szarmazik (a
            gyujtobol) - a ketto egyutt utazik, mert a bizonylat es az NTAK a kodra
            epul.
        afaElvitelKategoriaId:
          oneOf:
            - $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
            - type: "null"
        ntakFokategoria:
          type: [string, "null"]
          description: Az NTAK fokategoria kodja (1.5.0).
        ntakAlkategoria:
          type: [string, "null"]
          description: Az NTAK alkategoria kodja (1.5.0).
        beszerzesiBruttoAr:
          oneOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
            - type: "null"
          description: |
            A beszerzesi brutto ar, egesz forintban (1.5.0) - a felhos arres- es
            food cost-riporthoz.

            ⚠️ Uzleti adat, es a felho EZERT tarolja: a riportok es a 8 eves
            archivum ott elnek. A berlo sajat adata, masnak nem latszik.
        beszerzesiAfa:
          oneOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/AfaKategoria'
            - type: "null"
      additionalProperties: false

    SzinkronKiszereles:
      title: Kiszereles (REKORD)
      type: object
      required: [termekId, nev, bruttoAr, sorrend, allapot, vonalkodok]
      properties:
        termekId:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        nev:
          type: string
        bruttoAr:
          allOf:
            - $ref: '../../kozos/penz.yaml#/components/schemas/Osszeg'
          description: >
            ⚠️ Az ar itt is a mezoeredet szabalya ala esik, nem a "telephely
            nyer" ala. Uj rekordnal atvesszuk; letezonel csak akkor, ha a
            telephelyi mezoeredet kesobbi - vagy a felhoben meg nincs.
        arEredet:
          allOf:
            - $ref: '#/components/schemas/Mezoeredet'
          description: Hianyzik, ha az arat meg soha nem irta at senki.
        sorrend:
          type: integer
        allapot:
          type: string
          enum: [AKTIV, INAKTIV, TOROLT]
        mennyiseg:
          type: [string, "null"]
          pattern: '^[0-9]+([.][0-9]+)?$'
          description: >
            A kiszereles mennyisege (1.5.0), pl. "0.33". SZOVEGKENT, mint a K1-ben:
            lebegopontos ertek a mennyiseg kozeleben sincs.
        mennyisegiEgyseg:
          type: [string, "null"]
          examples: ["LITER", "DARAB"]
        vonalkodok:
          type: array
          description: >
            A kiszereles TELJES vonalkod-halmaza. A felho erre allitja be, nem
            novekmenykent kezeli: igy a torolt vonalkod is eltunik.
          items:
            type: string
      additionalProperties: false

    FelkuldesElbiralas:
      title: Egy felkuldott tetel sorsa
      type: object
      required: [azonosito, eredmeny]
      properties:
        azonosito:
          $ref: '../../kozos/azonosito.yaml#/components/schemas/Azonosito'
        eredmeny:
          type: string
          enum: [ELFOGADVA, ELUTASITVA, ELAVULT, ZAROLT]
          description: |
            ⚠️ NEGY kimenet, es a harom nem-elfogado NEM UGYANAZ - a felulet
            kulon mondja oket:

              - ELUTASITVA: a CSELEKVOROL szol (nem volt joga az iras idejen),
                vagy a tetel ervenytelen. A felho lekuldi a sajat erteket.
              - ELAVULT: SENKIROL nem szol, csak sorrendrol - a felhoben
                kesobbi ertek all, es az mar uton van lefele.
              - ZAROLT: a mezot kozben a kozpont zarolta. Hataskor, nem
                sorrend. A felho lekuldi a sajat erteket.
        kod:
          type: [string, "null"]
          maxLength: 64
          examples: ["NINCS_JOGOSULTSAG", "NINCS_ILYEN_FELHASZNALO", "NINCS_ILYEN_REKORD", "HIBAS_TETEL"]
        uzenet:
          type: [string, "null"]
          maxLength: 500
      additionalProperties: false
